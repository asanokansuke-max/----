<title>暮れのファンファーレ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Oswald:wght@500;600;700&family=Dela+Gothic+One&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@700&text=%E2%85%A0%E2%85%A1%E2%85%A2%E2%85%A3%E2%85%A4&display=swap">
<style>
/* Layout: dusk-green masthead (the turf at four o'clock in December), paper panels; one warm "late sun" accent. JRA grade colours carry meaning. */
:root{
  --bg:#ebece6; --panel:#fbfbf8; --panel-2:#f2f3ee; --ink:#18201b; --ink-soft:#3a443e; --muted:#66706a; --line:#d6dad1;
  --turf:#1b3a2e; --turf-2:#2a6a4a; --turf-ink:#eef3ee; --track:#3f8a5c; --rail:#ffffff;
  --accent:#c4782f; --accent-soft:#f6e6d2; --gold:#a8771c;
  --g1:#1a4fa0; --g2:#c0262d; --g3:#1a8a4a; --op:#6b5a3a;
  --good:#1f8a4c; --bad:#c0392b; --warn:#b5730b; --me:#fbefd9; --heart:#d2557a;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"Oswald","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --panel:#172019; --panel-2:#1c271f; --ink:#e7ece8; --ink-soft:#c6d0c9; --muted:#909e96; --line:#2b3a31;
  --turf:#122a20; --turf-2:#2a7a50; --turf-ink:#eef3ee; --track:#2f6e48; --rail:#dfe8e2;
  --accent:#e09a50; --accent-soft:#3a2a18; --gold:#d8ac4c;
  --g1:#4a7fd4; --g2:#df5258; --g3:#3aae6c; --op:#a8916a;
  --good:#46b878; --bad:#e2635a; --warn:#e0a03a; --me:#3a2e18; --heart:#e57a9a; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1512; --panel:#172019; --panel-2:#1c271f; --ink:#e7ece8; --ink-soft:#c6d0c9; --muted:#909e96; --line:#2b3a31;
  --turf:#122a20; --turf-2:#2a7a50; --turf-ink:#eef3ee; --track:#2f6e48; --rail:#dfe8e2;
  --accent:#e09a50; --accent-soft:#3a2a18; --gold:#d8ac4c;
  --g1:#4a7fd4; --g2:#df5258; --g3:#3aae6c; --op:#a8916a;
  --good:#46b878; --bad:#e2635a; --warn:#e0a03a; --me:#3a2e18; --heart:#e57a9a; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--turf)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.3}
.gold{color:var(--gold)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--turf),color-mix(in srgb,var(--turf) 80%,var(--accent)));color:var(--turf-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-in{max-width:1120px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-size:21px;letter-spacing:.08em;font-weight:800}
.brand small{display:block;font-size:11px;opacity:.8;letter-spacing:.08em}
.stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-left:auto;align-items:baseline}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-family:var(--f-num);font-size:17px;font-weight:600}
.stat span{font-size:10px;letter-spacing:.1em;opacity:.75}
.countdown{background:rgba(255,255,255,.14);border-radius:4px;padding:2px 8px;font-size:12px}
.tabs{max-width:1120px;margin:8px auto 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:transparent;border:0;color:var(--turf-ink);opacity:.75;padding:8px 14px;border-radius:6px 6px 0 0;white-space:nowrap;font-weight:500}
.tab[aria-current="true"]{background:var(--bg);color:var(--ink);opacity:1}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;text-align:center}

main{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 130px;display:grid;gap:20px}
.sec{display:grid;gap:10px;min-width:0}
.sec>h2{font-size:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec>h2 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:var(--accent)}
.warnb{border-color:var(--warn);color:var(--ink-soft)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.h3{font-size:15px;margin-bottom:6px}

.btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:7px 14px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--turf-2)}
.btn.pri{background:var(--turf-2);color:#fff;border-color:transparent}
.btn.gold{background:var(--accent);color:#fff;border-color:transparent}
.btn.warn{color:var(--bad)}
.btn:disabled,.seg:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.on-b{border-color:var(--accent);background:var(--accent-soft)}
.big-btn{padding:10px 24px;font-size:15px}
input[type=text]{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;max-width:100%;width:100%}

.gr{display:inline-block;font-family:var(--f-num);font-size:11px;font-weight:600;color:#fff;padding:0 6px;border-radius:3px;line-height:18px;vertical-align:1px}
.gr.G1{background:var(--g1)}.gr.G2{background:var(--g2)}.gr.G3{background:var(--g3)}.gr.OP{background:var(--op)}.gr.c{background:var(--muted)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-soft);background:var(--panel-2);white-space:nowrap}
.chip.good{color:var(--good);border-color:currentColor}.chip.bad{color:var(--bad);border-color:currentColor}.chip.warn{color:var(--warn);border-color:currentColor}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-family:var(--f-disp);font-weight:800;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.tbar{display:inline-block;height:7px;background:var(--panel-2);border:1px solid var(--line);border-radius:4px;overflow:hidden;vertical-align:middle}
.tbar i{display:block;height:100%;background:var(--accent)}
.hearts{display:inline-flex;gap:1px;font-size:12px}.hearts i{font-style:normal;color:var(--line)}.hearts i.on{color:var(--heart)}

.mails{display:grid;gap:8px}
.mail{display:flex;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);background:var(--panel);border-radius:8px;text-align:left;width:100%}
.mail:hover{border-color:var(--accent)}
.mail:disabled{opacity:.5}
.mail .from{font-size:12px;color:var(--muted)}
.mail .ttl{font-weight:700}
.news ul{margin:0;padding:0}
.news li{list-style:none;padding:6px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;min-width:0;align-items:center}
.news li .num{color:var(--muted);font-size:12px;flex:none;width:80px}

.steps{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);counter-reset:s}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px solid var(--line);margin-right:4px;font-family:var(--f-num);font-size:11px}
.steps li.now{color:var(--ink);font-weight:700}.steps li.now::before{background:var(--accent);border-color:var(--accent);color:#fff}
.steps li.done::before{content:"✓";background:var(--turf-2);border-color:var(--turf-2);color:#fff}

.horse{display:grid;gap:10px}
.hhead{display:flex;gap:12px;align-items:center}
.hhead h3{font-size:20px;letter-spacing:.04em}
.portrait{border:1px solid var(--line);background:linear-gradient(180deg,var(--accent-soft),var(--panel-2));border-radius:10px;padding:0;flex:none;line-height:0}
.portrait:hover{border-color:var(--accent)}
.meta{font-size:12px;color:var(--muted)}
.evgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.evgrid span{background:var(--panel-2);border-radius:6px;padding:4px 0;display:grid}
.evgrid small{font-size:10px;color:var(--muted)}.evgrid b{font-size:17px;line-height:1.2}
.evc{font-size:13px;display:flex;gap:6px;align-items:flex-start}
.evc .av{margin-top:1px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0}
.order-ctl,.mode{display:flex;flex-wrap:wrap;gap:4px}
.seg{border:1px solid var(--line);background:var(--panel);padding:5px 10px;border-radius:6px;font-size:13px}
.seg.sm{font-size:12px;padding:3px 9px}
.seg.on{background:var(--turf-2);border-color:var(--turf-2);color:#fff}
.order{background:var(--accent-soft);border-radius:6px;padding:7px 10px;font-size:13px}
.evalg{font-family:var(--f-num);font-size:20px;font-weight:600}
.person{display:grid;gap:10px}

.advance{position:fixed;left:0;right:0;bottom:0;z-index:4;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(6px);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.advance .in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.modal{position:fixed;inset:0;z-index:20;background:rgba(6,12,9,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:12px;width:100%;max-width:680px;padding:20px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);min-width:0}
.sheet.wide{max-width:900px}
.sheet h2{font-size:21px}
.from-line{font-size:12px;color:var(--muted);letter-spacing:.06em}
.letter{white-space:pre-wrap;line-height:1.95;font-size:15px}
.choices{display:grid;gap:8px}
.choices .btn{text-align:left;padding:10px 14px}
.evhead,.talkhead{display:flex;gap:14px;align-items:center}
.talklog{display:grid;gap:8px;max-height:46vh;overflow-y:auto;padding:4px 2px}
.line{margin:0;white-space:pre-wrap;line-height:1.85;font-size:15px}
.line.them{border-left:3px solid var(--accent);padding-left:12px}
.line.me{color:var(--muted);font-size:13px;text-align:right}
.line.me::before{content:"── "}
.line.ms{color:var(--heart);font-size:13px;font-weight:700}
.line.ng{color:var(--muted);font-size:13px;font-style:italic}
.touchstage{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:10px;padding:10px}
.touchbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.06em;background:var(--panel-2)}
tr.me td{background:var(--me);font-weight:700}
td.r,th.r{text-align:right}
.jlist{display:grid;gap:6px}
.jrow{border:1px solid var(--line);border-radius:6px;padding:6px 10px;display:grid;grid-template-columns:30px minmax(0,1fr) 92px;gap:10px;align-items:center}
.jinfo{display:grid;min-width:0}.jinfo b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jmeta{font-size:11px;color:var(--muted);line-height:1.4}
.jact{display:flex;justify-content:flex-end}.jact .btn,.jact .chip{width:100%;text-align:center}
.jrow.on{border-color:var(--turf-2);background:var(--panel-2)}
.comment{border-left:3px solid var(--turf-2);padding:4px 12px;font-size:14px}
.comment.warnc{border-color:var(--warn);color:var(--warn)}

.racehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.racehead .course{font-size:15px;color:var(--muted)}
.cvwrap{background:var(--turf);border-radius:8px;overflow:hidden}
.bc{position:relative;border-radius:8px;overflow:hidden;background:#123;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.spurt{background:rgba(8,16,12,.9);color:#eef3ee;padding:8px 12px 10px;border-radius:10px;display:flex}
.meter{position:relative;flex:1;height:14px;background:rgba(255,255,255,.18);border-radius:7px;overflow:hidden}
.meter b{position:absolute;top:0;bottom:0;background:rgba(255,209,102,.75)}
.meter i{position:absolute;top:-3px;bottom:-3px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 6px #fff;z-index:1}
.spurt .btn{padding:9px 16px;font-size:15px;font-weight:700}
.payboard{position:relative;background:#0b3a1c;border:3px solid #165a2c;border-radius:4px;color:#fff;font-size:13px;padding:4px;display:grid;gap:2px;overflow-x:auto}
.payboard .ph{display:flex;justify-content:space-between;gap:10px;padding:2px 64px 2px 6px;font-weight:700;letter-spacing:.06em;color:#f2f2f2}
.payboard .pg2{display:grid;grid-template-columns:1fr 1fr;gap:2px}
@media (max-width:560px){.payboard .pg2{grid-template-columns:1fr}}
.payboard .pr{display:grid;grid-template-columns:4.2em 1fr auto;align-items:center;background:#0a2a16;border-bottom:1px solid #1d5a33;min-height:22px}
.payboard .pl{font-weight:700;text-align:center;padding:2px 0;color:#fff;align-self:stretch;display:grid;place-items:center}
.payboard .pc{padding:0 8px;font-family:var(--f-num);letter-spacing:.04em;white-space:nowrap}
.payboard .pc.hit{color:#ffd166;font-weight:700}
.payboard .pv{padding:0 8px;text-align:right;white-space:nowrap;font-size:14px}
.c-tan{background:#1f4fb4}.c-fuku{background:#b21e2a}.c-waku{background:#1f6fb4}.c-wide{background:#139a9a}.c-uren{background:#7a2fa8}.c-utan{background:#c8a520;color:#111!important}.c-f3{background:#1a3fa0}.c-t3{background:#d9661c}
.payboard .pk{position:absolute;right:10px;top:4px;transform:rotate(-8deg);border:2px solid #ff5a5a;color:#ff5a5a;font-weight:900;padding:0 6px;border-radius:4px;font-family:var(--f-disp);opacity:.9}
@media (prefers-reduced-motion:no-preference){.payboard .pk{animation:stamp .5s .3s both}@keyframes stamp{from{transform:scale(2.2) rotate(-8deg);opacity:0}to{transform:rotate(-8deg);opacity:.9}}}
.audbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.aud{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--turf-ink);border-radius:999px;padding:1px 10px;font-size:11px;opacity:.6}
.aud.on{opacity:1;background:rgba(255,255,255,.16)}
.audbar input[type=range]{width:80px;accent-color:var(--accent)}
.phbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--turf-ink);border-radius:999px;padding:3px 10px;font-size:12px;position:relative}
.phbtn .badge{position:absolute;top:-6px;right:-6px;margin:0}
.call-ov{position:fixed;inset:0;z-index:40;background:rgba(5,10,8,.82);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.call-card{width:min(100%,400px);background:linear-gradient(180deg,#1d2b25,#0f1714);color:#eef3ee;border-radius:22px;padding:26px 20px;display:grid;gap:14px;justify-items:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.call-card:not(.ringing){justify-items:stretch}
.call-card .av.unk,.av.unk{background:#55606a}
.call-name{font-family:var(--f-disp);font-size:26px;font-weight:800;letter-spacing:.04em;text-align:center}
.call-sub{font-size:12px;opacity:.75;letter-spacing:.08em}
.ringing .av{animation:ringpulse 1.1s ease-in-out infinite}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 0 rgba(120,220,160,.55)}50%{box-shadow:0 0 0 18px rgba(120,220,160,0)}}
@media (prefers-reduced-motion:reduce){.ringing .av{animation:none}}
.call-btns{display:flex;gap:48px;margin-top:18px}
.cbtn{width:72px;height:72px;border-radius:50%;border:0;color:#fff;font-weight:700;font-size:13px}
.cbtn.yes{background:#2fb35f}.cbtn.no{background:#e04848}.cbtn.sm{width:auto;height:auto;border-radius:999px;padding:8px 22px}
.call-log{display:grid;gap:8px;max-height:46vh;overflow-y:auto}
.call-card .line.them{border-color:#2fb35f}.call-card .line.me{color:#aab8b0}
.call-card .btn{background:rgba(255,255,255,.08);color:#eef3ee;border-color:rgba(255,255,255,.2)}
.call-card .btn.pri{background:#2a7a50}
.phone{display:grid;gap:12px}
.phbar{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.phtabs{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.maillist{display:grid;gap:4px;max-height:60vh;overflow-y:auto}
.mrow{display:flex;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 4px;width:100%}
.mrow.unread{background:var(--accent-soft)}
.mrow.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:2px}
.msubj{display:block;font-size:13px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mailphoto{background:linear-gradient(180deg,#bfe0f3,#9fd08e);border-radius:10px;display:grid;place-items:center;padding:8px}
.sent{background:var(--panel-2);border-radius:8px;padding:8px 10px;font-size:13px}
.spurt{flex-direction:column;align-items:stretch;gap:6px}
.sp-head{color:#eef3ee;font-weight:700;font-size:12px;text-align:center}.sp-head .gold{color:#ffd166}
.sp-row{display:flex;gap:10px;align-items:center}
.meter2{position:relative;flex:1;height:22px;background:rgba(255,255,255,.14);border-radius:6px}
.meter2 b{position:absolute;top:0;bottom:0;background:rgba(255,209,102,.8);border-radius:4px}
.meter2 i{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 8px #fff;border-radius:2px;z-index:1}
.meter2 .ml,.meter2 .mr{position:absolute;bottom:-16px;font-size:10px;color:#cfd8d2}
.meter2 .ml{left:0}.meter2 .mr{right:0}
.sp-help{font-size:12px;color:#eef3ee;text-align:center;margin-top:8px}
.spurt.now{box-shadow:0 0 0 2px #ffd166}
