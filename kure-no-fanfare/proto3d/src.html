/* 暮れのファンファーレ競馬会 (KRA) mark: an open ring with a horse's head and mane drawn as one swoosh, then "KRA" */
function drawLogo(c,x,y,S,col,withText){c.save();c.translate(x,y);c.strokeStyle=col;c.fillStyle=col;c.lineCap='round';c.lineJoin='round';
  c.lineWidth=S*.11;c.beginPath();c.arc(0,0,S*.5,Math.PI*.62,Math.PI*2.35);c.stroke();   // open ring (gap at lower left)
  c.lineWidth=S*.09;c.beginPath();c.moveTo(-S*.3,S*.3);c.bezierCurveTo(-S*.12,-S*.05,S*.02,-S*.3,S*.24,-S*.2);c.bezierCurveTo(S*.34,-S*.15,S*.3,-S*.02,S*.18,S*.02);   // neck + head
  c.moveTo(-S*.08,S*.02);c.bezierCurveTo(0,-S*.12,S*.08,-S*.12,S*.14,-S*.06);c.stroke();   // mane line
  if(withText){c.font=`italic 900 ${S*.62}px "Helvetica Neue","Arial Black",Arial`;c.textBaseline='middle';c.fillText('KRA',S*.68,S*.04);}
  c.restore();}
