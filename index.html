<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百万石フットボール</title>
<style>
:root{
  --bg:#f5f1e8;--panel:#ffffff;--panel2:#faf7f0;--ink:#1d2433;--muted:#6b7280;--line:#e4ddcd;
  --gold:#b8862a;--gold-soft:#f3e6c6;--indigo:#1f3a68;--indigo-soft:#e3e9f4;
  --win:#1f8a4c;--loss:#c0392b;--draw:#8a8a8a;--warn:#c27c0e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141d;--panel:#191f2c;--panel2:#1e2535;--ink:#e9e6df;--muted:#9aa3b2;--line:#2a3245;
  --gold:#dcb257;--gold-soft:#3a3120;--indigo:#8fb0ea;--indigo-soft:#22304a;
  --win:#3fbf74;--loss:#e5675a;--draw:#9aa3b2;--warn:#e6a63a;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#10141d;--panel:#191f2c;--panel2:#1e2535;--ink:#e9e6df;--muted:#9aa3b2;--line:#2a3245;
  --gold:#dcb257;--gold-soft:#3a3120;--indigo:#8fb0ea;--indigo-soft:#22304a;
  --win:#3fbf74;--loss:#e5675a;--draw:#9aa3b2;--warn:#e6a63a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 16px}
.main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none}
/* リスト系のタブはページ全体を動かさず、リストの枠だけがスクロールする */
.fill{overflow:hidden}
.fill>.wrap{height:100%;display:flex;flex-direction:column}
.fill>.wrap>*{flex-shrink:0}
.fill .grow{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.fill .grow>*{flex-shrink:0}
.fill .grow>.list-scroll,.fill .grow>.card-scroll,.fill>.wrap>.card-scroll{flex:1 1 0;min-height:120px;max-height:none}
.fill .side{flex:0 1 auto;max-height:26%;overflow-y:auto;overscroll-behavior:none}
.title-wrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:none;padding-bottom:24px}
.card-scroll .grid,.card-scroll .mk{align-items:start}
header.top{flex:none;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1040px;margin:0 auto;padding:10px 16px 0}
.club-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.club-name{font-size:19px;font-weight:800;letter-spacing:.02em}
.club-name .mark{color:var(--gold)}
.meta{color:var(--muted);font-size:13px}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat .neg{color:var(--loss)}
.trust{display:inline-block;width:70px;height:7px;background:var(--line);border-radius:4px;vertical-align:middle;overflow:hidden;margin-left:4px}
.trust i{display:block;height:100%;background:var(--gold)}
nav.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;overscroll-behavior:none;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.grid{display:grid;gap:14px;margin-top:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}
.vs .side{flex:1;min-width:0}
.vs .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.vs .x{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo)}
.bar.gold i{background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--gold-soft);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--win)}
tr.down td:first-child{box-shadow:inset 3px 0 var(--loss)}
tr.ply td:first-child{box-shadow:inset 3px 0 #8fd1a8}
tr.swap td:first-child{box-shadow:inset 3px 0 var(--warn)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list-scroll{max-height:min(62vh,560px);overflow:auto;overscroll-behavior:none;border:1px solid var(--line);border-radius:8px}
table.sticky th{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:inset 0 -1px var(--line)}
table.sticky td:nth-child(1),table.sticky th:nth-child(1){position:sticky;left:0;width:var(--c1,46px);min-width:var(--c1,46px);background:var(--panel);z-index:1}
table.sticky td:nth-child(2),table.sticky th:nth-child(2){position:sticky;left:var(--c1,46px);background:var(--panel);z-index:1;box-shadow:inset -1px 0 var(--line)}
table.sticky th:nth-child(1),table.sticky th:nth-child(2){z-index:3}
table.sticky tr.me td{background:var(--gold-soft)}
.card-scroll{position:relative;max-height:min(66vh,640px);overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);overscroll-behavior:none}
.card-scroll .card{box-shadow:none}
.card-scroll h3.grp{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.card-scroll h3.grp:first-of-type{margin-top:4px}
@keyframes flash{from{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}to{}}
.flash,.flash td{animation:flash 1.6s ease-out}
@media (prefers-reduced-motion:reduce){.flash,.flash td{animation:none;outline:2px solid var(--gold)}}
.pos{display:inline-block;min-width:30px;text-align:center;border-radius:5px;font-size:11px;font-weight:800;padding:1px 4px;color:#fff}
.pos.GK{background:#b07a12}.pos.DF{background:#2f6db5}.pos.MF{background:#2f8f55}.pos.FW{background:#c2453a}
.ovr{font-weight:800;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.tag{display:inline-block;font-size:10.5px;line-height:1.55;padding:0 5px;border-radius:8px;background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.tag.inj{background:#f8dcd8;color:#a02b1f}
.tag.rest{background:var(--line);color:var(--muted)}
.tag.xi{background:var(--gold-soft);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1420}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel2);text-align:left}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.on{border-color:var(--gold);background:var(--gold-soft)}
.news{list-style:none;margin:0;padding:0;font-size:13.5px}
.news li{padding:6px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
.news .r{color:var(--muted);font-size:11.5px;margin-right:6px}
.res{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;margin-right:3px}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}
.mk{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mk .card{padding:12px}
.fac{display:flex;gap:12px;align-items:center}
.fac .ic{font-size:26px;width:38px;text-align:center}
.lv{display:flex;gap:3px;margin:4px 0}
.lv i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.lv i.on{background:var(--gold)}
.warn{border-left:4px solid var(--warn);background:var(--gold-soft);padding:8px 10px;border-radius:6px;font-size:13px;margin-top:10px}
.footer-bar{flex:none;background:var(--panel);border-top:1px solid var(--line);z-index:6}
.footer-inner{max-width:1040px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between}
.footer-inner .info{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:800;font-size:15px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;overscroll-behavior:none;padding:18px;border:1px solid var(--line)}
.modal-box h2{margin:0 0 8px;font-size:19px}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 4px}
.score .t{flex:1;text-align:center;font-weight:800;overflow-wrap:anywhere}
.score .n{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.clock{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.log{list-style:none;padding:0;margin:10px 0;max-height:240px;overflow:auto;overscroll-behavior:none;font-size:13.5px}
.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.log .m{display:inline-block;width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .goal{font-weight:800}
.log .us{color:var(--win)}
.log .them{color:var(--loss)}
.rep h4,.card h4{margin:4px 0 6px;font-size:16px}
.rep-from{font-size:12.5px;color:var(--indigo);font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--indigo);border-color:var(--indigo);color:var(--panel)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiers .btn{padding:6px 4px;line-height:1.35}
.offplan{margin:0;padding-left:20px;font-size:13.5px}
.offplan li{padding:3px 0}
.offplan li.done{color:var(--muted);text-decoration:line-through}
.offplan li.now{font-weight:700}
.offplan li.now::marker{color:var(--gold)}
.rbar{position:relative;height:12px;border-radius:6px;background:var(--line);margin:8px 0 2px;overflow:hidden}
.rbar i{position:absolute;top:0;bottom:0;border-radius:6px}
.rbar i.pot{background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.rbar i.now{background:var(--indigo);top:2px;bottom:2px}
.rbar-axis{display:flex;justify-content:space-between;font-size:10.5px;margin-bottom:6px}
.infobar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:8px 0;padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.infobar details{flex-basis:100%;color:var(--muted)}
summary{cursor:pointer;color:var(--indigo);font-weight:600}
.infobar .btn{padding:3px 10px;font-size:12px}
.infobar .regions{flex-basis:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.infobar .regions .btn{line-height:1.3;padding:4px 2px}
.pcell{white-space:normal!important;min-width:5em;max-width:6.5em}
.pname{font-weight:600;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.ptags{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.ptags .tag{font-size:9.5px;padding:0 4px;line-height:1.5}
.ptags:empty{display:none}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots i.done{background:var(--muted)}
.dots i.now{background:var(--gold)}
.pdgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.pdh{margin:14px 0 4px;font-size:13px;color:var(--muted)}
td.pcell{cursor:pointer}
.seg.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;overscroll-behavior:none;margin-top:0}
.seg.scrollx::-webkit-scrollbar{display:none}
.seg.scrollx button{flex:none}
.nego-log{list-style:none;margin:0 0 10px;padding:8px 10px;max-height:150px;overflow-y:auto;background:var(--panel2);border-radius:8px;font-size:13px;overscroll-behavior:none}
.nego-log li{padding:3px 0}
.nego-log .nl-me{color:var(--indigo)}
.nego-log .nl-info{color:var(--muted);font-size:12px}
.nego-wait{text-align:center;padding:14px 0}
.nego-wait p{margin:10px 0 0;color:var(--muted)}
.spin{width:28px;height:28px;margin:0 auto;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.prow{cursor:pointer}
.prow:hover td{background:var(--panel2)}
.pstars{line-height:1;margin-top:1px}
.pstars .stars{font-size:9px}
.pstate{white-space:nowrap}
.pstate .bar{display:inline-block;width:32px;vertical-align:middle;margin-right:3px}
table.sticky td,table.sticky th{padding:6px 4px}
table.sticky td:first-child,table.sticky th:first-child{padding-left:6px}
.rshort{font-size:9.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.cal{list-style:none;margin:0;padding:0}
.cal-row{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:start;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px}
.cal-row.done{opacity:.6}
.cal-row.now{background:var(--gold-soft);border-radius:8px;opacity:1}
.cal-d{font-variant-numeric:tabular-nums;font-size:12.5px;line-height:1.35}
.cal-ev{font-size:11.5px;color:var(--indigo);margin-top:2px}
.cal-r{display:flex;align-items:center;gap:4px;white-space:nowrap}
.subhead{display:flex;align-items:center;gap:10px;margin-top:10px}
.subhead b{font-size:16px}
.back{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--indigo)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (min-width:700px){.menu{grid-template-columns:repeat(9,1fr)}}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left;box-shadow:var(--shadow);min-width:0}
.tile:hover{border-color:var(--gold)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:18px;line-height:1.2}
.tile b{font-size:13.5px}
.tile .st{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile .badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:var(--loss);color:#fff;font-size:10.5px;font-style:normal;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
.matchcard{padding:10px 14px}
.matchcard h3{margin-bottom:6px}
.svgi{width:20px;height:20px;display:block}
.fac .ic .svgi{width:28px;height:28px;color:var(--gold)}
.tile .ic{color:var(--indigo)}
.mood{display:inline-block;width:9px;height:9px;border-radius:50%;vertical-align:middle;margin-right:3px}
.mood.good{background:var(--win)}.mood.ok{background:#7fb3d5}.mood.low{background:var(--warn)}.mood.bad{background:var(--loss)}
#app{position:relative}
.sheet-back{position:absolute;inset:0;background:rgba(10,14,22,.45);z-index:8;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
/* 画面の真ん中に浮かぶパネル。後ろのホームは透けて見える */
.sheet{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 24px), 960px);height:min(calc(100% - 28px), 860px);z-index:9;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.28);overflow:hidden}
.sheet.enter{animation:sheetPop .22s cubic-bezier(.2,.8,.2,1)}
.sheet-back.enter{animation:fadeIn .22s ease-out}
@keyframes sheetPop{from{opacity:0;transform:translate(-50%,-46%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet.enter,.sheet-back.enter{animation:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px 2px 16px}
.sheet-title{display:flex;align-items:center;gap:8px;color:var(--indigo)}
.sheet-title b{font-size:17px;color:var(--ink)}
.sheet-x{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.sheet-x svg{width:16px;height:16px}
.sheet-body{flex:1;min-height:0}
.sheet-body>.wrap{max-width:none;padding:0 12px 12px}
.menu{grid-template-columns:repeat(2,1fr)}
@media (min-width:700px){.menu{grid-template-columns:repeat(4,1fr)}}
.viewtabs{margin:4px 0 0}
.reports .grp{margin:2px 0 8px}
ol.rank{margin:0;padding:0;list-style:none}
ol.rank li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
ol.rank .rk{width:18px;color:var(--muted);font-variant-numeric:tabular-nums}
ol.rank li span:nth-child(2){flex:1;min-width:0}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.kv{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:13.5px}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.plus{color:var(--win)}.minus{color:var(--loss)}
.title-screen{max-width:560px;margin:8vh auto 0;padding:0 16px;text-align:center}
.title-screen h1{font-size:32px;margin:0;letter-spacing:.06em}
.title-screen h1 span{color:var(--gold)}
.title-screen p{color:var(--muted)}
.title-screen input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;max-width:340px;text-align:center}
.gold-line{height:3px;width:80px;background:var(--gold);margin:14px auto;border-radius:2px}
.ladder{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.ladder span{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ladder span.on{background:var(--gold);color:#fff;border-color:var(--gold)}
@media (max-width:560px){
  th.hide-s,td.hide-s{display:none}
  .score .n{font-size:32px;min-width:84px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
<script>
'use strict';
// ===================== 定数 =====================
const SAVE_KEY = 'hyakumangoku-football-v1';

function pickRole(pos){ return pick(Object.keys(ROLES[pos])); }
function roleOf(p){ const r = ROLES[p.pos]?.[p.role]; return r || null; }
function roleShort(p){ return roleOf(p)?.short || ''; }
function roleEffect(xi){
  let att = 0, def = 0, fit = 0;
  for(const s of xi){
    if(s.pen || s.p.ghost) continue;
    const r = roleOf(s.p); if(!r) continue;
    const learn = s.p.roleNew>0 ? 0.5 : 1;
    const match = r.tac.includes(S.tactic) ? 1.5 : 1;
    if(match>1) fit++;
    att += (r.att||0) * match * learn * 0.35;
    def += (r.def||0) * match * learn * 0.35;
  }
  const k = FORM_KEYS[S.formation];
  const keyOk = k && xi.some(s=>!s.pen && s.slot===k.pos && k.roles.includes(s.p.role));
  if(keyOk){ att += k.att; def += k.def; }
  // 平均的な噛み合いで0になるよう基準値を引く（相手チームとの公平さを保つ）
  return {att: att-2.3, def: def-2.0, fit, keyOk, key:k};
}
function changeRole(id, role){
  const p = S.players.find(x=>x.id===id); if(!p || !ROLES[p.pos][role] || p.role===role) return;
  p.role = role; p.roleNew = 4;
  addNews(`${p.name}を${ROLES[p.pos][role].name}として起用する方針に。慣れるまで約4週間かかる。`);
  save(); render(); showPlayer(id);
}

function yen(v){
  v=Math.round(v); const neg=v<0; v=Math.abs(v);
  const s = v>=10000 ? Math.floor(v/10000)+'億'+(v%10000? (v%10000)+'万':'') : v+'万';
  return (neg?'-':'')+s+'円';
}
function poisson(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }

// 年俸（万円/年）：能力40で約300万円、10上がるごとに約2.1倍（地域リーグ〜JFLは100〜600万、J1主力は数千万円）
function calcSalary(ovr){ return Math.max(80, Math.round(300 * Math.pow(2.1, (ovr-40)/10))); }
function playerValue(p){
  const base = calcSalary(p.ovr)*1.2;
  const ageF = p.age<=21?1.4:p.age<=25?1.2:p.age<=29?1:p.age<=32?0.7:0.4;
  const potF = 1+Math.max(0,p.pot-p.ovr)/60;
  return Math.round(base*ageF*potF+50);
}

function genTeam(div, ex){

  let name;
  const used = new Set((S&&S.teams||[]).map(t=>t.name));
  do{
    if(div<=1) name = pick(CITY_LOCAL)+' '+pick(SUFFIX); // 北信越リーグは地元の地域リーグ

    else name = pick(CITY_NATION)+' '+pick(SUFFIX);
  }while(used.has(name));
  return {name, str, att:str+R(-4,4), def:str+R(-4,4), isMe:false};
}

function makeSchedule(n){
  const idx=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=idx[i], b=idx[n-1-i];
      pairs.push((r+i)%2 ? [b,a] : [a,b]);
    }
    rounds.push(pairs);
    idx.splice(1,0,idx.pop());
  }
  // シャッフル（前半）
  for(let i=rounds.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rounds[i],rounds[j]]=[rounds[j],rounds[i]]; }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}

    staff:{}, staffMarket:[], inbox:[], prospects:[], companies:[], visitsLeft:1, watchLeft:1, mentor:0, cfSeason:0, foreignCands:[], fscoutTrip:null,
  };
  const comp = {GK:2,DF:6,MF:6,FW:4};
  for(const pos in comp) for(let i=0;i<comp[pos];i++){
    const age = RI(19,33);
    const ovr = R(25,37) + (age>=24&&age<=30?2:0);
    const pot = age<=22 ? ovr+R(6,20) : age<=26 ? ovr+R(0,7) : ovr;
    S.players.push(makePlayer(pos, ovr, age, pot));
  }
  // 希望の星
  const star = makePlayer('FW', 33, 17, 72); star.name = pick(SURN)+' '+pick(GIVEN);
  S.players.push(star);
  S.players.forEach(p=>p.mor=RI(50,70));
  // 就任時のスタッフ（弱小クラブらしい陣容）
  S.staff = {manager:genStaff('manager',33), hc:genStaff('hc',32), physical:genStaff('physical',26), gk:genStaff('gk',26),
             youth:genStaff('youth',26), scout:genStaff('scout',26), sales:[genStaff('sales',30)]};
  S.staff.manager.lic = 'A級'; S.staff.manager.years = 2;
  S.companies = initCompanies();
  S.teams = [{name:S.club, isMe:true}];
  for(let i=1;i<DIVS[1].teams;i++) S.teams.push(genTeam(1));
  startSeason();
  addNews(`${S.club}のGM（強化部長）に就任。監督は${S.staff.manager.name}。目標は金沢からJ1の頂点へ！`);
  addNews(`ユースから期待の17歳FW ${star.name} がトップ昇格。`);
  refreshMarket(5);
  save();
}

function startSeason(){
  S.teams.forEach(resetTable);
  S.schedule = makeSchedule(S.teams.length);
  S.evFired = [];
  S.round = 0;
  S.sponsor = Math.round(DIVS[S.div].sponsor*0.8 + S.fans*2);
  S.visitsLeft = salesTeam().length; S.watchLeft = watchPerWeek();
  refreshStaffMarket();
  S.fin = {income:0, expense:0};
  if(S.ledger) S.lastLedger = S.ledger;
  S.ledger = {in:{}, out:{}};
  S.matchLog = [];
  S.players.forEach(p=>{p.sg=0; p.sa=0;});
  computeTarget(); // 目標順位 = 戦力順位
}

// ===================== 戦力計算 =====================
function eff(p){ return p.ovr*(0.72+0.28*p.cond/100)*(0.94+0.12*(p.mor??50)/100)*(p.playHurt&&p.inj>0?0.85:1)*(p.rust>0?0.93:1); }
function getLineup(ignoreCond){
  const f = FORMATIONS[S.formation];
  const need = {GK:1, DF:f.DF, MF:f.MF, FW:f.FW};
  const avail = S.players.filter(p=>(p.inj===0 || p.playHurt) && !p.rest && !p.restOnce && !p.loan);
  const score = p=> (p.promise?1000:0) + (ignoreCond ? p.ovr : eff(p));
  const used = new Set(); const xi = [];
  for(const pos of ['GK','DF','MF','FW']){
    const c = avail.filter(p=>p.pos===pos).sort((a,b)=>score(b)-score(a)).slice(0,need[pos]);
    c.forEach(p=>{used.add(p.id); xi.push({p, slot:pos, pen:false});});
    need[pos]-=c.length;
  }
  for(const pos of ['GK','DF','MF','FW']){
    while(need[pos]>0){
      const rest = avail.filter(p=>!used.has(p.id)).sort((a,b)=>score(b)-score(a));
      if(rest.length){ used.add(rest[0].id); xi.push({p:rest[0], slot:pos, pen:true}); }
      else xi.push({p:{id:'ghost'+Math.random(),name:'ユース（臨時）',pos,ovr:18,cond:100,age:16,ghost:true}, slot:pos, pen:false});
      need[pos]--;
    }
  }
  return xi;
}
function teamRating(xi){
  const f = FORMATIONS[S.formation];
  const g = {GK:[],DF:[],MF:[],FW:[]};
  xi.forEach(s=>g[s.slot].push(eff(s.p)*(s.pen?(s.slot==='GK'?0.55:0.78):1)));
  const avg = a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : 15;
  const GK=avg(g.GK), DF=avg(g.DF), MF=avg(g.MF), FW=avg(g.FW);
  const m = S.staff.manager;
  const mb = m ? (m.abil-45)/10 + (m.style===S.tactic?1.5:0) : -3;
  const re = roleEffect(xi);
  const att = FW*0.5 + MF*0.38 + DF*0.12 + f.att + mb + re.att;
  const def = DF*0.48 + GK*0.27 + MF*0.25 + f.def + mb + re.def;
  return {att, def, ovr:(att+def)/2, roles:re};
}
function lam(att, def, home, mul){ return clamp(1.25*Math.exp((att-def)/13)*(home?1.12:0.9)*mul, 0.12, 4.8); }

// ===================== 進行 =====================
function addNews(t){ S.news.unshift({s:S.season, r:S.round, t}); S.news = S.news.slice(0,40); }
function changeFans(rate, flat, div){
  const before=S.fans; let g = S.fans*rate + flat;
  if(g>0) g *= Math.max(0.03, 1 - S.fans/FAN_CAP[div===undefined?S.div:div]);
  S.fans = Math.max(200, Math.round(S.fans+g)); return S.fans-before;
}
function earn(v, cat='other'){ S.money+=v; S.fin.income+=v; S.ledger=S.ledger||{in:{},out:{}}; S.ledger.in[cat]=(S.ledger.in[cat]||0)+v; }
function spend(v, cat='other'){ S.money-=v; S.fin.expense+=v; S.ledger=S.ledger||{in:{},out:{}}; S.ledger.out[cat]=(S.ledger.out[cat]||0)+v; }

function applyTraining(){
  const t = TRAINING[S.training];
  const facG = 0.8 + 0.15*S.fac.training;
  const medRed = (1 - (S.fac.medical-1)*0.15) * (1.15 - staffAb('physical')/250);
  const youthM = (0.8 + staffAb('youth')/250) * (S.mentor===S.season?1.15:1);
  const gkM = 0.7 + staffAb('gk')/150;
  const injured = [];
  for(const p of S.players){
    if(p.loan) continue;
    if(p.roleNew>0) p.roleNew--;
    if(p.inj>0 && !p.playHurt){ healWeek(p); p.cond = clamp(p.cond+10,30,100); continue; }
    if(p.playHurt) healWeek(p);
    const ageF = p.age<=20?1.3:p.age<=23?1:p.age<=26?0.6:p.age<=29?0.25:0;
    if(t.g>0 && ageF>0 && !S.snow){
      p.ovr = Math.min(p.pot, p.ovr + Math.max(0,p.pot-p.ovr)*0.03*wk()*t.g*ageF*facG*(p.age<=23?youthM:1)*(p.pos==='GK'?gkM:1)*R(0.5,1.5));
    }
    p.cond = clamp(p.cond + t.c + (p.rest?12:0), 30, 100);
    if(!p.rest && !(p.inj>0) && Math.random() < t.inj*injuryRisk(p)*Math.min(1,wk()*1.3)){ injure(p, S.training==='hard' ? (Math.random()<0.5?'overuse':'muscle') : (Math.random()<0.6?'muscle':'random')); }
  }
  S.snow = false;
  if(S.restBack){ S.training = S.restBack; S.restBack = null; }
}

function applyPR(){
  const a = PR[S.pr]; if(!a || S.pr==='none') return null;
  if(S.money < a.cost){ addNews(`資金不足で「${a.name}」は中止になった。`); return null; }
  spend(Math.round(a.cost*wk()), 'pr');
  let msg = `「${a.name}」を実施。`;
  const df = changeFans(a.fans[0]*wk(), a.fans[1]*Math.sqrt(DIV_MULT[S.div])*wk());
  msg += ` ファン +${df}人`;
  if(a.trust) S.trust = clamp(S.trust+a.trust,0,100);
  if(a.youth) S.youthBonus = Math.min(S.youthBonus+1, 8);
  if(a.merch){
    const sold = Math.round(R(400,3000) * (0.5 + S.fans/2000));
    earn(sold, 'goods'); msg += `・グッズ売上 ${yen(sold)}`;
  }
  addNews(msg);
  return msg;
}

function simAI(h,a){
  const H=S.teams[h], A=S.teams[a];
  const gh = poisson(lam(H.att+R(-3,3), A.def+R(-3,3), true, 1));
  const ga = poisson(lam(A.att+R(-3,3), H.def+R(-3,3), false, 1));
  record(h,a,gh,ga);
}
function record(h,a,gh,ga){
  const H=S.teams[h], A=S.teams[a];
  H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
  if(gh>ga){H.w++;A.l++;H.pts+=3;H.form.push('W');A.form.push('L');}
  else if(gh<ga){A.w++;H.l++;A.pts+=3;H.form.push('L');A.form.push('W');}
  else{H.d++;A.d++;H.pts++;A.pts++;H.form.push('D');A.form.push('D');}
}

const GOAL_LINES = ['豪快なミドルシュート！','ヘディングで叩き込む！','鮮やかなカウンターから！','PKを冷静に決める！','こぼれ球を押し込んだ！','華麗なループシュート！','セットプレーから！','ドリブル突破からのゴール！'];
const OPP_LINES = ['失点…守備が崩された。','相手のカウンターに沈む。','セットプレーから失点。','ミドルシュートを決められる。','一瞬の隙を突かれた。'];
const FLAVOR = ['スタンドから「金沢コール」が響く。','雨の中、激しい攻防が続く。','GKのビッグセーブ！','惜しい！シュートはポスト直撃。','中盤で激しいボールの奪い合い。','サポーターの太鼓が鳴り響く。','決定機を逃した…','相手の猛攻をしのぐ。'];

function pickScorer(xi){
  const w = xi.map(s=>({p:s.p, w:(s.slot==='FW'?5:s.slot==='MF'?2.5:s.slot==='DF'?0.8:0.02)*Math.pow(s.p.ovr/40,2)}));
  let tot = w.reduce((a,b)=>a+b.w,0), r=Math.random()*tot;
  for(const x of w){ r-=x.w; if(r<=0) return x.p; }
  return w[0].p;
}

function playOurMatch(h,a){
  const home = h===0; const oi = home?a:h; const opp = S.teams[oi];
  const xi = getLineup(); const rt = teamRating(xi); const t = TACTICS[S.tactic];
  let own=t.own, opm=t.opp;
  if(t.counter){ const stronger = opp.str > rt.ovr; own = stronger?1.08:0.9; opm = stronger?0.85:0.95; }
  const gu = poisson(lam(rt.att, opp.def+R(-3,3), home, own));
  const go = poisson(lam(opp.att+R(-3,3), rt.def, !home, opm));
  const events=[];
  for(let i=0;i<gu;i++){ const s=pickScorer(xi); events.push({m:RI(1,90), us:true, p:s}); }
  for(let i=0;i<go;i++) events.push({m:RI(1,90), us:false});
  [...FLAVOR].sort(()=>Math.random()-0.5).slice(0,RI(3,5)).forEach(t=>events.push({m:RI(1,90), flavor:t}));
  events.sort((x,y)=>x.m-y.m);
  events.forEach(e=>{
    if(e.flavor) return;
    if(e.us){ e.text = `ゴール！ ${e.p.name} ${pick(GOAL_LINES)}`; if(!e.p.ghost){e.p.goals++; e.p.sg++;} }
    else e.text = `${opp.name} ${pick(OPP_LINES)}`;
  });
  // 選手の状態
  const ids = new Set(xi.map(s=>s.p.id));
  const medRed = (1 - (S.fac.medical-1)*0.15) * (1.15 - staffAb('physical')/250);
  const injuredNow=[];
  for(const p of S.players){
    if(p.loan) continue;
    if(ids.has(p.id)){
      p.apps++; p.sa++; p.cond = clamp(p.cond-18,30,100);
      if(p.age<=27) p.ovr = Math.min(p.pot, p.ovr + Math.max(0,p.pot-p.ovr)*0.012*wk());
      afterMatchInjury(p);
      if(!(p.inj>0) && Math.random()<0.02*injuryRisk(p)*Math.min(1,wk()*1.3)){ const scene = injure(p, Math.random()<0.6?'contact':'muscle'); injuredNow.push([p,scene]); }
    } else if(p.inj===0){ p.cond = clamp(p.cond+8,30,100); }
    p.cond = clamp(p.cond + 6 + (S.fac.medical-1)*2 + staffAb('physical')/40, 30, 100);
  }
  injuredNow.forEach(([p,scene])=>{ events.push({m:RI(10,89), text:`負傷：${p.name}が${scene}。そのまま交代（${injLabel(p)}・全治${p.inj}週）`, inj:true}); });
  events.sort((x,y)=>x.m-y.m);
  if(home) record(0,oi,gu,go); else record(oi,0,go,gu);
  (S.matchLog = S.matchLog || [])[S.round] = {gu, go};
  const res = gu>go?'W':gu<go?'L':'D';
  S.results.push(res); S.results = S.results.slice(-10);
  moraleAfterMatch(ids, res);
  return {opp, home, gu, go, events, res, rating:rt, xi};
}

function seasonFanGain(res){
  const k = wk();
  if(res==='W') return changeFans(0.04*k, 15*Math.sqrt(DIV_MULT[S.div])*k);
  if(res==='D') return changeFans(0.008*k, 3*k);
  return changeFans(-0.015*k, 0);
}

function offPitchInjury(scene){
  const c = S.players.filter(p=>!(p.inj>0) && !p.loan); if(!c.length) return null;
  const p = pick(c);
  injure(p, 'random');
  return `${p.name}が${scene}、${injLabel(p)}（全治${p.inj}週）。`;
}

  {w:0.6, f:()=>{S.players.forEach(p=>p.cond=clamp(p.cond+10,30,100)); return '犀川沿いの合同ランニングで選手たちがリフレッシュ。全員のコンディションUP';}},

function randomEvent(){
  if(Math.random()>0.38*wk()) return null;
  const pool = EVENTS.filter(e=>!e.ok||e.ok());
  let tot = pool.reduce((a,b)=>a+b.w,0), r=Math.random()*tot;
  for(const e of pool){ r-=e.w; if(r<=0){ const t=e.f(); if(t) addNews(t); return t; } }
  return null;
}

function refreshMarket(n){
  S.market = S.market.filter(p=>!p.stale);
  S.market.forEach(p=>p.age2=(p.age2||0)+1);
  S.market = S.market.filter(p=>p.age2<4);
  for(let i=0;i<n;i++) S.market.push(genCandidate());
  S.market = S.market.slice(-8);
}
function genCandidate(kind){
  const r = Math.random();
  kind = kind || (r<0.17 ? 'free' : r<0.32 && S.div<TOP ? 'loan' : 'normal');
  if(kind==='loan') return genLoanee();
  const b = DIVS[S.div].base; const mid=(b[0]+b[1])/2;
  const sc = S.fac.scout;
  const foreign = Math.random()<0.12;
  const age = kind==='free' ? RI(25,34) : RI(18,33);
  let ovr = mid + (sc-1)*3 + R(-13,7) + (foreign?4:0);
  if(Math.random()<0.08) ovr += R(5,10); // 掘り出し物
  const pot = age<=21 ? ovr+R(4,16+sc*2) : age<=25 ? ovr+R(1,8+sc) : age<=28 ? ovr+R(0,3) : ovr;
  const p = makePlayer(randPos(), ovr, age, pot, foreign);
  p.fee = Math.round(playerValue(p) * (foreign?1.15:1));
  if(kind==='free'){ p.fee = 0; p.free = true; p.salary = Math.round(p.salary*1.35); p.bio = pick(FREE_BIOS); }
  return p;
}

function payWeekly(home){
  const out = {ticket:0, att:0, sponsor:0, salary:0, upkeep:0};
  out.sponsor = Math.round((S.sponsor+contractIncome())/yearWeeks()); earn(out.sponsor, 'sponsor');
  out.salary = Math.round((S.players.filter(p=>!p.loan).reduce((a,p)=>a+p.salary,0)+staffSalary())/yearWeeks()); spend(out.salary, 'salary');
  out.upkeep = Object.keys(FAC).reduce((a,k)=>a+FAC[k].upkeep*S.fac[k],0) * (1+econ()*0.3) * 0.75;
  out.upkeep = Math.round(out.upkeep); spend(out.upkeep, 'upkeep');
  if(home){
    const tk = TICKET[S.ticket]; const last = S.results.slice(-5);
    const form = last.filter(r=>r==='W').length - last.filter(r=>r==='L').length;
    const demand = S.fans * (0.66 + form*0.03) * tk.demand * R(0.85,1.15);
    out.att = Math.round(clamp(demand, 150, CAP[S.fac.stadium-1]));
    out.ticket = Math.round(out.att * DIVS[S.div].ticket * tk.price / 10000);
    earn(out.ticket, 'ticket');
  }
  return out;
}

function advance(){
  if(S && !S.over) ui.tab = 'home'; // 日程を進めたらホームに戻る
  if(S && !S.over && isOff()) return advanceOff();
  if(!S || S.over || S.round>=nr()) return;
  const before = {money:S.money, fans:S.fans};
  expireReports();
  applyTraining();
  applyPR();
  let ours=null;
  for(const [h,a] of S.schedule[S.round]){
    if(h===0||a===0) ours = playOurMatch(h,a); else simAI(h,a);
  }
  const fin = payWeekly(ours.home);
  if(ours.res==='W') S.trust+=3*wk(); else if(ours.res==='L') S.trust-=2*wk();
  const fanD = seasonFanGain(ours.res);
  if(S.money<0) { S.trust -= S.money<-3000 ? 3 : 1; addNews('【警告】資金がマイナスです。フロントの信頼が下がっています。'); }
  S.trust = clamp(S.trust,0,100);
  const sc = `${ours.home?'H':'A'} ${ours.gu}-${ours.go} vs ${ours.opp.name}`;
  addNews(`第${S.round+1}節 ${ {W:'勝利',D:'引き分け',L:'敗戦'}[ours.res] }：${sc}`);
  const ev = randomEvent();
  refreshMarket(2);
  fireDueEvents(false);
  generateReports();
  weeklyBids();
  if(S.round%4===3) refreshStaffMarket(3);
  S.companies.forEach(c=>{ if(c.cool>0) c.cool--; });
  S.round++;
  checkTrip();
  S.visitsLeft = salesTeam().length; S.watchLeft = watchPerWeek();
  if(S.trust<=0){ S.over='fired'; }
  save();
  showMatch(ours, fin, {dm:S.money-before.money, df:S.fans-before.fans, fanD, ev});
}

function standings(){
  return S.teams.map((t,i)=>({...t,i,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function myRank(){ return standings().findIndex(t=>t.isMe)+1; }

function endSeason(){
  const st = standings(); const rank = st.findIndex(t=>t.isMe)+1;
  const d = S.div; const report = {rank, div:d, lines:[], target:S.target};
  // 賞金
  const nT = st.length;
  const prize = Math.round(DIVS[d].prize * (nT+1-rank)/nT * (rank===1?2:1));
  earn(prize, 'prize'); report.prize = prize;
  // 昇格・降格（実際のレギュレーションに沿って判定。プレーオフや入れ替え戦もここで行う）
  let champion = false;
  report.post = [];
  fireDueEvents(true);
  const moved = postseason(st, rank, report);
  if(d===TOP && rank===1){ champion=true; S.champion++; }
  const zn = zones(d, st.length);
  // 信頼
  let td = (S.target - rank)*4;
  if(moved===1) td+=20; if(moved===-1) td-=20; if(champion) td+=30;
  S.trust = clamp(S.trust + td, 0, 100);
  report.trust = td;
  // ファン
  let fd = 0;
  if(moved===1) fd = changeFans(0.3, 300*DIV_MULT[d], d+1);
  else if(moved===-1) fd = changeFans(-0.15, 0);
  else fd = changeFans(rank<=3?0.08:rank>st.length*0.75?-0.05:0.02, 0);
  if(champion) fd += changeFans(0.25,0);
  report.fans = fd;
  const topP = [...S.players].sort((a,b)=>b.sg-a.sg)[0];
  S.history.push({season:S.season, div:d, rank, pts:st[rank-1].pts, moved, champion, top: topP && topP.sg ? {n:topP.name, g:topP.sg} : null});
  loansSeasonEnd(report.lines);
  amateursSeasonEnd(report.lines);
  contractsSeasonEnd();
  // 期限付き移籍から復帰
  for(const p of S.players.filter(x=>x.loan)){
    const g = Math.max(0,p.pot-p.ovr)*R(0.2,0.35); p.ovr += g; p.loan=false; p.mor=clamp((p.mor??60)+5,0,100);
    report.lines.push(`期限付き移籍していた${p.name}が復帰。武者修行で能力が${Math.round(g)}上がった！`);
  }
  S.players.forEach(p=>{ p.promise=false; p.restOnce=false; });
  // 選手の加齢・引退
  const retired=[];
  for(const p of S.players){
    p.age++;
    if(p.age>=31) p.ovr = Math.max(12, p.ovr - R(0.5,2.2)*(p.age-29)/2);
    if(p.age>=30) p.pot = p.ovr;
    if(p.age>=34 && Math.random()<(p.age-33)*0.3) retired.push(p);
  }
  S.players = S.players.filter(p=>!retired.includes(p));
  report.retired = retired.map(p=>p.name);
  // ユース昇格
  const ys = []; const b = DIVS[1].base;
  for(let i=0;i<youthCount(S.fac.youth);i++){
    const age = RI(16,18);
    const lvl = S.fac.youth + S.youthBonus*0.5 + staffAb('youth')/40;
    const ovr = b[0] - 8 + lvl*3 + R(-4,4) + econ()*2;
    const p = makePlayer(randPos(), ovr, age, ovr + R(12, 22+lvl*4));
    S.players.push(p); ys.push(p);
  }
  S.youthBonus = 0;
  report.youth = ys.map(p=>`${p.name}（${p.pos}）`);
  report.joined = prospectsSeasonEnd(report.lines);
  staffSeasonEnd(report.lines);
  companiesSeasonEnd(rank, report.lines);
  S.inbox = S.inbox.filter(r=>r.kind!=='ama'&&r.kind!=='fscout');
  S.foreignCands = [];
  // リーグ再編
  const me = S.teams[0];
  if(moved!==0){
    S.div += moved;
    S.teams = [me];
    for(let i=1;i<DIVS[S.div].teams;i++) S.teams.push(genTeam(S.div));
  } else {
    // 昇格・降格した他クラブを入れ替える（上がったチームの代わりは下から、落ちたチームの代わりは上から）
    const upR = new Set(zn.up||[]), dnR = new Set(zn.dn||[]);
    const keep = st.filter((t,k)=>t.isMe || (!upR.has(k+1) && !dnR.has(k+1))).map(t=>S.teams[t.i]);
    const mid = (DIVS[S.div].base[0]+DIVS[S.div].base[1])/2;
    const nextTeams = keep.map(t=>{ if(!t.isMe){ const dr = R(-3,3) + (mid - t.str)*0.2; t.str+=dr; t.att+=dr+R(-1,1); t.def+=dr+R(-1,1); } return t; }); // 戦力は毎年少し入れ替わり、リーグの平均に寄っていく
    while(nextTeams.length < DIVS[S.div].teams) nextTeams.push(genTeam(S.div, R(-2,2)));
    S.teams = [me, ...nextTeams.filter(t=>!t.isMe)].slice(0, DIVS[S.div].teams);
  }
  report.moved = moved; report.champion = champion;
  S.season++;
  startSeason();
  refreshMarket(6);
  for(let i=0;i<3;i++) S.market.push(genCandidate('free')); // オフの契約満了組
  S.phase = 'off'; S.offWeek = 0; S.camp = null;
  addNews(`オフシーズンに入った。開幕は${OFF_WEEKS}週後。`);
  if(S.trust<=0) S.over='fired';
  save();
  return report;
}

function signPlayer(id){
  const p = S.market.find(x=>x.id===id); if(!p) return;
  if(S.players.length>=26) return toast('選手登録は26人までです。');
  if(p.foreign && foreignCount()>=FOREIGN_MAX) return toast(`外国籍選手は${FOREIGN_MAX}人までです。`);
  if(S.money < p.fee) return toast('資金が足りません。');
  spend(p.fee, 'transfer');
  S.market = S.market.filter(x=>x!==p);
  delete p.fee; delete p.age2;
  p.cond = 90;

  else addNews(`${p.name}（${p.pos}・${p.age}歳）を獲得！`);

}
function sellPlayer(id){
  const p = S.players.find(x=>x.id===id); if(!p) return;
  if(p.loanFrom) return toast('期限付き移籍中の選手は売却できません。');
  if(p.amateur) return toast(`${p.amateur}の選手は売却できません。`);
  if(S.players.length<=14) return toast('選手は最低14人必要です。');
  const v = Math.round(playerValue(p)*0.7);
  confirmBox(`${p.name} を ${yen(v)} で売却しますか？`, ()=>{
    S.players = S.players.filter(x=>x!==p); earn(v, 'transfer');

function upgrade(k){
  const l = S.fac[k]; if(l>=5) return;

}

function genStaff(role, center){
  const c = center===undefined ? 34 + econ()*9 + R(-6,10) : center;
  const abil = clamp(Math.round(c + R(-12,12)), 12, 95);
  const st = {id:uid(), role, name:pick(SURN)+' '+pick(GIVEN), age: role==='sales'?RI(25,55):RI(33,66), abil, years:RI(1,3)};
  if(role!=='sales' && Math.random()<0.1){ st.name = pick(FOREIGN); st.foreign = true; }
  if(role==='manager'){
    st.style = pick(Object.keys(TACTICS));
    st.man = clamp(Math.round(R(25,90)),10,95);
    st.lic = Math.random() < clamp((abil-28)/40,0.05,0.97) ? 'S級' : 'A級';
  }
  st.salary = Math.round(STAFF_ROLES[role].base * Math.pow(abil/40,2) * (st.lic==='S級'?1.2:1) + 5);
  const tpl = pick(BIOS[role==='manager'||role==='sales'||role==='fscout'?role:'coach']);
  st.bio = tpl.replace('{city}',pick(CITY_NATION.concat(CITY_LOCAL))).replace('{school}',pick(SCHOOLS)).replace('{uni}',pick(UNIS)).replace('{role}',STAFF_ROLES[role].name);
  return st;
}
function staffAb(role){ const s = S.staff[role]; return s ? s.abil : 15; }
function salesTeam(){ return S.staff.sales || []; }
function allStaff(){ return [...Object.keys(STAFF_ROLES).filter(r=>r!=='sales').map(r=>S.staff[r]).filter(Boolean), ...salesTeam()]; }
function staffSalary(){ return allStaff().reduce((a,s)=>a+s.salary,0); }
function hireChance(st){ return clamp(1.15 - (st.abil - (38 + econ()*10))/35, 0.1, 1); }
function refreshStaffMarket(n){
  if(n===undefined){ S.staffMarket = []; for(const r of Object.keys(STAFF_ROLES)) for(let i=0;i<(r==='manager'?3:2);i++) S.staffMarket.push(genStaff(r)); return; }
  for(let i=0;i<n;i++) S.staffMarket.push(genStaff(pick(Object.keys(STAFF_ROLES))));
  // 役職ごとに新しい順で最大3人まで残す
  const keep = new Set(Object.keys(STAFF_ROLES).flatMap(r=>S.staffMarket.filter(x=>x.role===r).slice(-3).map(x=>x.id)));
  S.staffMarket = S.staffMarket.filter(x=>keep.has(x.id));
}
function fireCost(st){ return Math.round(st.salary * st.years * 0.5); }
function hireStaff(id){
  const st = S.staffMarket.find(x=>x.id===id); if(!st) return;
  const role = st.role; const cur = role==='sales' ? null : S.staff[role];
  if(role==='sales' && salesTeam().length>=MAX_SALES) return toast(`営業担当は最大${MAX_SALES}人です。`);
  const fee = Math.round(st.salary*0.3) + (cur?fireCost(cur):0);
  if(S.money < fee) return toast(`資金が足りません（必要 ${yen(fee)}）。`);
  const doHire = ()=>{
    if(Math.random() > hireChance(st)){
      S.staffMarket = S.staffMarket.filter(x=>x!==st);
      addNews(`${st.name}（${STAFF_ROLES[role].name}候補）に就任を打診したが、「今のクラブの規模では…」と辞退された。`);
      save(); render(); return toast(`${st.name} に断られました。クラブが上のリーグに行けば、有力な人材も来てくれるはずです。`);
    }
    spend(fee);
    S.staffMarket = S.staffMarket.filter(x=>x!==st);
    if(role==='sales') S.staff.sales.push(st);
    else {
      if(cur) addNews(`${STAFF_ROLES[role].name}の${cur.name}と契約を解除（違約金 ${yen(fireCost(cur))}）。`);
      S.staff[role] = st;
    }
    if(role==='manager'){ S.players.forEach(p=>p.mor=clamp((p.mor??60)+8,0,100)); addNews(`新監督に${st.name}が就任！「${st.bio}」。チームは新体制で心機一転。`); }
    else addNews(`${STAFF_ROLES[role].name}に${st.name}を招聘。（${st.bio}）`);
    save(); render();
  };
  if(cur) confirmBox(`現${STAFF_ROLES[role].name}の${cur.name}を解任し、${st.name}を招聘しますか？（契約金＋違約金 ${yen(fee)}・成功見込み ${Math.round(hireChance(st)*100)}%）`, doHire);
  else doHire();
}
function installStaff(st, fee){
  const role = st.role, cur = role==='sales' ? null : S.staff[role];
  spend(fee + (cur ? fireCost(cur) : 0), 'staff');
  S.staffMarket = S.staffMarket.filter(x=>x!==st);
  if(role==='sales') S.staff.sales.push(st);
  else { if(cur) addNews(`${STAFF_ROLES[role].name}の${cur.name}と契約を解除（違約金 ${yen(fireCost(cur))}）。`); S.staff[role] = st; }
  if(role==='manager'){ S.players.forEach(p=>p.mor=clamp((p.mor??60)+8,0,100)); addNews(`新監督に${st.name}が就任！「${st.bio}」。チームは新体制で心機一転。`); }
  else addNews(`${STAFF_ROLES[role].name}に${st.name}を招聘。（${st.bio}）`);
  save(); render();
}
function fireStaff(id){
  const st = allStaff().find(x=>x.id===id); if(!st) return;
  const c = fireCost(st);
  confirmBox(`${STAFF_ROLES[st.role].name}の${st.name}を解任しますか？（違約金 ${yen(c)}）`, ()=>{
    spend(c, 'staff');
    if(st.role==='sales') S.staff.sales = S.staff.sales.filter(x=>x!==st); else S.staff[st.role] = null;
    if(st.role==='manager'){ S.players.forEach(p=>p.mor=clamp((p.mor??60)-3,0,100)); S.trust = clamp(S.trust + (S.results.slice(-5).filter(r=>r==='L').length>=3?4:-4),0,100); }
    addNews(`${STAFF_ROLES[st.role].name}の${st.name}を解任した。`);
    save(); render();
  });
}
function staffSeasonEnd(lines){
  for(const st of allStaff()){
    st.age++; st.years--;
    if(st.years>0) continue;
    const tooGood = st.abil > 48 + econ()*10 && Math.random()<0.5;
    if(tooGood){
      if(st.role==='sales') S.staff.sales = S.staff.sales.filter(x=>x!==st); else S.staff[st.role]=null;
      lines.push(`${STAFF_ROLES[st.role].name}の${st.name}は契約満了で他クラブへ移った。後任を探そう。`);
    } else {
      st.years = RI(1,2); st.salary = Math.round(st.salary*1.08);
      lines.push(`${STAFF_ROLES[st.role].name}の${st.name}と契約を${st.years}年延長。`);
    }
  }
}

function generateReports(){
  if(S.inbox.length>=4) return;
  const c = ctxNow();
  const chance = (0.4 + staffAb('hc')/220) * Math.min(1, wk()*1.15);
  const kinds = Object.keys(REPORTS).filter(k=>!['ama','fscout','camp','surgery','hurt','bid'].includes(k)).sort(()=>Math.random()-0.5);
  let made = 0, max = staffAb('hc')>=55 ? 2 : 1;
  for(const k of kinds){
    if(made>=max || Math.random()>chance) continue;
    if(S.inbox.some(r=>r.kind===k)) continue;
    const rep = REPORTS[k].make(c);
    if(rep){ S.inbox.push(rep); made++; const p=S.players.find(x=>x.id===rep.pid); if(p) p.repT=tick(); }
  }
}
function resolveReport(id, key, auto){
  const rep = S.inbox.find(r=>r.id===id); if(!rep) return;
  S.inbox = S.inbox.filter(r=>r!==rep);
  const p = rep.pid ? S.players.find(x=>x.id===rep.pid) : null;
  if(rep.pid && !p){ return; }
  const keepUi = auto ? {tab:ui.tab, sub:ui.sub, staffSub:ui.staffSub, staffRole:ui.staffRole} : null;
  const msg = REPORTS[rep.kind].resolve(key, p, rep);
  if(keepUi) Object.assign(ui, keepUi); // 自動処理では画面を切り替えない
  if(!['ama','fscout','mood'].includes(rep.kind)) addNews(`【${auto?'未対応→自動処理':'報告'}】${msg}`);
  return msg;
}
function expireReports(){
  for(const r of [...S.inbox]) if(tick()-r.t>=2) resolveReport(r.id, r.opts[r.opts.length-1][0], true);
}
function moraleAfterMatch(xiIds, res){
  const hcAdj = (staffAb('hc')-50)/5 + ((S.staff.manager?.man||30)-50)/8;
  const c = ctxNow();
  for(const p of S.players){
    if(p.loan) continue;
    p.mor = p.mor ?? 60;
    if(xiIds.has(p.id)){ p.mor += 2; if(p.promise){ p.mor += 10; p.promise=false; } }
    else if(!p.inj){
      if(p.promise){ p.mor -= 25; p.promise=false; addNews(`${p.name}への先発の約束を破ってしまった…本人は激怒している。`); }
      p.mor -= p.ovr >= c.avg-3 ? 3 : 1;
    }
    p.mor += res==='W'?3 : res==='L'?-2 : 0;
    if(underpaid(p)) p.mor -= 1.5; // 実力に見合わない年俸だと不満がたまる
    p.mor += ((58+hcAdj) - p.mor)*0.08;
    p.mor = clamp(p.mor,0,100);
    p.restOnce = false;
  }
}

const SCHOOLS = ['金沢翠嶺高校','加賀北辰高校','能登海星高校','小松白嶺高校','金沢犀星高校','七尾港南高校','白山学園高校','野々市工業高校','金沢東雲高校','輪島朝凪高校'];

  {m:5,  d:20, kind:'大学', name:'北信越大学サッカーリーグ前期', type:'league'},
  {m:6,  d:10, kind:'高校', name:'インターハイ石川県予選', type:'final'},

];
function eventTime(e){ return new Date(2026 + S.season, e.m-1, e.d).getTime(); }
// 開催日を過ぎた大会の報告を出す（all=true ならシーズン終了時に残りをまとめて）
function fireDueEvents(all){
  S.evFired = S.evFired || [];
  const now = all ? Infinity : roundDate(S.round).getTime();
  for(const e of [...AMA_EVENTS, ...NAT_EVENTS.filter(x=>x.m)]){
    if(S.evFired.includes(e.name) || eventTime(e) > now) continue;
    S.evFired.push(e.name);
    if(NAT_EVENTS.includes(e)) runNatEvent(e); else runAmaEvent(e);
  }
}
const AMA_TAGS = ['大会MVP','得点王','ベストイレブン','優秀選手','守備の要','注目のドリブラー'];
function rangeBar(lo, hi, plo, phi){
  const x = v => clamp((v-10)/80*100, 0, 100);
  return `<div class="rbar" title="推定能力（濃い帯）と推定素質（薄い帯）"><i class="pot" style="left:${x(plo)}%;width:${Math.max(1,x(phi)-x(plo))}%"></i><i class="now" style="left:${x(lo)}%;width:${Math.max(1,x(hi)-x(lo))}%"></i></div>
    <div class="rbar-axis small muted"><span>10</span><span>50</span><span>90</span></div>`;
}
function noiseLevel(){ return Math.max(1.5, 12 - S.fac.scout*1.4 - staffAb('scout')/12); }
function setEstimate(pr, n){
  pr.lo = Math.round(pr.ovr - R(0.3,1)*n); pr.hi = Math.round(pr.ovr + R(0.3,1)*n);
  pr.plo = Math.round(pr.pot - R(0.3,1)*n*1.5); pr.phi = Math.round(pr.pot + R(0.3,1)*n*1.5);
}
function genProspect(kind, school, tag){
  const hs = kind==='高校';
  const bonus = tag==='大会MVP'?4 : tag==='得点王'?3 : 1;
  const ovr = (hs ? R(25,41) : R(33,51)) + econ()*2.5 + bonus;
  const pot = ovr + (hs ? R(10,32) : R(3,16));
  const pos = tag==='得点王'?'FW' : tag==='守備の要'?pick(['DF','DF','GK']) : tag==='注目のドリブラー'?pick(['MF','FW']) : randPos();
  const pr = {id:uid(), name:genName(false), pos, role:pickRole(pos), age:hs?18:22, kind, school, grade:hs?'3年':'4年', tag, ovr, pot,
              seen:0, status:'none', hot: pot>60 && Math.random()<0.6};
  setEstimate(pr, noiseLevel());
  return pr;
}
function runAmaEvent(e){
  const pool = e.kind==='高校' ? SCHOOLS : UNIS;
  const a = pick(pool); let b; do{ b=pick(pool); }while(b===a);
  let text;
  if(e.type==='final'){ const ga=RI(1,4), gb=RI(0,ga-1); text = `${e.name}決勝は${a}が${ga}-${gb}で${b}を下し優勝。`; }
  else if(e.type==='national'){ text = `${e.name}で石川県代表の${a}がベスト${pick([16,8,8,4])}に進出！`; }
  else { text = `${e.name}は${a}が首位で折り返し。${b}が追う展開。`; }
  const n = RI(2,3), picked = [];
  const tags = [...AMA_TAGS].sort(()=>Math.random()-0.5);
  for(let i=0;i<n;i++){ const pr = genProspect(e.kind, i===0?a:i===1?b:pick(pool), tags[i]); S.prospects.push(pr); picked.push(pr); }
  addNews(`【アマチュア】${text}`);
  S.inbox.push(mkRep('ama', scFrom(), `${e.name}で活躍した選手をリストアップしました`,
    `${text}\n${picked.map(p=>`・${p.name}（${p.school} ${p.grade}・${p.pos}）— ${p.tag}${p.hot?'【他クラブも注目】':''}`).join('\n')}\n視察で実力を見極めてからオファーしましょう。`,
    [['view','スカウトリストを見る'],['ok','了解']]));
}
function interest(pr){
  const v = 52 + econ()*11 - Math.max(0,pr.pot-50)*1.1 + (pr.national?-5:15) + Math.min(10,S.fans/1500) + pr.seen*8 - (pr.hot?15:0);
  return clamp(Math.round(v),5,95);
}
function prospectFee(pr){ return Math.round((200 + Math.max(0,(pr.plo+pr.phi)/2-40)*25) * Math.sqrt(DIV_MULT[S.div])); }
function watchCost(){ return Math.round(5*Math.sqrt(DIV_MULT[S.div])); }
function watchPerWeek(){ return 1 + (staffAb('scout')>=50?1:0) + (S.fac.scout>=3?1:0); }
function watchProspect(id){
  const pr = S.prospects.find(x=>x.id===id); if(!pr) return;
  if(S.watchLeft<=0) return toast('今週の視察枠を使い切りました。');
  if(S.money<watchCost()) return toast('資金が足りません。');
  const b = {lo:pr.lo, hi:pr.hi, plo:pr.plo, phi:pr.phi, it:interest(pr)};
  spend(watchCost(), 'scout'); S.watchLeft--; pr.seen++;
  setEstimate(pr, noiseLevel()/Math.pow(2,pr.seen));
  const note = pick(['ボールを持った時の落ち着きが目を引いた。','守備の切り替えが速い。','監督からの評価も高い。','試合後に本人と少し話せた。「プロでやりたい」と目を輝かせていた。','フィジカルはまだ線が細い。','左足のキックに光るものがある。']);
  addNews(`${pr.school}の${pr.name}を視察。推定能力 ${b.lo}〜${b.hi} → ${pr.lo}〜${pr.hi}。`);

function initCompanies(){ return COMPANIES.map(c=>({...c, rel:RI(5,20)+(c.size===1?15:0), contract:null, cool:0, invested:false})); }
function slotFree(slot){ if(slot==='naming' && S.fac.stadium<2) return false; return S.companies.filter(c=>c.contract&&c.contract.slot===slot).length < SLOTS[slot].max; }
function dealAmount(c, slot, tier){ return Math.round(SIZE_BASE[c.size] * (1+econ()*0.4) * (0.8 + Math.min(S.fans,30000)/30000*0.6) * SLOTS[slot].mult * TIERS[tier].mult); }
function dealChance(c, slot, tier){ return clamp(0.15 + (c.rel-35)/70 + TIERS[tier].adj + econ()*0.04 - (c.size-1)*0.08 - SLOTS[slot].mult*0.1, 0.03, 0.95); }
function companyLocked(c){ if(c.size===3 && S.div<2) return 'JFL以上で交渉可能'; if(c.size===2 && S.fans<1200 && S.div<2) return 'ファン1,200人以上で交渉可能'; return null; }
function salesPower(){ const t=salesTeam(); return t.length ? t.reduce((a,s)=>a+s.abil,0)/t.length : 0; }
function visitCompany(i){
  const c = S.companies[i]; if(!c) return;
  if(S.visitsLeft<=0) return toast(salesTeam().length?'今週の訪問枠を使い切りました（営業担当1人につき週1社）。':'営業担当がいません。「編成・人事」のスタッフ採用でしましょう。');
  if(companyLocked(c)) return toast(`${c.name}：${companyLocked(c)}`);
  S.visitsLeft--;
  const g = (5 + salesPower()/9 + R(0,5)) * (1 - c.rel/130) * Math.min(1.2, wk()*1.1);
  c.rel = clamp(c.rel + g, 0, 100);
  const st = pick(salesTeam());

  addNews(`営業：${st.name}が${c.name}を訪問。${flavor}`);
  save(); render();
}
function proposeDeal(i, tier){
  const c = S.companies[i]; if(!c||c.contract) return;
  const slot = (ui.slotSel||{})[i] || firstFreeSlot();
  if(!slot || !slotFree(slot)) return toast('その枠は埋まっています。');
  if(c.cool>0) return toast(`${c.name}とは前回の交渉から日が浅いです（あと${c.cool}週）。`);
  if(companyLocked(c)) return toast(`${c.name}：${companyLocked(c)}`);
  const amt = dealAmount(c,slot,tier), ch = dealChance(c,slot,tier);
  if(Math.random()<ch){
    c.contract = {slot, amount:amt, years:RI(1,3)}; c.rel = clamp(c.rel+5,0,100);
    if(slot==='chest'||slot==='naming') S.trust = clamp(S.trust+3,0,100);
    addNews(`【営業】${c.name}と${SLOTS[slot].name}スポンサー契約を締結！ 年${yen(amt)}・${c.contract.years}年契約。`);
    save(); render(); toast(`${c.name}との契約が成立！ 年${yen(amt)}`);
  } else {
    c.rel = clamp(c.rel-8,0,100); c.cool = 2;
    addNews(`${c.name}への${SLOTS[slot].name}スポンサー提案は見送られた。`);
    save(); render(); toast(`${c.name}：「今回は見送らせてください」`);
  }
}
function firstFreeSlot(){ return Object.keys(SLOTS).find(slotFree); }
function investAmount(){ return Math.round(6000*(1+econ()*0.4)); }
function askInvest(i){
  const c = S.companies[i]; if(!c||c.size<3||c.invested||c.rel<75) return;

function tripCost(r){ return Math.round(REGIONS[r].cost*Math.sqrt(DIV_MULT[S.div])); }
function dispatchScout(r){
  const fs = S.staff.fscout;
  if(!fs) return toast('海外スカウトがいません。「編成・人事」のスタッフ採用でしましょう。');
  if(S.fscoutTrip) return toast(`${fs.name}は${REGIONS[S.fscoutTrip.region].name}に出張中です。`);

function genForeign(r){
  const G = REGIONS[r], ab = staffAb('fscout');
  const b = DIVS[S.div].base, mid = (b[0]+b[1])/2;
  const age = G.young ? RI(18,22) : RI(21,31);
  let ovr = mid + G.bonus + R(-G.var, G.var) + (ab-50)/10;
  if(Math.random() < 0.1 + ab/1000) ovr += R(8,14); // 大当たり
  const pot = age<=22 ? ovr+R(5,22) : age<=26 ? ovr+R(0,8) : ovr;
  const p = makePlayer(pick(G.pos), ovr, age, pot, true);
  p.name = pick(G.names); p.region = r;
  const n = clamp(22 - ab/5, 4, 20);
  p.lo = Math.round(p.ovr - R(0.3,1)*n); p.hi = Math.round(p.ovr + R(0.3,1)*n);
  p.bio = pick(MYSTERY);
  p.fee = Math.round(playerValue(p)*R(0.35,0.7));
  p.salary = Math.round(calcSalary((p.lo+p.hi)/2)*R(0.8,1.2));

function checkTrip(){
  const t = S.fscoutTrip; if(!t || tick()<t.back) return;
  S.fscoutTrip = null;
  const found = [], used = new Set([...S.players, ...S.foreignCands].map(p=>p.name));
  for(let i=0, n=RI(2,3); i<n; i++){
    const p = genForeign(t.region);
    for(let k=0; k<10 && used.has(p.name); k++) p.name = pick(REGIONS[t.region].names);
    used.add(p.name); found.push(p);
  }
  S.foreignCands.push(...found); S.foreignCands = S.foreignCands.slice(-9);
  const fs = S.staff.fscout;
  addNews(`【海外】海外スカウトの${fs?fs.name:''}が${REGIONS[t.region].name}から帰国。${found.length}人の候補を連れてきた。`);

function isOff(){ return S.phase==='off'; }
function offTraining(w){
  const lines = [];
  for(const p of S.players){
    if(p.inj>0){ healWeek(p); if(p.inj>0) continue; }
    if(w<=2){ p.cond = 100; continue; } // 12月〜1月上旬は休暇
    const camp = w>=4 ? CAMPS[S.camp||'home'] : {g:0.5};
    const ageF = p.age<=20?1.3:p.age<=23?1:p.age<=26?0.6:p.age<=29?0.25:0;
    const facG = (0.8+0.15*S.fac.training) * (p.age<=23 ? 0.8+staffAb('youth')/250 : 1);
    p.ovr = Math.min(p.pot, p.ovr + Math.max(0,p.pot-p.ovr)*0.03*camp.g*ageF*facG*R(0.5,1.5));
    p.cond = clamp(p.cond - 4 + 8, 40, 100);
    if(w>=4 && Math.random()<0.012*injuryRisk(p)){ injure(p, Math.random()<0.5?'muscle':'overuse'); lines.push(`キャンプ中に${p.name}が${injLabel(p)}（全治${p.inj}週）。`); }
  }
  return lines;
}

  const sp = Math.round((S.sponsor+contractIncome())/yearWeeks()); earn(sp, 'sponsor');
  const sal = Math.round((S.players.filter(p=>!p.loan).reduce((a,p)=>a+p.salary,0)+staffSalary())/yearWeeks()); spend(sal, 'salary');
  const up = Math.round(Object.keys(FAC).reduce((a,k)=>a+FAC[k].upkeep*S.fac[k],0)*(1+econ()*0.3)*0.75); spend(up, 'upkeep');
}

function campDay(last){

  if(S.camp==='thai' && !last){ S.companies.forEach(co=>{ if(co.size>=2) co.rel=clamp(co.rel+4,0,100); }); lines.push('タイ遠征が地元経済紙で取り上げられ、企業の関心が高まった（関係+4）。'); }

function campResolve(k){
  if(k!=='home' && S.money < campCost(k)){ S.camp='home'; return `資金が足りず、${CAMPS[k].name}は断念。金沢で調整することになった。`; }
  spend(campCost(k), 'camp'); S.camp = k;
  return `春季キャンプは${CAMPS[k].name}に決定！`;
}
function computeTarget(){
  const my = teamRating(getLineup(true)).ovr;
  const better = S.teams.filter(t=>!t.isMe && t.str > my).length;
  S.target = clamp(better+1, 1, S.teams.length-1);
  S.target = Math.min(S.target, S.teams.length-1);
  if(S.div===1 && S.season===1) S.target = Math.max(S.target, 6);
}
function advanceOff(){
  const before = {money:S.money, fans:S.fans};

  NAT_EVENTS.filter(e=>e.off===w).forEach(runNatEvent);

  refreshMarket(3);
  weeklyBids();
  S.offWeek++;
  checkTrip();

    addNews(`第${S.season}シーズン開幕！ ${DIVS[S.div].name}で戦う。フロントの目標は${S.target}位以内。`);

// 契約更新の希望年俸：相場に寄せつつ、現年俸の0.85〜1.5倍に収める（いきなり何倍にもならない）
function renewAsk(p){ return Math.round(clamp(calcSalary(p.ovr), p.salary*0.85, p.salary*1.6) * ((p.mor??60)<40 ? 1.15 : 1)); }
function raiseAsk(p){ return Math.round(clamp(calcSalary(p.ovr), p.salary*1.15, p.salary*1.6)); }
function underpaid(p){ return !p.amateur && !p.loanFrom && p.salary < calcSalary(p.ovr)*0.6; }
function renewChance(p){ const m = p.mor??60; return m>=40 ? 1 : m>=20 ? 0.6 : 0.25; }
function renewContract(id, years){
  const p = S.players.find(x=>x.id===id); if(!p||!p.expiring) return;
  if(p.refused) return toast(`${p.name}は今オフの契約更新を拒否しています。`);
  const ask = renewAsk(p);
  if(Math.random() < renewChance(p)){
    p.salary = ask; p.contract = years; p.expiring = false; p.mor = clamp((p.mor??60)+5,0,100);
    addNews(`${p.name}と${years}年契約で合意（年俸${yen(ask)}）。`);
    save(); render(); showPlayer(id);
  } else {
    p.refused = true;
    addNews(`${p.name}は契約更新を拒否。「新しい環境で挑戦したい」`);
    save(); render(); toast(`${p.name}に契約更新を断られました。12月下旬に退団します。`);
  }
}
function contractsSeasonEnd(){
  for(const p of S.players){
    if(p.amateur || p.loanFrom) continue;
    if(p.newPro){ delete p.newPro; continue; }
    p.contract = Math.max(0, (p.contract ?? 2) - 1);
    if(p.contract===0){ p.expiring = true; p.refused = false; }
  }
}
function expiringLeave(){
  const lines = [];
  let leaving = S.players.filter(p=>p.expiring);
  // 最低人数を割る場合は、能力の高い順に1年契約で自動更新
  const keepN = Math.max(0, 14 - (S.players.length - leaving.length));
  const kept = [...leaving].sort((a,b)=>b.ovr-a.ovr).slice(0, keepN);
  kept.forEach(p=>{ p.expiring=false; p.contract=1; p.salary=renewAsk(p); lines.push(`登録人数が足りないため、${p.name}と1年契約で更新した。`); });
  leaving = leaving.filter(p=>!kept.includes(p));
  if(leaving.length){
    S.players = S.players.filter(p=>!leaving.includes(p));
    lines.push(`契約満了で${leaving.map(p=>p.name).join('、')}が退団した。`);
  }
  return lines;
}

      <div class="bar" style="margin-top:6px"><i style="width:${Math.round(done/i.total*100)}%"></i></div><span class="small muted">リハビリの進み具合</span></div>`);

    </div>

}

// ===================== 負傷（部位・診断名・全治・リハビリ） =====================
const INJURIES = [
  {id:'bruise',   name:'打撲',               short:'打撲',   parts:['右太もも','左太もも','すね','右足首','腰'], w:[1,1], cause:{contact:5}},
  {id:'sprain',   name:'捻挫',               short:'捻挫',   parts:['右足首','左足首'], w:[1,3], cause:{contact:4, random:2}, hurt:true},
  {id:'concuss',  name:'脳震盪',             short:'脳震盪', parts:['頭部'], w:[1,2], cause:{contact:1.2}},
  {id:'hamstring',name:'肉離れ',             short:'肉離れ', parts:['右太もも裏','左太もも裏','右ふくらはぎ','左ふくらはぎ'], w:[2,6], cause:{muscle:5, overuse:1}, muscle:true},
  {id:'adductor', name:'内転筋損傷',         short:'内転筋', parts:['右脚の付け根','左脚の付け根'], w:[2,4], cause:{muscle:2, overuse:1}, hurt:true, muscle:true},
  {id:'groin',    name:'グロインペイン症候群', short:'鼠径部痛', parts:['鼠径部'], w:[3,8], cause:{overuse:2}, muscle:true},
  {id:'back',     name:'腰痛',               short:'腰痛',   parts:['腰'], w:[1,3], cause:{overuse:2, random:1}, hurt:true},
  {id:'mcl',      name:'内側側副靭帯損傷',   short:'膝靭帯', parts:['右膝','左膝'], w:[4,8], cause:{contact:1.5}},
  {id:'meniscus', name:'半月板損傷',         short:'半月板', parts:['右膝','左膝'], w:[6,10], cause:{contact:0.6, overuse:0.5}, op:{cons:[3,5]}},
  {id:'stress',   name:'疲労骨折',           short:'疲労骨折', parts:['右足の第5中足骨','左足の第5中足骨','すね'], w:[8,12], cause:{overuse:1}, op:{cons:[5,7]}},
  {id:'acl',      name:'前十字靭帯断裂',     short:'膝十字', parts:['右膝','左膝'], w:[24,32], cause:{contact:0.25, muscle:0.15}, op:{cons:[12,16]}, severe:true},
];
const INJ_SCENE = {
  bruise:['相手と激しく接触して倒れ込んだ','相手のスパイクが入った'],
  sprain:['着地の際に足首をひねった','相手に足を踏まれて足首をひねった'],
  concuss:['空中戦で相手と頭同士が激突した'],
  hamstring:['ダッシュの途中で太もも裏を押さえて座り込んだ','スプリントの直後に脚を押さえた'],
  adductor:['クロスを上げた瞬間に股関節周りを痛めた'],
  groin:['キックの際に鼠径部の痛みを訴えた'],
  back:['腰の張りを訴えた'],
  mcl:['相手のスライディングを膝に受けた','競り合いで膝を内側にひねった'],
  meniscus:['切り返した瞬間に膝を押さえた'],
  stress:['足の甲の痛みを訴え、検査に回った'],
  acl:['着地の際に膝が崩れ、担架で運ばれた','切り返しで膝が抜けたように倒れ込んだ'],
};
function injuryRisk(p){
  const condF = p.cond<55 ? 1.8 : p.cond<70 ? 1.3 : 1;
  const ageF = p.age>=33 ? 1.5 : p.age>=30 ? 1.25 : 1;
  const re = p.reRisk && tick() < p.reRisk.until ? p.reRisk.mult : 1;
  const med = (1 - (S.fac.medical-1)*0.12) * (1.15 - staffAb('physical')/250);
  return condF * ageF * re * med;
}
function injLabel(p){ return p.injury ? (p.injury.part ? `${p.injury.part}の${p.injury.name}` : p.injury.name) : '負傷'; }
function injure(p, cause){
  let t;
  if(p.reRisk && tick()<p.reRisk.until && Math.random()<0.5) t = INJURIES.find(x=>x.id===p.reRisk.id);
  if(!t){
    const pool = INJURIES.filter(x=>x.cause[cause]);
    let r = Math.random()*pool.reduce((a,x)=>a+x.cause[cause],0);
    t = pool.find(x=>(r-=x.cause[cause])<=0) || pool[0];
  }
  const part = t.id===p.injury?.id ? p.injury.part : pick(t.parts);
  const medF = 1 - (S.fac.medical-1)*0.06 - (staffAb('physical')-30)/500;
  const weeks = Math.max(1, Math.round(RI(t.w[0], t.w[1]) * medF));
  const again = p.reRisk && p.reRisk.id===t.id && tick()<p.reRisk.until;
  p.inj = weeks; p.playHurt = false; p.promise = false;
  p.injury = {id:t.id, name:t.name, short:t.short, part, total:weeks, again};
  p.hist = [...(p.hist||[]), {name:`${part}の${t.name}`, s:S.season, w:weeks}].slice(-5);
  const left = isOff() ? nr() + OFF_WEEKS - S.offWeek : nr() - S.round;
  const out = weeks > left && !isOff() ? '（今季絶望）' : '';
  addNews(`【負傷】${p.name}　${part}の${t.name}${again?'（再発）':''}・全治${weeks}週間${out}`);
  const doc = `メディカル ${S.staff.physical ? S.staff.physical.name : 'スタッフ'}`;
  if(t.op){
    const cons = Math.max(2, Math.round(RI(t.op.cons[0], t.op.cons[1])*medF));
    S.inbox.push(mkRep('surgery', doc, `${p.name}の治療方針を決めてください`,
      `精密検査の結果、${p.name}は${part}の${t.name}と診断されました。\n手術すれば全治約${weeks}週間ですが、完治が見込めます。保存療法なら約${cons}週間で復帰できる可能性がありますが、再発のリスクが高くなります。${t.severe?'\n選手生命にも関わる大けがです。':''}`,
      [['cons',`保存療法（約${cons}週で復帰・再発リスク大）`],['op',`手術する（全治約${weeks}週）`]], {pid:p.id, cons}));
  } else if(t.hurt && weeks<=3 && !isOff()){
    S.inbox.push(mkRep('hurt', doc, `${p.name}は痛み止めを打てば出場できます`,
      `${p.name}は${part}の${t.name}（全治${weeks}週間）です。痛み止めを打てば試合に出られますが、本来の動きはできず、悪化させると長引く恐れがあります。`,
      [['hurt','強行出場させる'],['rest','完治まで休ませる']], {pid:p.id}));
  }
  return INJ_SCENE[t.id] ? pick(INJ_SCENE[t.id]) : '負傷した';
}
function healWeek(p){
  if(!(p.inj>0)) return null;
  if(p.playHurt && Math.random()<0.5) return null; // 強行出場中は治りが遅い
  const fast = Math.random() < (S.fac.medical-1)*0.07 + staffAb('physical')/700 ? 1 : 0;
  p.inj = Math.max(0, p.inj - 1 - (p.injury && p.injury.total>=4 ? fast : 0));
  if(p.inj>0) return null;
  const inj = p.injury; p.injury = null; p.playHurt = false;
  if(!inj) return null;
  let msg = `${p.name}が${inj.part}の${inj.name}から全体練習に復帰。`;
  if(inj.total>=6){ p.rust = 3; p.cond = Math.min(p.cond, 65); msg += '試合勘を取り戻すまで少し時間がかかりそうだ。'; }
  if(inj.id==='acl'){ const loss = p.age>=30 ? R(1.5,4) : R(0,1.5); p.ovr = Math.max(12, p.ovr-loss); p.pot = Math.max(p.ovr, p.pot-loss); if(loss>=1) msg += `大けがの影響で能力が${Math.round(loss)}下がった。`; }
  if(INJURIES.find(x=>x.id===inj.id)?.muscle && !p.reRisk) p.reRisk = {id:inj.id, until:tick()+8, mult:2};
  addNews(msg);
  return msg;
}
function afterMatchInjury(p){
  if(p.rust>0) p.rust--;
  if(p.playHurt && p.inj>0 && Math.random()<0.3){
    const add = RI(2,4); p.inj += add; p.injury.total += add; p.playHurt = false;
    addNews(`${p.name}が強行出場で${injLabel(p)}を悪化させた。全治が${add}週間延びた…`);
  }
}

// ===================== 交渉（オファーの駆け引き） =====================
const NEGO_WAIT = ['代理人が電話をかけている…','相手クラブの強化部長が渋い顔で資料を見ている…','本人が家族と相談している…','「少し考えさせてください」と席を外した…','代理人がメモを取りながら黙り込んでいる…','沈黙が続く…'];
const NEGO_FEEL = v => v>=0.75 ? ['好感触', 'plus'] : v>=0.45 ? ['五分五分', ''] : v>=0.2 ? ['渋い', 'minus'] : ['かなり厳しい', 'minus'];
function negoTarget(n){
  if(n.kind==='market') return S.market.find(x=>x.id===n.id);
  if(n.kind==='foreign') return S.foreignCands.find(x=>x.id===n.id);
  if(n.kind==='prospect') return S.prospects.find(x=>x.id===n.id);
  if(n.kind==='renew') return S.players.find(x=>x.id===n.id);
  if(n.kind==='staff') return S.staffMarket.find(x=>x.id===n.id);
}
function openNego(kind, id){
  const n = {kind, id, patience:3, log:[], pending:false, counter:null};
  const p = negoTarget(n); if(!p) return;
  if(kind==='staff'){
    const cur = p.role==='sales' ? null : S.staff[p.role];
    if(p.role==='sales' && salesTeam().length>=MAX_SALES) return toast(`営業担当は最大${MAX_SALES}人です。`);
    n.askFee = Math.round(p.salary*0.3); n.askSal = p.salary; n.years = true; n.staff = true;
    n.feeOpts = [0.7,1,1.5]; n.salOpts = [0.9,1,1.15,1.3]; n.feeLabel = '契約金'; n.party = `${STAFF_ROLES[p.role].name}候補 ${p.name}`;
    n.extra = cur ? fireCost(cur) : 0;
    if(cur) n.log.push({who:'info', t:`合意すると現${STAFF_ROLES[p.role].name}の${cur.name}は解任になり、違約金${yen(n.extra)}がかかる。`});
    if(hireChance(p)<0.6) n.log.push({who:'info', t:`実績のある人物で、${DIVS[S.div].short}のクラブからの話には慎重なようだ。`});
  } else if(kind==='market'){
    if(S.players.length>=26) return toast('選手登録は26人までです。');
    if(p.foreign && foreignCount()>=FOREIGN_MAX) return toast(`外国籍選手は${FOREIGN_MAX}人までです。`);
    n.askFee = p.fee; n.askSal = p.salary; n.feeFixed = !!p.loanFrom || p.fee===0; n.years = !p.loanFrom;
    n.feeOpts = n.feeFixed ? [1] : [0.8,0.9,1,1.1]; n.salOpts = [0.9,1,1.15,1.3];
    n.appeal = (econ()-1)*0.05 + (p.local?0.15:0);
    n.party = p.loanFrom ? `${p.loanFrom}（親クラブ）と本人` : p.free ? '本人（フリー）' : '所属クラブと本人';
  } else if(kind==='foreign'){
    if(S.players.length>=26) return toast('選手登録は26人までです。');
    if(foreignCount()>=FOREIGN_MAX) return toast(`外国籍選手は${FOREIGN_MAX}人までです。`);
    n.askFee = p.fee; n.askSal = p.salary; n.years = true;
    n.feeOpts = [0.8,0.9,1,1.1]; n.salOpts = [0.9,1,1.15,1.3]; n.appeal = 0.15; n.party = '代理人';
  } else if(kind==='prospect'){
    if(p.status!=='none') return;
    if(p.kind==='大学' && S.players.length>=26) return toast('選手登録は26人までです。');
    n.askFee = prospectFee(p); n.askSal = Math.round(calcSalary((p.lo+p.hi)/2)*0.8); n.years = false;
    n.feeOpts = [0.7,1,1.5]; n.salOpts = [0.9,1,1.2]; n.feeLabel = '支度金'; n.party = `本人と${p.kind==='高校'?'家族・監督':'大学の監督'}`;
    n.patience = 2;
  } else if(kind==='renew'){
    if(!p.expiring || p.refused) return;
    n.askFee = 0; n.askSal = renewAsk(p); n.feeFixed = true; n.years = true;
    n.feeOpts = [1]; n.salOpts = [0.9,1,1.15]; n.party = '本人と代理人';
  }
  n.offer = {fee:1, sal:1, years: p.age>=33 && kind!=='staff' ? 1 : 2};
  n.snap = {roleName: kind==='staff' ? STAFF_ROLES[p.role].name : '', name:p.name, pos:kind==='staff'?null:p.pos, age:p.age, school:p.school, est: kind==='staff' ? `能力 ${p.abil}${p.lic?`・${p.lic}`:''}${p.style?`・得意戦術 ${TACTICS[p.style].name}`:''}` : p.lo!==undefined ? `推定能力 ${p.lo}〜${p.hi}` : `能力 ${Math.round(p.ovr)}`};
  if(kind!=='prospect' && kind!=='renew' && Math.random()<0.3){
    n.rival = pick(CITY_NATION)+' '+pick(SUFFIX); n.askSal = Math.round(n.askSal*1.1);
    n.log.push({who:'info', t:`${n.rival}も獲得に動いているようだ。本人の希望年俸は${yen(n.askSal)}に上がっている。`});
  }
  if(kind==='prospect' && p.hot) n.log.push({who:'info', t:`${pick(['J1','J2'])}のクラブも声をかけているらしい。`});
  ui.nego = n; renderNego();
}
function negoTerms(n){
  const o = n.offer;
  const fee = n.counter?.fee ?? Math.round(n.askFee * o.fee);
  const sal = n.counter?.sal ?? Math.round(n.askSal * o.sal);
  return {fee, sal, years: n.years ? o.years : 0};
}
function negoChance(n, t){
  const p = negoTarget(n);
  const fr = n.askFee ? t.fee/n.askFee : 1, sr = t.sal/n.askSal;
  let club = 1, pl;
  if(n.kind==='prospect'){
    pl = clamp(interest(p)/100 + (fr-1)*0.18 + (sr-1)*0.7, 0.03, 0.97);
  } else if(n.kind==='staff'){
    pl = clamp(hireChance(p)*0.75 + (sr-1)*1.6 + (fr-1)*0.35 + (t.years-2)*0.04, 0.03, 0.97);
  } else if(n.kind==='renew'){
    pl = clamp(renewChance(p)*0.7 + (sr-1)*2.2 + (p.age>=30 ? (t.years-1)*0.08 : 0), 0.03, 0.97);
  } else {
    if(!n.feeFixed) club = clamp((fr-0.75)/0.3, 0.02, 1);
    pl = clamp(0.3 + (sr-0.95)*1.9 + n.appeal + (p.age>=30 ? (t.years-1)*0.07 : p.age<=23 ? (2-t.years)*0.03 : 0), 0.03, 0.97);
  }
  return {club, pl};
}
function renderNego(){
  const n = ui.nego; if(!n) return;
  const live = negoTarget(n), p = live || n.snap;
  const t = live ? negoTerms(n) : {fee:0, sal:0, years:0};
  const ch = live ? negoChance(n, t) : {club:0, pl:0};
  const feel = NEGO_FEEL(Math.min(ch.club, ch.pl) * R(0.85,1.15));
  const est = n.snap.est;
  const opt = (key, vals, fmt) => `<div class="seg">${vals.map(v=>`<button class="${n.offer[key]===v&&!n.counter?'on':''}" data-act="negoSet" data-arg="${key}|${v}">${fmt(v)}</button>`).join('')}</div>`;
  const money = S.money >= t.fee + (n.extra||0);
  const logHtml = n.log.map(l=>`<li class="nl-${l.who}">${l.who==='me'?'<b>GM：</b>':l.who==='them'?`<b>${esc(n.party)}：</b>`:''}${esc(l.t)}</li>`).join('');
  const body = n.pending ? `<div class="nego-wait"><div class="spin"></div><p>${esc(n.pending)}</p></div>`
    : n.done ? `<h2 style="text-align:center;color:var(--${n.done==='ok'?'win':'loss'})">${n.done==='ok'?'合意！':'交渉決裂…'}</h2><div class="row"><button class="btn primary" data-act="negoClose">閉じる</button></div>`
    : `${n.counter ? `<div class="warn"><b>逆提案</b>：${n.askFee&&!n.feeFixed||n.kind==='prospect'?`${n.feeLabel||'移籍金'} ${yen(n.counter.fee)}・`:''}年俸 ${yen(n.counter.sal)}${n.years?`・${n.offer.years}年契約`:''}
          <div class="row" style="justify-content:flex-start"><button class="btn primary" data-act="negoCounter" ${S.money<n.counter.fee?'disabled':''}>この条件をのむ</button><button class="btn" data-act="negoRetry">条件を考え直す</button></div></div>`
        : `${!n.feeFixed?`<div class="small muted">${n.feeLabel||'移籍金'}（希望 ${yen(n.askFee)}）</div>${opt('fee', n.feeOpts, v=>`${yen(Math.round(n.askFee*v))}`)}`:n.askFee?`<div class="small muted">${n.kind==='market'&&negoTarget(n).loanFrom?'レンタル料':'移籍金'}：${yen(n.askFee)}（固定）</div>`:''}
          <div class="small muted" style="margin-top:6px">年俸（希望 ${yen(n.askSal)}${n.kind==='prospect'?'・来季からのプロ契約':''}）</div>${opt('sal', n.salOpts, v=>`${yen(Math.round(n.askSal*v))}`)}
          ${n.years?`<div class="small muted" style="margin-top:6px">契約年数</div>${opt('years', p.age>=33&&n.kind!=='staff'?[1]:[1,2,3], v=>`${v}年`)}`:''}
          <p class="small" style="margin:8px 0 0">GMの手応え：<b class="${feel[1]}">${feel[0]}</b>　交渉の余地：${'●'.repeat(n.patience)}${'○'.repeat(Math.max(0,3-n.patience))}</p>
          <div class="row"><button class="btn" data-act="negoQuit">交渉をやめる</button><button class="btn primary" data-act="negoSubmit" ${money?'':'disabled'}>この条件で提示する${money?'':'（資金不足）'}</button></div>`}`;
  openModal(`<div class="small muted">交渉相手：${esc(n.party)}</div>
    <div style="display:flex;align-items:center;gap:8px;margin:4px 0">${n.snap.pos?posTag(n.snap.pos):`<span class="tag">${esc(n.snap.roleName)}</span>`}<h2 style="margin:0">${esc(p.name)}</h2></div>
    <p class="small muted" style="margin:0 0 8px">${p.age}歳・${est}${p.school?`・${esc(p.school)}`:''}</p>
    ${logHtml?`<ul class="nego-log">${logHtml}</ul>`:''}
    ${body}`);
  const lg = document.querySelector('.nego-log'); if(lg) lg.scrollTop = lg.scrollHeight;
}
function negoSubmit(){
  const n = ui.nego; if(!n || n.pending) return;
  const t = negoTerms(n);
  if(S.money < t.fee + (n.extra||0)) return;
  n.log.push({who:'me', t:`${t.fee?`${n.feeLabel||'移籍金'} ${yen(t.fee)}・`:''}年俸 ${yen(t.sal)}${t.years?`・${t.years}年契約`:''}でどうでしょう。`});
  n.pending = pick(NEGO_WAIT); renderNego();
  setTimeout(()=>{ if(ui.nego!==n) return; n.pending = pick(NEGO_WAIT.filter(x=>x!==n.pending)); renderNego(); }, 900);
  setTimeout(()=>{ if(ui.nego!==n) return; negoResolve(n, t); }, 1900);
}
function negoResolve(n, t){
  n.pending = false;
  const p = negoTarget(n);
  const ch = negoChance(n, t);
  const clubOk = Math.random() < ch.club, plOk = Math.random() < ch.pl;
  if(clubOk && plOk){ n.log.push({who:'them', t:pick(['わかりました。その条件でお願いします！','ぜひ一緒に戦わせてください。','悪くない条件です。合意しましょう。'])}); return negoFinish(n, t); }
  const insult = (n.askFee && !n.feeFixed && t.fee/n.askFee < 0.85 && !clubOk) || t.sal/n.askSal < 0.92 && !plOk && Math.random()<0.4;
  n.patience -= insult ? 2 : 1;
  if(n.patience <= 0){
    n.log.push({who:'them', t:pick(['残念ですが、今回はお断りします。','ほかのクラブと話を進めることにしました。','条件が折り合いませんでした。'])});
    n.done = 'ng'; negoFail(n); return renderNego();
  }
  // 逆提案は必ず今の提示より上の条件になる
  const cf = !clubOk && n.askFee ? Math.max(Math.round(t.fee*R(1.05,1.12)), Math.round(n.askFee*R(1.0,1.08))) : t.fee;
  const cs = !plOk ? Math.max(Math.round(t.sal*R(1.05,1.12)), Math.round(n.askSal*R(1.0,1.1))) : t.sal;
  n.counter = {fee:cf, sal:cs};
  const why = !clubOk && n.askFee && !n.feeFixed ? `${n.feeLabel||'移籍金'}が足りません。` : '';
  const why2 = !plOk ? pick(['本人は年俸にもう少しこだわっています。','生活のこともあるので、年俸を上げてほしい。',n.kind==='prospect'?'進学と迷っています。もう少し誠意を見せてほしい。':'他にも話が来ているんです。']) : '';
  n.log.push({who:'them', t:`${insult?'正直、その条件は失礼だと感じました。':''}${why}${why2}この条件なら考えます。`});
  renderNego();
}
function negoFinish(n, t){
  const p = negoTarget(n);
  if(S.money < t.fee + (n.extra||0)){ n.log.push({who:'info', t:'資金が足りず、契約できなかった。'}); n.done='ng'; return renderNego(); }
  n.done = 'ok'; renderNego();
  if(n.kind==='staff'){ p.salary = t.sal; p.years = t.years; installStaff(p, t.fee); }
  else if(n.kind==='market'){ p.fee = t.fee; p.salary = t.sal; if(t.years) p.contract = t.years; signPlayer(p.id); }
  else if(n.kind==='foreign'){ p.fee = t.fee; p.salary = t.sal; p.contract = t.years; ui.nego = null; signForeign(p.id); return; }
  else if(n.kind==='prospect'){
    spend(t.fee, 'transfer'); p.status = 'signed'; p.proSal = t.sal;
    if(isOff()){ addNews(`【新人】${p.school}の${p.name}が入団に合意！ 開幕からチームに加わる。`); }
    else if(p.kind==='大学'){ joinAmateur(p, '特別指定'); addNews(`【新人】${p.school}の${p.name}が来季加入内定！特別指定選手として今季から試合に出られる。`); }
    else addNews(`【新人】${p.school}の${p.name}が来季の加入に内定！「地元のクラブでプロになれて嬉しい」（2種登録すれば今季から出場可能）`);
    save(); render();
  } else if(n.kind==='renew'){
    p.salary = t.sal; p.contract = t.years; p.expiring = false; p.mor = clamp((p.mor??60)+5,0,100);
    addNews(`${p.name}と${t.years}年契約で合意（年俸${yen(t.sal)}）。`); save(); render();
  }
  renderNego();
}
function negoFail(n){
  const p = negoTarget(n); if(!p) return;
  if(n.kind==='market'){ S.market = S.market.filter(x=>x!==p); addNews(`${p.name}との交渉は決裂。${n.rival||'他クラブ'}へ移籍した。`); }
  else if(n.kind==='foreign'){ S.foreignCands = S.foreignCands.filter(x=>x!==p); addNews(`${p.name}の代理人との交渉は決裂した。`); }
  else if(n.kind==='prospect'){ p.status='declined'; addNews(`${p.name}（${p.school}）はオファーを断り、${p.kind==='高校'?pick(['大学進学','J1クラブ入り','J2クラブ入り']):pick(['J1クラブ入り','J2クラブ入り'])}を選んだ。`); }
  else if(n.kind==='renew'){ p.refused = true; addNews(`${p.name}は契約更新を拒否。「新しい環境で挑戦したい」`); }
  else if(n.kind==='staff'){ S.staffMarket = S.staffMarket.filter(x=>x!==p); addNews(`${p.name}（${STAFF_ROLES[p.role].name}候補）との交渉は決裂した。`); }
  save(); render();
}

  const d = new Date(start); d.setDate(d.getDate() + Math.round(weeks * r / Math.max(1, nr()-1)) * 7);
