<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百万石フットボール</title>
<style>
:root{
  --bg:#f5f1e8;--panel:#ffffff;--panel2:#faf7f0;--ink:#1d2433;--muted:#6b7280;--line:#e4ddcd;
  --gold:#b8862a;--gold-soft:#f3e6c6;--indigo:#1f3a68;--indigo-soft:#e3e9f4;
  --win:#1f8a4c;--loss:#c0392b;--draw:#8a8a8a;--warn:#c27c0e;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10141d;--panel:#191f2c;--panel2:#1e2535;--ink:#e9e6df;--muted:#9aa3b2;--line:#2a3245;
  --gold:#dcb257;--gold-soft:#3a3120;--indigo:#8fb0ea;--indigo-soft:#22304a;
  --win:#3fbf74;--loss:#e5675a;--draw:#9aa3b2;--warn:#e6a63a;--shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#10141d;--panel:#191f2c;--panel2:#1e2535;--ink:#e9e6df;--muted:#9aa3b2;--line:#2a3245;
  --gold:#dcb257;--gold-soft:#3a3120;--indigo:#8fb0ea;--indigo-soft:#22304a;
  --win:#3fbf74;--loss:#e5675a;--draw:#9aa3b2;--warn:#e6a63a;--shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 16px}
main.main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
/* リスト系のタブはページ全体を動かさず、リストの枠だけがスクロールする */
main.fill{overflow:hidden}
main.fill>.wrap{height:100%;display:flex;flex-direction:column}
main.fill>.wrap>*{flex-shrink:0}
main.fill .grow{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
main.fill .grow>*{flex-shrink:0}
main.fill .grow>.list-scroll,main.fill .grow>.card-scroll,main.fill>.wrap>.card-scroll{flex:1 1 0;min-height:120px;max-height:none}
main.fill .side{flex:0 1 auto;max-height:26%;overflow-y:auto}
.title-wrap{flex:1;min-height:0;overflow-y:auto;padding-bottom:24px}
header.top{flex:none;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:1040px;margin:0 auto;padding:10px 16px 0}
.club-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.club-name{font-size:19px;font-weight:800;letter-spacing:.02em}
.club-name .mark{color:var(--gold)}
.meta{color:var(--muted);font-size:13px}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;margin:6px 0 8px;font-size:13px}
.stat b{font-size:15px;font-variant-numeric:tabular-nums}
.stat .neg{color:var(--loss)}
.trust{display:inline-block;width:70px;height:7px;background:var(--line);border-radius:4px;vertical-align:middle;overflow:hidden;margin-left:4px}
.trust i{display:block;height:100%;background:var(--gold)}
nav.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;white-space:nowrap;color:var(--muted);font-weight:600}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--gold)}
.grid{display:grid;gap:14px;margin-top:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;letter-spacing:.04em}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:center}
.vs .side{flex:1;min-width:0}
.vs .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere}
.vs .x{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--indigo)}
.bar.gold i{background:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:var(--gold-soft);font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 var(--win)}
tr.down td:first-child{box-shadow:inset 3px 0 var(--loss)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.list-scroll{max-height:min(62vh,560px);overflow:auto;border:1px solid var(--line);border-radius:8px}
table.sticky th{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:inset 0 -1px var(--line)}
table.sticky td:nth-child(1),table.sticky th:nth-child(1){position:sticky;left:0;width:var(--c1,46px);min-width:var(--c1,46px);background:var(--panel);z-index:1}
table.sticky td:nth-child(2),table.sticky th:nth-child(2){position:sticky;left:var(--c1,46px);background:var(--panel);z-index:1;box-shadow:inset -1px 0 var(--line)}
table.sticky th:nth-child(1),table.sticky th:nth-child(2){z-index:3}
table.sticky tr.me td{background:var(--gold-soft)}
.card-scroll{max-height:min(66vh,640px);overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);-webkit-overflow-scrolling:touch}
.card-scroll .card{box-shadow:none}
.card-scroll h3.grp{margin:14px 0 8px;font-size:14px;color:var(--muted)}
.card-scroll h3.grp:first-of-type{margin-top:4px}
@keyframes flash{from{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}to{}}
.flash,.flash td{animation:flash 1.6s ease-out}
@media (prefers-reduced-motion:reduce){.flash,.flash td{animation:none;outline:2px solid var(--gold)}}
.pos{display:inline-block;min-width:30px;text-align:center;border-radius:5px;font-size:11px;font-weight:800;padding:1px 4px;color:#fff}
.pos.GK{background:#b07a12}.pos.DF{background:#2f6db5}.pos.MF{background:#2f8f55}.pos.FW{background:#c2453a}
.ovr{font-weight:800;font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:-1px;font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.tag.inj{background:#f8dcd8;color:#a02b1f}
.tag.rest{background:var(--line);color:var(--muted)}
.tag.xi{background:var(--gold-soft);color:var(--gold)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1420}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel2);text-align:left}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--muted)}
.opt.on{border-color:var(--gold);background:var(--gold-soft)}
.news{list-style:none;margin:0;padding:0;font-size:13.5px}
.news li{padding:6px 0;border-bottom:1px dashed var(--line)}
.news li:last-child{border:0}
.news .r{color:var(--muted);font-size:11.5px;margin-right:6px}
.res{display:inline-flex;width:22px;height:22px;border-radius:5px;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:800;margin-right:3px}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}
.mk{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.mk .card{padding:12px}
.fac{display:flex;gap:12px;align-items:center}
.fac .ic{font-size:26px;width:38px;text-align:center}
.lv{display:flex;gap:3px;margin:4px 0}
.lv i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.lv i.on{background:var(--gold)}
.warn{border-left:4px solid var(--warn);background:var(--gold-soft);padding:8px 10px;border-radius:6px;font-size:13px;margin-top:10px}
.footer-bar{flex:none;background:var(--panel);border-top:1px solid var(--line);z-index:6}
.footer-inner{max-width:1040px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:space-between}
.footer-inner .info{font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:800;font-size:15px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:18px;border:1px solid var(--line)}
.modal-box h2{margin:0 0 8px;font-size:19px}
.score{display:flex;align-items:center;justify-content:center;gap:14px;margin:8px 0 4px}
.score .t{flex:1;text-align:center;font-weight:800;overflow-wrap:anywhere}
.score .n{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.clock{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.log{list-style:none;padding:0;margin:10px 0;max-height:240px;overflow:auto;font-size:13.5px}
.log li{padding:4px 0;border-bottom:1px dashed var(--line)}
.log .m{display:inline-block;width:34px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .goal{font-weight:800}
.log .us{color:var(--win)}
.log .them{color:var(--loss)}
.rep h4,.card h4{margin:4px 0 6px;font-size:16px}
.rep-from{font-size:12.5px;color:var(--indigo);font-weight:700}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--indigo);border-color:var(--indigo);color:var(--panel)}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiers .btn{padding:6px 4px;line-height:1.35}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.kv{display:grid;grid-template-columns:auto auto;gap:3px 14px;font-size:13.5px}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.plus{color:var(--win)}.minus{color:var(--loss)}
.title-screen{max-width:560px;margin:8vh auto 0;padding:0 16px;text-align:center}
.title-screen h1{font-size:32px;margin:0;letter-spacing:.06em}
.title-screen h1 span{color:var(--gold)}
.title-screen p{color:var(--muted)}
.title-screen input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;max-width:340px;text-align:center}
.gold-line{height:3px;width:80px;background:var(--gold);margin:14px auto;border-radius:2px}
.ladder{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.ladder span{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ladder span.on{background:var(--gold);color:#fff;border-color:var(--gold)}
@media (max-width:560px){
  th.hide-s,td.hide-s{display:none}
  .score .n{font-size:32px;min-width:84px}
}
</style>
</head>
<body>

<script>

// ===================== 定数 =====================

            desc:l=>`移籍市場の選手の質 +${(l-1)*3}・伸びしろが見える`},

const FORMATIONS = {
  '4-4-2':{DF:4,MF:4,FW:2,att:0,def:0,desc:'バランス型の基本陣形'},
  '4-3-3':{DF:4,MF:3,FW:3,att:3,def:-2,desc:'攻撃的。前線に3人'},
  '3-5-2':{DF:3,MF:5,FW:2,att:1.5,def:-1,desc:'中盤で主導権を握る'},
  '5-3-2':{DF:5,MF:3,FW:2,att:-3,def:3.5,desc:'守備を固める'},
};
const TACTICS = {
  attack: {name:'超攻撃的', own:1.2, opp:1.18, desc:'点を取りにいくが失点も増える'},
  balance:{name:'バランス', own:1, opp:1, desc:'状況に応じて戦う'},
  counter:{name:'カウンター', own:0.95, opp:0.88, desc:'格上相手に有効', counter:true},
  defend: {name:'守備的', own:0.8, opp:0.76, desc:'失点を減らすが得点も減る'},
};
const TRAINING = {
  rest:  {name:'休養', g:0,   c:15,  inj:0,     desc:'コンディション大回復'},
  normal:{name:'通常練習', g:1, c:-3, inj:0.008, desc:'成長とコンディションを両立'},
  hard:  {name:'猛練習', g:1.8, c:-11, inj:0.025, desc:'成長◎ 疲労・負傷リスク大'},
};
const TICKET = {
  low: {name:'安め', price:0.7, demand:1.3},
  mid: {name:'標準', price:1, demand:1},
  high:{name:'強気', price:1.45, demand:0.72},
};
const PR = {
  none:   {name:'なし', cost:0, desc:'今週は活動しない'},
  kenroku:{name:'兼六園クリーン活動', cost:0, desc:'ファン微増・フロント信頼+1', fans:[0.008,8], trust:1},
  omicho: {name:'近江町市場コラボ屋台', cost:300, desc:'ファン増', fans:[0.025,30]},
  tv:     {name:'地元テレビ・ラジオ出演', cost:600, desc:'ファン大幅増', fans:[0.04,40]},
  school: {name:'小学校サッカー教室', cost:200, desc:'ファン増・ユースの素質UP', fans:[0.015,15], youth:1},
  gold:   {name:'金箔ユニフォーム限定販売', cost:1200, desc:'グッズ収入（当たり外れあり）', fans:[0.015,10], merch:true},
};
const SURN = ['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','佐々木','山口','松本','井上','木村','林','清水','山崎','森','池田','橋本','阿部','石川','前田','藤井','岡田','後藤','長谷川','村上','近藤','石井','坂本','遠藤','青木','藤田','西村','福田','太田','松田','原田','中島','竹内','金子','和田','中野','北村','浅野','米田','寺井','西田','東','本田','谷口','宮本','新谷','能登谷','小松','南','表','道下','島田','荒木','宮川'];
const GIVEN = ['翔','大輝','蓮','陽斗','悠真','湊','颯太','樹','大和','陸','海斗','拓海','優斗','健太','亮','航','駿','涼','隼人','恭平','慎吾','直樹','雄大','和真','誠','啓太','龍之介','光','匠','瑛太','奏','碧','朝陽','健','康平','圭','晴','壮真','凌','一輝','俊介','裕太','剛','悠人','伸'];

const CITY_NATION = ['札幌','函館','青森','盛岡','秋田','山形','福島','水戸','宇都宮','前橋','大宮','千葉','柏','町田','相模原','静岡','浜松','沼津','甲府','岐阜','四日市','奈良','和歌山','姫路','岡山','福山','鳥取','松江','山口','徳島','高松','松山','高知','北九州','佐賀','長崎','大分','熊本','宮崎','鹿児島','那覇','いわき','八戸','藤枝','今治','草津'];

// ===================== ユーティリティ =====================
const R = (a,b)=>a+Math.random()*(b-a);
const RI = (a,b)=>Math.floor(R(a,b+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1 = v=>Math.round(v);
function yen(v){
  v=Math.round(v); const neg=v<0; v=Math.abs(v);
  const s = v>=10000 ? Math.floor(v/10000)+'億'+(v%10000? (v%10000)+'万':'') : v+'万';
  return (neg?'-':'')+s+'円';
}
function poisson(l){ const L=Math.exp(-l); let k=0,p=1; do{k++;p*=Math.random();}while(p>L); return k-1; }
let uidc = 1;

function youthCount(l){ return 1 + (l>=3?1:0) + (l>=5?1:0); }
function month(r){ return 3 + Math.floor(Math.min(r,ROUNDS-1)/2); }

function genName(foreign){ return foreign ? pick(FOREIGN) : pick(SURN)+' '+pick(GIVEN); }
function calcSalary(ovr){ return Math.round((Math.pow(Math.max(1,ovr-25),2.2)*0.1+15)*10); }
function playerValue(p){
  const base = Math.pow(Math.max(1,p.ovr-25),2.2)*0.4;
  const ageF = p.age<=21?1.4:p.age<=25?1.2:p.age<=29?1:p.age<=32?0.7:0.4;
  const potF = 1+Math.max(0,p.pot-p.ovr)/60;
  return Math.round((base*ageF*potF+10)*10);
}
function makePlayer(pos, ovr, age, pot, foreign){
  ovr = clamp(ovr,12,95);
  return {id:uid(), name:genName(foreign), pos, age, ovr, pot:clamp(Math.max(pot,ovr),12,97),
          cond:100, inj:0, goals:0, apps:0, sg:0, sa:0, rest:false, mor:65, salary:calcSalary(ovr), foreign:!!foreign};
}
function randPos(){ const r=Math.random()*12; return r<1.2?'GK':r<5.2?'DF':r<9?'MF':'FW'; }

function genTeam(div, ex){
  const b = DIVS[div].base; const str = R(b[0],b[1]) + (ex||0);
  let name;
  const used = new Set((S&&S.teams||[]).map(t=>t.name));
  do{ name = pick(div<=1?CITY_LOCAL:CITY_NATION)+' '+pick(SUFFIX); }while(used.has(name));
  return {name, str, att:str+R(-4,4), def:str+R(-4,4), isMe:false};
}
function resetTable(t){ Object.assign(t,{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,form:[]}); }

function makeSchedule(n){
  const idx=[...Array(n).keys()]; const rounds=[];
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++){
      const a=idx[i], b=idx[n-1-i];
      pairs.push((r+i)%2 ? [b,a] : [a,b]);
    }
    rounds.push(pairs);
    idx.splice(1,0,idx.pop());
  }
  // シャッフル（前半）
  for(let i=rounds.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [rounds[i],rounds[j]]=[rounds[j],rounds[i]]; }
  return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));
}

function startSeason(){
  S.teams.forEach(resetTable);
  S.schedule = makeSchedule(10);
  S.round = 0;
  S.sponsor = Math.round(DIVS[S.div].sponsor*1.4 + S.fans*3);
  S.visitsLeft = salesTeam().length; S.watchLeft = watchPerWeek();
  refreshStaffMarket();
  S.fin = {income:0, expense:0};
  S.players.forEach(p=>{p.sg=0; p.sa=0;});
  // 目標順位 = 戦力順位
  const my = teamRating(getLineup(true)).ovr;
  const better = S.teams.filter(t=>!t.isMe && t.str > my).length;
  S.target = clamp(better+1, 1, 9);
  if(S.div===0 && S.season===1) S.target = Math.max(S.target, 7);
}

// ===================== 戦力計算 =====================
function eff(p){ return p.ovr*(0.72+0.28*p.cond/100)*(0.94+0.12*(p.mor??50)/100); }
function getLineup(ignoreCond){
  const f = FORMATIONS[S.formation];
  const need = {GK:1, DF:f.DF, MF:f.MF, FW:f.FW};
  const avail = S.players.filter(p=>p.inj===0 && !p.rest && !p.restOnce && !p.loan);
  const score = p=> (p.promise?1000:0) + (ignoreCond ? p.ovr : eff(p));
  const used = new Set(); const xi = [];
  for(const pos of ['GK','DF','MF','FW']){
    const c = avail.filter(p=>p.pos===pos).sort((a,b)=>score(b)-score(a)).slice(0,need[pos]);
    c.forEach(p=>{used.add(p.id); xi.push({p, slot:pos, pen:false});});
    need[pos]-=c.length;
  }
  for(const pos of ['GK','DF','MF','FW']){
    while(need[pos]>0){
      const rest = avail.filter(p=>!used.has(p.id)).sort((a,b)=>score(b)-score(a));
      if(rest.length){ used.add(rest[0].id); xi.push({p:rest[0], slot:pos, pen:true}); }
      else xi.push({p:{id:'ghost'+Math.random(),name:'ユース（臨時）',pos,ovr:18,cond:100,age:16,ghost:true}, slot:pos, pen:false});
      need[pos]--;
    }
  }
  return xi;
}
function teamRating(xi){
  const f = FORMATIONS[S.formation];
  const g = {GK:[],DF:[],MF:[],FW:[]};
  xi.forEach(s=>g[s.slot].push(eff(s.p)*(s.pen?(s.slot==='GK'?0.55:0.78):1)));
  const avg = a=>a.length? a.reduce((x,y)=>x+y,0)/a.length : 15;
  const GK=avg(g.GK), DF=avg(g.DF), MF=avg(g.MF), FW=avg(g.FW);
  const m = S.staff.manager;
  const mb = m ? (m.abil-45)/10 + (m.style===S.tactic?1.5:0) : -3;
  const att = FW*0.5 + MF*0.38 + DF*0.12 + f.att + mb;
  const def = DF*0.48 + GK*0.27 + MF*0.25 + f.def + mb;
  return {att, def, ovr:(att+def)/2};
}
function lam(att, def, home, mul){ return clamp(1.25*Math.exp((att-def)/13)*(home?1.12:0.9)*mul, 0.12, 4.8); }

// ===================== 進行 =====================
function addNews(t){ S.news.unshift({s:S.season, r:S.round, t}); S.news = S.news.slice(0,40); }
function changeFans(rate, flat, div){
  const before=S.fans; let g = S.fans*rate + flat;
  if(g>0) g *= Math.max(0.03, 1 - S.fans/FAN_CAP[div===undefined?S.div:div]);
  S.fans = Math.max(200, Math.round(S.fans+g)); return S.fans-before;
}
function earn(v){ S.money+=v; S.fin.income+=v; }
function spend(v){ S.money-=v; S.fin.expense+=v; }

function applyTraining(){
  const t = TRAINING[S.training];
  const facG = 0.8 + 0.15*S.fac.training;
  const medRed = (1 - (S.fac.medical-1)*0.15) * (1.15 - staffAb('physical')/250);
  const youthM = (0.8 + staffAb('youth')/250) * (S.mentor===S.season?1.15:1);
  const gkM = 0.7 + staffAb('gk')/150;
  const injured = [];
  for(const p of S.players){
    if(p.loan) continue;
    if(p.inj>0){ p.inj--; p.cond = clamp(p.cond+10,30,100); continue; }
    const ageF = p.age<=20?1.3:p.age<=23?1:p.age<=26?0.6:p.age<=29?0.25:0;
    if(t.g>0 && ageF>0 && !S.snow){
      p.ovr = Math.min(p.pot, p.ovr + Math.max(0,p.pot-p.ovr)*0.03*t.g*ageF*facG*(p.age<=23?youthM:1)*(p.pos==='GK'?gkM:1)*R(0.5,1.5));
    }
    p.cond = clamp(p.cond + t.c + (p.rest?12:0), 30, 100);
    if(!p.rest && Math.random() < t.inj*medRed){ p.inj = RI(1,3); injured.push(p); }
  }
  injured.forEach(p=>addNews(`練習中に ${p.name} が負傷（全治${p.inj}週）。`));
  S.snow = false;
  if(S.restBack){ S.training = S.restBack; S.restBack = null; }
}

function applyPR(){
  const a = PR[S.pr]; if(!a || S.pr==='none') return null;
  if(S.money < a.cost){ addNews(`資金不足で「${a.name}」は中止になった。`); return null; }
  spend(a.cost);
  let msg = `「${a.name}」を実施。`;
  const df = changeFans(a.fans[0], a.fans[1]*Math.sqrt(DIV_MULT[S.div]));
  msg += ` ファン +${df}人`;
  if(a.trust) S.trust = clamp(S.trust+a.trust,0,100);
  if(a.youth) S.youthBonus = Math.min(S.youthBonus+1, 8);
  if(a.merch){
    const sold = Math.round(R(400,3000) * (0.5 + S.fans/2000));
    earn(sold); msg += `・グッズ売上 ${yen(sold)}`;
  }
  addNews(msg);
  return msg;
}

function simAI(h,a){
  const H=S.teams[h], A=S.teams[a];
  const gh = poisson(lam(H.att+R(-3,3), A.def+R(-3,3), true, 1));
  const ga = poisson(lam(A.att+R(-3,3), H.def+R(-3,3), false, 1));
  record(h,a,gh,ga);
}
function record(h,a,gh,ga){
  const H=S.teams[h], A=S.teams[a];
  H.p++;A.p++;H.gf+=gh;H.ga+=ga;A.gf+=ga;A.ga+=gh;
  if(gh>ga){H.w++;A.l++;H.pts+=3;H.form.push('W');A.form.push('L');}
  else if(gh<ga){A.w++;H.l++;A.pts+=3;H.form.push('L');A.form.push('W');}
  else{H.d++;A.d++;H.pts++;A.pts++;H.form.push('D');A.form.push('D');}
}

const GOAL_LINES = ['豪快なミドルシュート！','ヘディングで叩き込む！','鮮やかなカウンターから！','PKを冷静に決める！','こぼれ球を押し込んだ！','華麗なループシュート！','セットプレーから！','ドリブル突破からのゴール！'];
const OPP_LINES = ['失点…守備が崩された。','相手のカウンターに沈む。','セットプレーから失点。','ミドルシュートを決められる。','一瞬の隙を突かれた。'];
const FLAVOR = ['スタンドから「金沢コール」が響く。','雨の中、激しい攻防が続く。','GKのビッグセーブ！','惜しい！シュートはポスト直撃。','中盤で激しいボールの奪い合い。','サポーターの太鼓が鳴り響く。','決定機を逃した…','相手の猛攻をしのぐ。'];

function pickScorer(xi){
  const w = xi.map(s=>({p:s.p, w:(s.slot==='FW'?5:s.slot==='MF'?2.5:s.slot==='DF'?0.8:0.02)*Math.pow(s.p.ovr/40,2)}));
  let tot = w.reduce((a,b)=>a+b.w,0), r=Math.random()*tot;
  for(const x of w){ r-=x.w; if(r<=0) return x.p; }
  return w[0].p;
}

function playOurMatch(h,a){
  const home = h===0; const oi = home?a:h; const opp = S.teams[oi];
  const xi = getLineup(); const rt = teamRating(xi); const t = TACTICS[S.tactic];
  let own=t.own, opm=t.opp;
  if(t.counter){ const stronger = opp.str > rt.ovr; own = stronger?1.08:0.9; opm = stronger?0.85:0.95; }
  const gu = poisson(lam(rt.att, opp.def+R(-3,3), home, own));
  const go = poisson(lam(opp.att+R(-3,3), rt.def, !home, opm));
  const events=[];
  for(let i=0;i<gu;i++){ const s=pickScorer(xi); events.push({m:RI(1,90), us:true, p:s}); }
  for(let i=0;i<go;i++) events.push({m:RI(1,90), us:false});
  [...FLAVOR].sort(()=>Math.random()-0.5).slice(0,RI(3,5)).forEach(t=>events.push({m:RI(1,90), flavor:t}));
  events.sort((x,y)=>x.m-y.m);
  events.forEach(e=>{
    if(e.flavor) return;
    if(e.us){ e.text = `⚽ ${e.p.name} ${pick(GOAL_LINES)}`; if(!e.p.ghost){e.p.goals++; e.p.sg++;} }
    else e.text = `${opp.name} ${pick(OPP_LINES)}`;
  });
  // 選手の状態
  const ids = new Set(xi.map(s=>s.p.id));
  const medRed = (1 - (S.fac.medical-1)*0.15) * (1.15 - staffAb('physical')/250);
  const injuredNow=[];
  for(const p of S.players){
    if(p.loan) continue;
    if(ids.has(p.id)){
      p.apps++; p.sa++; p.cond = clamp(p.cond-18,30,100);
      if(p.age<=27) p.ovr = Math.min(p.pot, p.ovr + Math.max(0,p.pot-p.ovr)*0.012);
      if(Math.random()<0.025*medRed){ p.inj=RI(1,4); injuredNow.push(p); }
    } else if(p.inj===0){ p.cond = clamp(p.cond+8,30,100); }
    p.cond = clamp(p.cond + 6 + (S.fac.medical-1)*2 + staffAb('physical')/40, 30, 100);
  }
  injuredNow.forEach(p=>{ events.push({m:RI(10,89), text:`🚑 ${p.name} が負傷交代（全治${p.inj}週）`, inj:true}); });
  events.sort((x,y)=>x.m-y.m);
  if(home) record(0,oi,gu,go); else record(oi,0,go,gu);
  const res = gu>go?'W':gu<go?'L':'D';
  S.results.push(res); S.results = S.results.slice(-10);
  moraleAfterMatch(ids, res);
  return {opp, home, gu, go, events, res, rating:rt, xi};
}

function seasonFanGain(res){
  if(res==='W') return changeFans(0.04, 15*Math.sqrt(DIV_MULT[S.div]));
  if(res==='D') return changeFans(0.008, 3);
  return changeFans(-0.015, 0);
}

  {w:2, ok:()=>month(S.round)===6, f:()=>{const d=changeFans(0.05,30); return `百万石まつりの行列にクラブで参加！ ファン +${d}人`;}},

  {w:0.7, f:()=>{const v=Math.round(R(400,1200)*Math.sqrt(DIV_MULT[S.div])); earn(v); return `加賀友禅コラボのマフラーが完売！ 売上 ${yen(v)}`;}},
  {w:0.6, f:()=>{S.players.forEach(p=>p.cond=clamp(p.cond+10,30,100)); return '犀川沿いの合同ランニングで選手たちがリフレッシュ。全員のコンディションUP';}},
];
function randomEvent(){
  if(Math.random()>0.38) return null;
  const pool = EVENTS.filter(e=>!e.ok||e.ok());
  let tot = pool.reduce((a,b)=>a+b.w,0), r=Math.random()*tot;
  for(const e of pool){ r-=e.w; if(r<=0){ const t=e.f(); if(t) addNews(t); return t; } }
  return null;
}

function refreshMarket(n){
  S.market = S.market.filter(p=>!p.stale);
  S.market.forEach(p=>p.age2=(p.age2||0)+1);
  S.market = S.market.filter(p=>p.age2<4);
  for(let i=0;i<n;i++) S.market.push(genCandidate());
  S.market = S.market.slice(-8);
}
function genCandidate(){
  const b = DIVS[S.div].base; const mid=(b[0]+b[1])/2;
  const sc = S.fac.scout;
  const foreign = Math.random()<0.12;
  const age = RI(18,33);
  let ovr = mid + (sc-1)*3 + R(-13,7) + (foreign?4:0);
  if(Math.random()<0.08) ovr += R(5,10); // 掘り出し物
  const pot = age<=21 ? ovr+R(4,16+sc*2) : age<=25 ? ovr+R(1,8+sc) : age<=28 ? ovr+R(0,3) : ovr;
  const p = makePlayer(randPos(), ovr, age, pot, foreign);
  p.fee = Math.round(playerValue(p) * (foreign?1.15:1));
  return p;
}

function payWeekly(home){
  const out = {ticket:0, att:0, sponsor:0, salary:0, upkeep:0};
  out.sponsor = Math.round((S.sponsor+contractIncome())/ROUNDS); earn(out.sponsor);
  out.salary = Math.round((S.players.filter(p=>!p.loan).reduce((a,p)=>a+p.salary,0)+staffSalary())/ROUNDS); spend(out.salary);
  out.upkeep = Object.keys(FAC).reduce((a,k)=>a+FAC[k].upkeep*S.fac[k],0) * (1+S.div*0.3);
  out.upkeep = Math.round(out.upkeep); spend(out.upkeep);
  if(home){
    const tk = TICKET[S.ticket]; const last = S.results.slice(-5);
    const form = last.filter(r=>r==='W').length - last.filter(r=>r==='L').length;
    const demand = S.fans * (0.66 + form*0.03) * tk.demand * R(0.85,1.15);
    out.att = Math.round(clamp(demand, 150, CAP[S.fac.stadium-1]));
    out.ticket = Math.round(out.att * DIVS[S.div].ticket * tk.price / 10000);
    earn(out.ticket);
  }
  return out;
}

function advance(){
  if(!S || S.over || S.round>=ROUNDS) return;
  const before = {money:S.money, fans:S.fans};
  expireReports();
  applyTraining();
  applyPR();
  let ours=null;
  for(const [h,a] of S.schedule[S.round]){
    if(h===0||a===0) ours = playOurMatch(h,a); else simAI(h,a);
  }
  const fin = payWeekly(ours.home);
  if(ours.res==='W') S.trust+=3; else if(ours.res==='L') S.trust-=2;
  const fanD = seasonFanGain(ours.res);
  if(S.money<0) { S.trust -= S.money<-3000 ? 3 : 1; addNews('⚠ 資金がマイナスです。フロントの信頼が下がっています。'); }
  S.trust = clamp(S.trust,0,100);
  const sc = `${ours.home?'H':'A'} ${ours.gu}-${ours.go} vs ${ours.opp.name}`;
  addNews(`第${S.round+1}節 ${ {W:'勝利',D:'引き分け',L:'敗戦'}[ours.res] }：${sc}`);
  const ev = randomEvent();
  refreshMarket(2);
  AMA_EVENTS.filter(e=>e.r===S.round).forEach(runAmaEvent);
  generateReports();
  if(S.round%4===3) refreshStaffMarket(3);
  S.companies.forEach(c=>{ if(c.cool>0) c.cool--; });
  S.round++;
  S.visitsLeft = salesTeam().length; S.watchLeft = watchPerWeek();
  if(S.trust<=0){ S.over='fired'; }
  save();
  showMatch(ours, fin, {dm:S.money-before.money, df:S.fans-before.fans, fanD, ev});
}

function standings(){
  return S.teams.map((t,i)=>({...t,i,gd:t.gf-t.ga})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf);
}
function myRank(){ return standings().findIndex(t=>t.isMe)+1; }

function endSeason(){
  const st = standings(); const rank = st.findIndex(t=>t.isMe)+1;
  const d = S.div; const report = {rank, div:d, lines:[], target:S.target};
  // 賞金
  const prize = Math.round(DIVS[d].prize * (11-rank)/10 * (rank===1?2:1));
  earn(prize); report.prize = prize;
  // 昇格・降格
  let moved = 0, champion=false;
  const issues = licenseIssues();
  const licOK = d<4 && issues.length===0;
  const upIdx = []; const downIdx=[];
  if(d<4){
    for(const t of st){ if(upIdx.length>=2) break; if(t.isMe && !licOK) continue; upIdx.push(t.i); }
  }
  if(d>0) downIdx.push(st[st.length-1].i, st[st.length-2].i);
  if(upIdx.includes(0)) moved = 1;
  if(downIdx.includes(0)) moved = -1;
  if(d===4 && rank===1){ champion=true; S.champion++; }
  if(d<4 && rank<=2 && !licOK) report.lines.push(`昇格圏でしたが、${DIVS[d+1].name}のクラブライセンス基準（${issues.join('・')}）を満たさず昇格できませんでした…`);
  // 信頼
  let td = (S.target - rank)*4;
  if(moved===1) td+=20; if(moved===-1) td-=20; if(champion) td+=30;
  S.trust = clamp(S.trust + td, 0, 100);
  report.trust = td;
  // ファン
  let fd = 0;
  if(moved===1) fd = changeFans(0.3, 300*DIV_MULT[d], d+1);
  else if(moved===-1) fd = changeFans(-0.15, 0);
  else fd = changeFans(rank<=3?0.08:rank>=8?-0.05:0.02, 0);
  if(champion) fd += changeFans(0.25,0);
  report.fans = fd;
  S.history.push({season:S.season, div:d, rank, pts:st[rank-1].pts, moved, champion});
  // 期限付き移籍から復帰
  for(const p of S.players.filter(x=>x.loan)){
    const g = Math.max(0,p.pot-p.ovr)*R(0.2,0.35); p.ovr += g; p.loan=false; p.mor=clamp((p.mor??60)+5,0,100);
    report.lines.push(`期限付き移籍していた${p.name}が復帰。武者修行で能力が${Math.round(g)}上がった！`);
  }
  S.players.forEach(p=>{ p.promise=false; p.restOnce=false; });
  // 選手の加齢・引退
  const retired=[];
  for(const p of S.players){
    p.age++;
    if(p.age>=31) p.ovr = Math.max(12, p.ovr - R(0.5,2.2)*(p.age-29)/2);
    if(p.age>=30) p.pot = p.ovr;
    p.salary = Math.max(Math.round(p.salary*0.9), calcSalary(p.ovr));
    if(p.age>=34 && Math.random()<(p.age-33)*0.3) retired.push(p);
  }
  S.players = S.players.filter(p=>!retired.includes(p));
  report.retired = retired.map(p=>p.name);
  // ユース昇格
  const ys = []; const b = DIVS[0].base;
  for(let i=0;i<youthCount(S.fac.youth);i++){
    const age = RI(16,18);
    const lvl = S.fac.youth + S.youthBonus*0.5 + staffAb('youth')/40;
    const ovr = b[0] - 8 + lvl*3 + R(-4,4) + S.div*2;
    const p = makePlayer(randPos(), ovr, age, ovr + R(12, 22+lvl*4));
    S.players.push(p); ys.push(p);
  }
  S.youthBonus = 0;
  report.youth = ys.map(p=>`${p.name}（${p.pos}）`);
  report.joined = prospectsSeasonEnd(report.lines);
  staffSeasonEnd(report.lines);
  companiesSeasonEnd(rank, report.lines);
  S.inbox = S.inbox.filter(r=>r.kind!=='ama');
  // リーグ再編
  const me = S.teams[0];
  if(moved!==0){
    S.div += moved;
    S.teams = [me];
    for(let i=0;i<9;i++) S.teams.push(genTeam(S.div));
  } else {
    const repl = new Set([...upIdx, ...downIdx]);
    S.teams = S.teams.map((t,i)=>{
      if(t.isMe) return t;
      if(repl.has(i)) return genTeam(S.div, upIdx.includes(i)? -2 : 2);
      const dr = R(-3,3); t.str+=dr; t.att+=dr+R(-1,1); t.def+=dr+R(-1,1); return t;
    });
  }
  report.moved = moved; report.champion = champion;
  S.season++;
  startSeason();
  refreshMarket(6);
  addNews(`第${S.season}シーズン開幕！ ${DIVS[S.div].name}で戦う。フロントの目標は${S.target}位以内。`);
  if(S.trust<=0) S.over='fired';
  save();
  return report;
}

function genStaff(role, center){
  const c = center===undefined ? 34 + S.div*9 + R(-6,10) : center;
  const abil = clamp(Math.round(c + R(-12,12)), 12, 95);
  const st = {id:uid(), role, name:pick(SURN)+' '+pick(GIVEN), age: role==='sales'?RI(25,55):RI(33,66), abil, years:RI(1,3)};
  if(role!=='sales' && Math.random()<0.1){ st.name = pick(FOREIGN); st.foreign = true; }
  if(role==='manager'){
    st.style = pick(Object.keys(TACTICS));
    st.man = clamp(Math.round(R(25,90)),10,95);
    st.lic = Math.random() < clamp((abil-28)/40,0.05,0.97) ? 'S級' : 'A級';
  }
  st.salary = Math.round(STAFF_ROLES[role].base * Math.pow(abil/40,2) * (st.lic==='S級'?1.2:1) + 5);

function staffAb(role){ const s = S.staff[role]; return s ? s.abil : 15; }
function salesTeam(){ return S.staff.sales || []; }
function allStaff(){ return [...Object.keys(STAFF_ROLES).filter(r=>r!=='sales').map(r=>S.staff[r]).filter(Boolean), ...salesTeam()]; }
function staffSalary(){ return allStaff().reduce((a,s)=>a+s.salary,0); }
function hireChance(st){ return clamp(1.15 - (st.abil - (38 + S.div*10))/35, 0.1, 1); }
function refreshStaffMarket(n){
  if(n===undefined){ S.staffMarket = []; for(const r of Object.keys(STAFF_ROLES)) for(let i=0;i<(r==='manager'?3:2);i++) S.staffMarket.push(genStaff(r)); return; }
  for(let i=0;i<n;i++) S.staffMarket.push(genStaff(pick(Object.keys(STAFF_ROLES))));
  // 役職ごとに新しい順で最大3人まで残す
  const keep = new Set(Object.keys(STAFF_ROLES).flatMap(r=>S.staffMarket.filter(x=>x.role===r).slice(-3).map(x=>x.id)));

function fireCost(st){ return Math.round(st.salary * st.years * 0.5); }
function hireStaff(id){
  const st = S.staffMarket.find(x=>x.id===id); if(!st) return;
  const role = st.role; const cur = role==='sales' ? null : S.staff[role];
  if(role==='sales' && salesTeam().length>=MAX_SALES) return toast(`営業担当は最大${MAX_SALES}人です。`);
  const fee = Math.round(st.salary*0.3) + (cur?fireCost(cur):0);
  if(S.money < fee) return toast(`資金が足りません（必要 ${yen(fee)}）。`);
  const doHire = ()=>{
    if(Math.random() > hireChance(st)){
      S.staffMarket = S.staffMarket.filter(x=>x!==st);
      addNews(`${st.name}（${STAFF_ROLES[role].name}候補）に就任を打診したが、「今のクラブの規模では…」と辞退された。`);
      save(); render(); return toast(`${st.name} に断られました。クラブが上のリーグに行けば、有力な人材も来てくれるはずです。`);
    }
    spend(fee);
    S.staffMarket = S.staffMarket.filter(x=>x!==st);
    if(role==='sales') S.staff.sales.push(st);
    else {
      if(cur) addNews(`${STAFF_ROLES[role].name}の${cur.name}と契約を解除（違約金 ${yen(fireCost(cur))}）。`);
      S.staff[role] = st;
    }
    if(role==='manager'){ S.players.forEach(p=>p.mor=clamp((p.mor??60)+8,0,100)); addNews(`新監督に${st.name}が就任！「${st.bio}」。チームは新体制で心機一転。`); }
    else addNews(`${STAFF_ROLES[role].name}に${st.name}を招聘。（${st.bio}）`);
    save(); render();
  };

}
function fireStaff(id){
  const st = allStaff().find(x=>x.id===id); if(!st) return;
  const c = fireCost(st);
  confirmBox(`${STAFF_ROLES[st.role].name}の${st.name}を解任しますか？（違約金 ${yen(c)}）`, ()=>{
    spend(c);
    if(st.role==='sales') S.staff.sales = S.staff.sales.filter(x=>x!==st); else S.staff[st.role] = null;
    if(st.role==='manager'){ S.players.forEach(p=>p.mor=clamp((p.mor??60)-3,0,100)); S.trust = clamp(S.trust + (S.results.slice(-5).filter(r=>r==='L').length>=3?4:-4),0,100); }

    save(); render();
  });
}

function generateReports(){
  if(S.inbox.length>=4) return;
  const c = ctxNow();
  const chance = 0.4 + staffAb('hc')/220;
  const kinds = Object.keys(REPORTS).filter(k=>k!=='ama').sort(()=>Math.random()-0.5);
  let made = 0, max = staffAb('hc')>=55 ? 2 : 1;
  for(const k of kinds){
    if(made>=max || Math.random()>chance) continue;
    if(S.inbox.some(r=>r.kind===k)) continue;
    const rep = REPORTS[k].make(c);
    if(rep){ S.inbox.push(rep); made++; const p=S.players.find(x=>x.id===rep.pid); if(p) p.repT=tick(); }
  }
}
function resolveReport(id, key, auto){
  const rep = S.inbox.find(r=>r.id===id); if(!rep) return;
  S.inbox = S.inbox.filter(r=>r!==rep);
  const p = rep.pid ? S.players.find(x=>x.id===rep.pid) : null;
  if(rep.pid && !p){ return; }
  const msg = REPORTS[rep.kind].resolve(key, p, rep);
  if(rep.kind!=='ama' && rep.kind!=='mood') addNews(`【${auto?'未対応→自動処理':'報告'}】${msg}`);
  return msg;
}
function expireReports(){
  for(const r of [...S.inbox]) if(tick()-r.t>=2) resolveReport(r.id, r.opts[r.opts.length-1][0], true);
}
function moraleAfterMatch(xiIds, res){
  const hcAdj = (staffAb('hc')-50)/5 + ((S.staff.manager?.man||30)-50)/8;
  const c = ctxNow();
  for(const p of S.players){
    if(p.loan) continue;
    p.mor = p.mor ?? 60;
    if(xiIds.has(p.id)){ p.mor += 2; if(p.promise){ p.mor += 10; p.promise=false; } }
    else if(!p.inj){
      if(p.promise){ p.mor -= 25; p.promise=false; addNews(`${p.name}への先発の約束を破ってしまった…本人は激怒している。`); }
      p.mor -= p.ovr >= c.avg-3 ? 3 : 1;
    }
    p.mor += res==='W'?3 : res==='L'?-2 : 0;
    p.mor += ((58+hcAdj) - p.mor)*0.08;
    p.mor = clamp(p.mor,0,100);
    p.restOnce = false;
  }
}

const SCHOOLS = ['金沢翠嶺高校','加賀北辰高校','能登海星高校','小松白嶺高校','金沢犀星高校','七尾港南高校','白山学園高校','野々市工業高校','金沢東雲高校','輪島朝凪高校'];
const UNIS = ['金沢文理大学','北陸学芸大学','加賀工科大学','石川国際大学','能登海洋大学','富山北陸大学','福井総合大学','新潟体育大学'];
const AMA_EVENTS = [
  {r:3,  kind:'大学', name:'北信越大学サッカーリーグ前期', type:'league'},
  {r:6,  kind:'高校', name:'インターハイ石川県予選', type:'final'},
  {r:9,  kind:'高校', name:'インターハイ本大会', type:'national'},
  {r:11, kind:'大学', name:'総理大臣杯 北信越予選', type:'final'},
  {r:14, kind:'高校', name:'全国高校サッカー選手権 石川県大会', type:'final'},
  {r:17, kind:'大学', name:'北信越大学サッカーリーグ後期', type:'league'},
];
const AMA_TAGS = ['大会MVP','得点王','ベストイレブン','優秀選手','守備の要','注目のドリブラー'];
function noiseLevel(){ return Math.max(1.5, 12 - S.fac.scout*1.4 - staffAb('scout')/12); }
function setEstimate(pr, n){
  pr.lo = Math.round(pr.ovr - R(0.3,1)*n); pr.hi = Math.round(pr.ovr + R(0.3,1)*n);
  pr.plo = Math.round(pr.pot - R(0.3,1)*n*1.5); pr.phi = Math.round(pr.pot + R(0.3,1)*n*1.5);
}
function genProspect(kind, school, tag){
  const hs = kind==='高校';
  const bonus = tag==='大会MVP'?4 : tag==='得点王'?3 : 1;
  const ovr = (hs ? R(25,41) : R(33,51)) + S.div*2.5 + bonus;
  const pot = ovr + (hs ? R(10,32) : R(3,16));
  const pos = tag==='得点王'?'FW' : tag==='守備の要'?pick(['DF','DF','GK']) : tag==='注目のドリブラー'?pick(['MF','FW']) : randPos();
  const pr = {id:uid(), name:genName(false), pos, age:hs?18:22, kind, school, grade:hs?'3年':'4年', tag, ovr, pot,
              seen:0, status:'none', hot: pot>60 && Math.random()<0.6};
  setEstimate(pr, noiseLevel());
  return pr;
}
function runAmaEvent(e){
  const pool = e.kind==='高校' ? SCHOOLS : UNIS;
  const a = pick(pool); let b; do{ b=pick(pool); }while(b===a);
  let text;
  if(e.type==='final'){ const ga=RI(1,4), gb=RI(0,ga-1); text = `${e.name}決勝は${a}が${ga}-${gb}で${b}を下し優勝。`; }
  else if(e.type==='national'){ text = `${e.name}で石川県代表の${a}がベスト${pick([16,8,8,4])}に進出！`; }
  else { text = `${e.name}は${a}が首位で折り返し。${b}が追う展開。`; }
  const n = RI(2,3), picked = [];
  const tags = [...AMA_TAGS].sort(()=>Math.random()-0.5);
  for(let i=0;i<n;i++){ const pr = genProspect(e.kind, i===0?a:i===1?b:pick(pool), tags[i]); S.prospects.push(pr); picked.push(pr); }
  addNews(`【アマチュア】${text}`);
  S.inbox.push(mkRep('ama', scFrom(), `${e.name}で活躍した選手をリストアップしました`,
    `${text}\n${picked.map(p=>`・${p.name}（${p.school} ${p.grade}・${p.pos}）— ${p.tag}${p.hot?'【他クラブも注目】':''}`).join('\n')}\n視察で実力を見極めてからオファーしましょう。`,
    [['view','スカウトリストを見る'],['ok','了解']]));
}
function interest(pr){
  const v = 52 + S.div*11 - Math.max(0,pr.pot-50)*1.1 + 15 + Math.min(10,S.fans/1500) + pr.seen*8 - (pr.hot?15:0);
  return clamp(Math.round(v),5,95);
}
function prospectFee(pr){ return Math.round((200 + Math.max(0,(pr.plo+pr.phi)/2-40)*25) * Math.sqrt(DIV_MULT[S.div])); }
function watchCost(){ return Math.round(5*Math.sqrt(DIV_MULT[S.div])); }
function watchPerWeek(){ return 1 + (staffAb('scout')>=50?1:0) + (S.fac.scout>=3?1:0); }
function watchProspect(id){
  const pr = S.prospects.find(x=>x.id===id); if(!pr) return;
  if(S.watchLeft<=0) return toast('今週の視察枠を使い切りました。');
  if(S.money<watchCost()) return toast('資金が足りません。');
  spend(watchCost()); S.watchLeft--; pr.seen++;
  setEstimate(pr, noiseLevel()/Math.pow(2,pr.seen));
  addNews(`${pr.school}の${pr.name}を視察。${pr.seen>=2?'実力がかなり見えてきた。':'評価を更新した。'}`);
  save(); render();
}
function offerProspect(id){
  const pr = S.prospects.find(x=>x.id===id); if(!pr||pr.status!=='none') return;
  const fee = prospectFee(pr);
  if(S.money<fee) return toast('資金が足りません。');
  if(pr.kind==='大学' && S.players.length>=26) return toast('選手登録は26人までです。');
  const chance = interest(pr);
  confirmBox(`${pr.name}（${pr.school}）に正式オファーを出しますか？ 支度金 ${yen(fee)}（入団時のみ）・入団の見込み 約${chance}%`, ()=>{
    if(Math.random()*100 < chance){
      spend(fee); pr.status='signed';
      if(pr.kind==='大学'){
        const p = makePlayer(pr.pos, pr.ovr, pr.age, pr.pot); p.name=pr.name; p.from=pr.school; p.salary=Math.round(p.salary*0.8); p.mor=75;
        S.players.push(p);
        addNews(`🎓 ${pr.school}の${pr.name}が来季加入内定！特別指定選手として今季からチームに合流。`);
      } else addNews(`🎓 ${pr.school}の${pr.name}が来季の加入に内定！「地元のクラブでプロになれて嬉しい」`);
      save(); render(); toast(`${pr.name}が入団を決断しました！`);
    } else {
      pr.status='declined';
      addNews(`${pr.name}（${pr.school}）はオファーを断り、${pr.kind==='高校'?pick(['大学進学','J1クラブ入り','J2クラブ入り']):pick(['J1クラブ入り','J2クラブ入り'])}を選んだ。`);
      save(); render(); toast(`${pr.name}に断られました…`);
    }
  });
}
function prospectsSeasonEnd(lines){
  const joined = [];
  for(const pr of S.prospects){
    if(pr.status==='signed' && pr.kind==='高校'){
      const p = makePlayer(pr.pos, pr.ovr, 18, pr.pot); p.name=pr.name; p.from=pr.school; p.mor=75; p.salary=Math.round(p.salary*0.8);
      S.players.push(p); joined.push(`${p.name}（${pr.school}・${p.pos}）`);
    }
  }
  const missed = S.prospects.filter(p=>p.status==='none' && p.pot>=60);
  if(missed.length) lines.push(`獲得を見送った ${missed.slice(0,2).map(p=>p.name).join('、')} らは他クラブへ進んだ。`);
  S.prospects = [];
  return joined;
}

const TIERS = {low:{name:'控えめ', mult:0.7, adj:0.2}, mid:{name:'標準', mult:1, adj:0}, high:{name:'強気', mult:1.4, adj:-0.25}};
function initCompanies(){ return COMPANIES.map(c=>({...c, rel:RI(5,20)+(c.size===1?15:0), contract:null, cool:0, invested:false})); }
function slotFree(slot){ if(slot==='naming' && S.fac.stadium<2) return false; return S.companies.filter(c=>c.contract&&c.contract.slot===slot).length < SLOTS[slot].max; }
function dealAmount(c, slot, tier){ return Math.round(SIZE_BASE[c.size] * (1+S.div*0.4) * (0.8 + Math.min(S.fans,30000)/30000*0.6) * SLOTS[slot].mult * TIERS[tier].mult); }
function dealChance(c, slot, tier){ return clamp(0.15 + (c.rel-35)/70 + TIERS[tier].adj + S.div*0.04 - (c.size-1)*0.08 - SLOTS[slot].mult*0.1, 0.03, 0.95); }
function companyLocked(c){ if(c.size===3 && S.div<1) return 'JFL以上で交渉可能'; if(c.size===2 && S.fans<1200 && S.div<1) return 'ファン1,200人以上で交渉可能'; return null; }
function salesPower(){ const t=salesTeam(); return t.length ? t.reduce((a,s)=>a+s.abil,0)/t.length : 0; }
function visitCompany(i){
  const c = S.companies[i]; if(!c) return;
  if(S.visitsLeft<=0) return toast(salesTeam().length?'今週の訪問枠を使い切りました（営業担当1人につき週1社）。':'営業担当がいません。スタッフタブで採用しましょう。');
  if(companyLocked(c)) return toast(`${c.name}：${companyLocked(c)}`);
  S.visitsLeft--;
  const g = (5 + salesPower()/9 + R(0,5)) * (1 - c.rel/130);
  c.rel = clamp(c.rel + g, 0, 100);
  const st = pick(salesTeam());
  const flavor = Math.random()<0.15 ? (c.rel=clamp(c.rel+8,0,100), '社長が実は昔からのサポーターだった！話が大いに弾んだ。') : pick(['担当者は前向きに話を聞いてくれた。','試合のチケットを手渡し、観戦に招待した。','地域貢献活動の資料を説明した。','先方の工場を見学させてもらった。','次は役員に会わせてもらえることになった。']);
  addNews(`営業：${st.name}が${c.name}を訪問。${flavor}`);
  save(); render();
}
function proposeDeal(i, tier){
  const c = S.companies[i]; if(!c||c.contract) return;
  const slot = (ui.slotSel||{})[i] || firstFreeSlot();
  if(!slot || !slotFree(slot)) return toast('その枠は埋まっています。');
  if(c.cool>0) return toast(`${c.name}とは前回の交渉から日が浅いです（あと${c.cool}週）。`);
  if(companyLocked(c)) return toast(`${c.name}：${companyLocked(c)}`);
  const amt = dealAmount(c,slot,tier), ch = dealChance(c,slot,tier);
  if(Math.random()<ch){
    c.contract = {slot, amount:amt, years:RI(1,3)}; c.rel = clamp(c.rel+5,0,100);
    if(slot==='chest'||slot==='naming') S.trust = clamp(S.trust+3,0,100);
    addNews(`💼 ${c.name}と${SLOTS[slot].name}スポンサー契約を締結！ 年${yen(amt)}・${c.contract.years}年契約。`);
    save(); render(); toast(`${c.name}との契約が成立！ 年${yen(amt)}`);
  } else {
    c.rel = clamp(c.rel-8,0,100); c.cool = 2;
    addNews(`${c.name}への${SLOTS[slot].name}スポンサー提案は見送られた。`);
    save(); render(); toast(`${c.name}：「今回は見送らせてください」`);
  }
}
function firstFreeSlot(){ return Object.keys(SLOTS).find(slotFree); }
function investAmount(){ return Math.round(10000*(1+S.div*0.4)); }
function askInvest(i){
  const c = S.companies[i]; if(!c||c.size<3||c.invested||c.rel<75) return;
  c.invested = true;
  if(Math.random() < c.rel/115){
    const v = Math.round(investAmount()*R(0.8,1.3)); earn(v); S.trust=clamp(S.trust+5,0,100);
    addNews(`🏦 ${c.name}がクラブへの出資（第三者割当増資）を決定！ ${yen(v)}を調達。`);
    save(); render(); toast(`${c.name}から${yen(v)}の出資を受けました！`);
  } else { c.rel=clamp(c.rel-10,0,100); addNews(`${c.name}への出資依頼は取締役会で否決された。`); save(); render(); toast('出資は見送られました。'); }
}
function crowdfund(){
  if(S.cfSeason===S.season) return;
  S.cfSeason = S.season;
  const v = Math.round(S.fans*R(0.4,1) + R(200,800)); earn(v);
  const d = changeFans(0.02,10);
  addNews(`📣 クラウドファンディング「金沢から日本一へ」が終了。${yen(v)}が集まった。ファン +${d}人`);
  save(); render(); toast(`クラウドファンディングで${yen(v)}が集まりました！`);
}
function contractIncome(){ return S.companies.reduce((a,c)=>a+(c.contract?c.contract.amount:0),0); }
function companiesSeasonEnd(rank, lines){
  for(const c of S.companies){
    if(c.cool) c.cool = 0;
    if(!c.contract){ c.rel = clamp(c.rel-3,0,100); continue; }
    c.contract.years--;
    if(c.contract.years>0) continue;
    if(c.rel>=45){
      const m = rank<=3?1.15 : rank>=8?0.85 : 1;
      c.contract.amount = Math.round(c.contract.amount*m*(1+(S.div>=1?0.1:0))); c.contract.years = RI(1,2);
      lines.push(`${c.name}が${SLOTS[c.contract.slot].name}スポンサー契約を更新（年${yen(c.contract.amount)}）。`);
    } else { lines.push(`${c.name}との${SLOTS[c.contract.slot].name}契約が満了し、更新されなかった。`); c.contract=null; }
  }
}

function migrate(s){
  if(!s.v || s.v<2){ // 旧版は金額が実際の約1/10だったので補正
    const k=10; s.money*=k; s.sponsor*=k; s.players.forEach(p=>p.salary*=k); s.market.forEach(p=>{p.salary*=k; if(p.fee) p.fee*=k;});
    if(s.staff){ Object.values(s.staff).flat().filter(Boolean).forEach(x=>x.salary*=k); (s.staffMarket||[]).forEach(x=>x.salary*=k); }
    (s.companies||[]).forEach(c=>{ if(c.contract) c.contract.amount*=k; });
    s.v = 2;
  }
  if(!s.staff){
    S = s;
    s.staff = {manager:genStaff('manager',34), hc:genStaff('hc',32), physical:genStaff('physical',28), gk:genStaff('gk',28), youth:genStaff('youth',28), scout:genStaff('scout',28), sales:[genStaff('sales',32)]};
  }
  s.staffMarket ??= []; s.inbox ??= []; s.prospects ??= []; s.companies ??= initCompanies();
  s.visitsLeft ??= 1; s.watchLeft ??= 1; s.mentor ??= 0; s.cfSeason ??= 0;
  s.players.forEach(p=>{ p.mor ??= 60; });
  if(!s.staffMarket.length){ S = s; refreshStaffMarket(); }
  return s;
}

function companyCard(c,i){
  const lock = companyLocked(c);
  let body = '';
  if(c.contract){
    body = `<div class="warn" style="margin-top:8px">${SLOTS[c.contract.slot].name}スポンサー：年${yen(c.contract.amount)}・残り${c.contract.years}年</div>`;
  } else if(lock){
    body = `<p class="small muted" style="margin:8px 0 0">🔒 ${lock}</p>`;
  } else {
    const free = Object.keys(SLOTS).filter(slotFree);
    const sel = (ui.slotSel||{})[i] && slotFree(ui.slotSel[i]) ? ui.slotSel[i] : free[0];
    body = free.length ? `<div style="margin-top:8px"><label class="small muted" for="slot${i}">提案する枠</label>
      <select id="slot${i}" data-ch="slot" data-arg="${i}" style="width:100%;margin:4px 0 6px">${free.map(k=>`<option value="${k}" ${k===sel?'selected':''}>${SLOTS[k].name}</option>`).join('')}</select>

      ${c.cool>0?`<p class="small muted" style="margin:6px 0 0">前回の提案から間がないため、あと${c.cool}週は提案できません。</p>`:''}</div>`
      : '<p class="small muted">空いているスポンサー枠がありません。</p>';
  }
  return `<div class="card" data-id="co${i}">
    <div style="display:flex;justify-content:space-between;gap:6px"><b>${esc(c.name)}</b><span class="tag">${esc(c.ind)}</span></div>
    <div class="small muted" style="margin:6px 0 2px">関係 ${Math.round(c.rel)}</div>

    </div>
  </div>`;
}

let playTimer = null;
function openModal(html){ $mbox.innerHTML = html; $modal.classList.remove('hidden'); }
function closeModal(){ $modal.classList.add('hidden'); if(playTimer){clearInterval(playTimer);playTimer=null;} }
function toast(msg){ openModal(`<p>${esc(msg)}</p><div class="row"><button class="btn primary" data-act="close">OK</button></div>`); }
let confirmCb = null;
function confirmBox(msg, cb){ confirmCb = cb; openModal(`<p>${esc(msg)}</p><div class="row"><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="confirm">はい</button></div>`); }

function showMatch(m, fin, d){
  const homeName = m.home ? S.club : m.opp.name, awayName = m.home ? m.opp.name : S.club;
  openModal(`
    <div class="small muted" style="text-align:center">${DIVS[S.div].name} 第${S.round}節・${m.home?'ホーム':'アウェイ'}</div>
    <div class="score"><div class="t">${esc(homeName)}</div><div class="n" id="sc">0 - 0</div><div class="t">${esc(awayName)}</div></div>
    <div class="clock" id="clk">キックオフ</div>
    <ul class="log" id="log"></ul>
    <div id="after"></div>
    <div class="row" id="mrow"><button class="btn" data-act="skip">スキップ</button></div>`);
  let min = 0, hs=0, as=0; const evs=[...m.events];
  const $log = document.getElementById('log'), $sc=document.getElementById('sc'), $clk=document.getElementById('clk');
  const step = ()=>{
    min++;
    while(evs.length && evs[0].m<=min){
      const e = evs.shift();
      if(!e.flavor && !e.inj){ if(e.us===m.home) hs++; else as++; }
      const cls = e.flavor||e.inj?'':(e.us?'goal us':'goal them');
      $log.insertAdjacentHTML('beforeend', `<li class="${cls}"><span class="m">${e.m}'</span>${esc(e.text||e.flavor)}</li>`);
      $sc.textContent = `${hs} - ${as}`;
      $log.scrollTop = $log.scrollHeight;
    }
    $clk.textContent = min>=90 ? '試合終了' : `${min}分`;
    if(min>=90){ clearInterval(playTimer); playTimer=null; finish(); }
  };
  const finish = ()=>{
    const word = {W:'勝利！',D:'引き分け',L:'敗戦…'}[m.res];
    const sign = v=>`<span class="${v>=0?'plus':'minus'}">${v>=0?'+':''}${typeof v==='number'&&Math.abs(v)>=1?v.toLocaleString():v}</span>`;
    document.getElementById('after').innerHTML = `
      <h2 style="text-align:center;color:var(--${m.res==='W'?'win':m.res==='L'?'loss':'draw'})">${word}</h2>
      <div class="kv">
        ${m.home?`<span>観客数</span><span class="v">${fin.att.toLocaleString()}人</span><span>チケット収入</span><span class="v">${yen(fin.ticket)}</span>`:''}
        <span>スポンサー</span><span class="v">${yen(fin.sponsor)}</span>
        <span>年俸・維持費</span><span class="v minus">-${yen(fin.salary+fin.upkeep)}</span>
        <span>資金の増減</span><span class="v">${d.dm>=0?'<span class="plus">+':'<span class="minus">'}${yen(d.dm)}</span></span>
        <span>ファン</span><span class="v">${sign(d.df)}人</span>
        <span>現在の順位</span><span class="v"><b>${myRank()}位</b></span>
      </div>
      ${d.ev?`<div class="warn">📰 ${esc(d.ev)}</div>`:''}
      ${S.over==='fired'?'<div class="warn">フロントの信頼が尽きました…</div>':''}`;
    document.getElementById('mrow').innerHTML = `<button class="btn primary" data-act="matchDone">続ける</button>`;
  };
  ui.finishMatch = ()=>{ if(playTimer){clearInterval(playTimer);playTimer=null;} while(min<90) step(); };
  playTimer = setInterval(step, 35);
}

function showSeasonEnd(){
  const rep = endSeason();
  const head = rep.champion ? '🏆 J1優勝！ 金沢から日本一へ！' : rep.moved===1 ? `⬆ ${DIVS[rep.div+1].name}へ昇格！` : rep.moved===-1 ? `⬇ ${DIVS[rep.div-1].name}へ降格…` : `${DIVS[rep.div].name} 残留`;
  openModal(`
    <div class="small muted">${S.season-1}年目 シーズン総括</div>
    <h2>${head}</h2>
    <p>最終順位 <b>${rep.rank}位</b>（目標 ${rep.target}位以内）</p>
    <div class="kv">
      <span>賞金</span><span class="v plus">+${yen(rep.prize)}</span>
      <span>フロント信頼</span><span class="v ${rep.trust>=0?'plus':'minus'}">${rep.trust>=0?'+':''}${rep.trust}</span>
      <span>ファン</span><span class="v ${rep.fans>=0?'plus':'minus'}">${rep.fans>=0?'+':''}${rep.fans.toLocaleString()}人</span>
    </div>
    ${rep.lines.length?`<ul class="small" style="padding-left:18px">${rep.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
    ${rep.retired.length?`<p class="small"><b>引退：</b>${rep.retired.map(esc).join('、')}</p>`:''}
    <p class="small"><b>ユース昇格：</b>${rep.youth.map(esc).join('、')}</p>
    ${rep.joined.length?`<p class="small"><b>高校から入団：</b>${rep.joined.map(esc).join('、')}</p>`:''}
    <p class="small muted">新シーズンは${DIVS[S.div].name}。フロントの目標は${S.target}位以内。</p>
    ${S.over==='fired'?'<div class="warn">フロントの信頼が尽きました…</div>':''}
    <div class="row"><button class="btn primary" data-act="seasonDone">新シーズンへ</button></div>`);
}

function showGameOver(){
  const best = S.history.reduce((b,h)=>Math.max(b,h.div),S.div);
  openModal(`<h2>GM解任</h2>
    <p>フロントの信頼を失い、${esc(S.club)}のGMを解任されました。</p>
    <div class="kv"><span>在任</span><span class="v">${S.season}年目</span><span>最高到達リーグ</span><span class="v">${DIVS[best].name}</span><span>J1優勝</span><span class="v">${S.champion}回</span></div>
    <div class="row"><button class="btn primary" data-act="restart">タイトルへ</button></div>`);
  clearSave();
}

// ===================== イベント =====================
const ACTIONS = {
  start(){ const n = (document.getElementById('clubName')?.value||'').trim().slice(0,16); newGame(n); ui.tab='home'; render(); },
  continue(){ S = migrate(load()); ui.tab='home'; render(); },
  tab(a){ ui.tab=a; render(); },
  advance(){ advance(); },
  skip(){ ui.finishMatch && ui.finishMatch(); },
  matchDone(){ closeModal(); render(); if(S.over) showGameOver(); else if(S.round>=ROUNDS) showSeasonEnd(); },
  season(){ showSeasonEnd(); },
  seasonDone(){ closeModal(); render(); if(S.over) showGameOver(); },
  set(a){ const [k,v]=a.split(':'); S[k]=v; save(); render(); },
  sign(a){ signPlayer(a); },
  sell(a){ sellPlayer(a); },
  rest(a){ const p=S.players.find(x=>x.id===a); if(p){p.rest=!p.rest; ui.flash=a; save(); render();} },
  upgrade(a){ upgrade(a); },
  close(){ closeModal(); },
  resolve(a){ const [id,k]=a.split('|'); const msg=resolveReport(id,k); save(); render(); if(msg) toast(msg); },
  sub(a){ ui.sub=a; render(); },
  staffRole(a){ ui.staffRole=a; ui.staffSub='hire'; ui.tab='staff'; render(); },
  staffSub(a){ ui.staffSub=a; render(); },
  hire(a){ hireStaff(a); },
  fireStaff(a){ fireStaff(a); },
  watch(a){ ui.flash=a; watchProspect(a); },
  offer(a){ offerProspect(a); },
  visit(a){ ui.flash='co'+a; visitCompany(+a); },
  propose(a){ const [i,t]=a.split('|'); ui.flash='co'+i; proposeDeal(+i,t); },
  invest(a){ askInvest(+a); },
  crowdfund(){ crowdfund(); },
  confirm(){ closeModal(); const cb=confirmCb; confirmCb=null; cb&&cb(); },
  restart(){ closeModal(); S=null; render(); },
};
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-ch]'); if(!el) return;
  if(el.dataset.ch==='slot'){ ui.slotSel = ui.slotSel||{}; ui.slotSel[el.dataset.arg]=el.value; ui.flash='co'+el.dataset.arg; render(); }
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.tagName==='A') e.preventDefault();
  const f = ACTIONS[el.dataset.act]; if(f) f(el.dataset.arg, el);
});
render();
</script>
</body>
</html>
