// ===================== ポストシーズン（地域CL・入れ替え戦・昇格プレーオフ） =====================
function lamN(att, def, f){ return clamp(1.25*Math.exp((att-def)/13)*f, 0.12, 4.8); }
// 自クラブの一発勝負。where: 'home' | 'away' | 'neutral'
function quickMatch(opp, where){
  const rt = teamRating(getLineup(true));
  const fu = where==='home'?1.12:where==='away'?0.9:1, fo = where==='home'?0.9:where==='away'?1.12:1;
  return {gu: poisson(lamN(rt.att, opp.def+R(-3,3), fu)), go: poisson(lamN(opp.att+R(-3,3), rt.def, fo))};
}
function fakeOpp(name, str){ return {name, str, att:str+R(-3,3), def:str+R(-3,3)}; }
function postMatch(post, label, opp, where, tieRule){
  const m = quickMatch(opp, where);
  let win = m.gu>m.go, note = '';
  if(m.gu===m.go){
    if(tieRule==='higher'){ win = where==='home'; note = win ? '（引き分けは上位のため勝ち抜け）' : '（引き分けは相手が上位のため敗退）'; }
    else if(tieRule==='pk'){ win = Math.random()<0.5; note = `（PK戦 ${win?'勝利':'敗戦'}）`; }
  }
  post.push({label, opp:opp.name, where, gu:m.gu, go:m.go, res: m.gu>m.go?'W':m.gu<m.go?'L':'D', win, note});
  return {win, ...m};
}
// 総当たりのミニリーグ（地域CL）
function miniLeague(post, label, opps){
  const tbl = [{name:S.club, me:true, pts:0, gd:0}, ...opps.map(o=>({name:o.name, o, pts:0, gd:0}))];
  for(const o of tbl.slice(1)){
    const r = postMatch(post, label, o.o, 'neutral', null);
    tbl[0].pts += r.gu>r.go?3:r.gu===r.go?1:0; tbl[0].gd += r.gu-r.go;
    o.pts += r.go>r.gu?3:r.gu===r.go?1:0; o.gd += r.go-r.gu;
  }
  // 相手同士の対戦
  for(let i=1;i<tbl.length;i++) for(let j=i+1;j<tbl.length;j++){
    const a=tbl[i].o, b=tbl[j].o;
    const ga = poisson(lamN(a.att, b.def, 1)), gb = poisson(lamN(b.att, a.def, 1));
    tbl[i].pts += ga>gb?3:ga===gb?1:0; tbl[j].pts += gb>ga?3:ga===gb?1:0; tbl[i].gd += ga-gb; tbl[j].gd += gb-ga;
  }
  tbl.sort((x,y)=>y.pts-x.pts||y.gd-x.gd);
  return tbl.findIndex(t=>t.me)+1;
}
const REGIONS_JP = ['北海道','東北','関東','東海','関西','中国','四国','九州'];
function regionalChamp(){ const s = DIVS[1].base[1] + R(-8,1); return fakeOpp(`${pick(REGIONS_JP)}代表 ${pick(CITY_NATION)} ${pick(SUFFIX)}`, s); }
// 昇格・降格の判定。戻り値：moved（+1昇格 / -1降格 / 0残留）
function postseason(st, rank, report){
  const d = S.div, n = st.length, post = report.post, L = report.lines;
  const issues = licenseIssues(), licOK = d<TOP && issues.length===0;
  const noLic = ()=>L.push(`昇格の権利を得ましたが、${DIVS[d+1].name}のクラブライセンス基準（${issues.join('・')}）を満たさず昇格できませんでした…`);
  const seed = k => { const t = st[k-1]; return fakeOpp(t.name, t.str); };
  if(d===0){ // 北信越2部：1位自動昇格、2位は1部7位と入れ替え戦
    if(rank===1) return 1;
    if(rank===2){ const o = fakeOpp(`${pick(CITY_LOCAL)} ${pick(SUFFIX)}（1部7位）`, DIVS[1].base[0]+R(0,4)); return postMatch(post,'北信越リーグ入れ替え戦',o,'neutral','pk').win ? 1 : 0; }
    return 0;
  }
  if(d===1){ // 北信越1部：優勝→全国地域CL（上位2チームがJFLへ）。7位は入れ替え戦、8位は2部へ自動降格
    const zensha = rank===2 && Math.random()<0.35;
    if(rank===1 || zensha){
      if(zensha) L.push('全国社会人サッカー選手権で勝ち上がり、地域チャンピオンズリーグの出場権を獲得！');
      if(!licOK){ noLic(); return 0; }
      const g = miniLeague(post, '地域CL 1次ラウンド', [regionalChamp(), regionalChamp(), regionalChamp()]);
      if(g!==1){ L.push(`全国地域サッカーチャンピオンズリーグは1次ラウンド${g}位で敗退…`); return 0; }
      const f = miniLeague(post, '地域CL 決勝ラウンド', [regionalChamp(), regionalChamp(), regionalChamp()].map(o=>(o.att+=2,o.def+=2,o)));
      if(f<=2){ L.push(`全国地域サッカーチャンピオンズリーグ決勝ラウンド${f}位！ JFL昇格を決めた！`); return 1; }
      L.push(`地域CL決勝ラウンドは${f}位。あと一歩でJFL昇格を逃した…`); return 0;
    }
    if(rank===n) return -1;
    if(rank===n-1){ const o = fakeOpp(`${pick(CITY_LOCAL)} ${pick(SUFFIX)}（2部2位）`, DIVS[0].base[1]+R(-2,2)); return postMatch(post,'北信越リーグ入れ替え戦',o,'neutral','pk').win ? 0 : -1; }
    return 0;
  }
  if(d===2){ // JFL：1位はJ3へ自動昇格、2位はJ3の19位と入れ替え戦。15・16位は地域リーグへ
    if(rank<=2 && !licOK){ noLic(); }
    else if(rank===1) return 1;
    else if(rank===2){ const o = fakeOpp(`${pick(CITY_NATION)} ${pick(SUFFIX)}（J3 19位）`, DIVS[3].base[0]+R(0,3)); return postMatch(post,'J3・JFL入れ替え戦',o,'away','pk').win ? 1 : 0; }
    if(rank>=n-1) return -1;
    return 0;
  }
  if(d===3 || d===4){ // J3・J2：上位2チーム自動昇格、3〜6位で昇格プレーオフ
    const nm = d===3 ? 'J2昇格プレーオフ' : 'J1昇格プレーオフ';
    if(rank<=6 && !licOK){ noLic(); }
    else if(rank<=2) return 1;
    else if(rank<=6){
      const oppSeed = 9-rank; // 3位vs6位、4位vs5位
      const semi = postMatch(post, `${nm} 準決勝`, seed(oppSeed), rank<oppSeed?'home':'away', 'higher');
      if(!semi.win){ L.push(`${nm}は準決勝で敗退…`); return 0; }
      const otherSemi = rank===3||rank===6 ? [4,5] : [3,6]; // 反対側の山の勝者（上位シードがやや有利）
      const fin = otherSemi[Math.random()<0.55?0:1];
      const r = postMatch(post, `${nm} 決勝`, seed(fin), rank<fin?'home':'away', 'higher');
      if(r.win){ L.push(`${nm}を制して昇格！`); return 1; }
      L.push(`${nm}は決勝で敗れ、昇格を逃した…`); return 0;
    }
    if(d===3){ // J3：20位はJFLへ、19位はJFL2位と入れ替え戦
      if(rank===n) return -1;
      if(rank===n-1){ const o = fakeOpp(`${pick(CITY_NATION)}${pick(['製鉄','電機','自動車'])} FC（JFL 2位）`, DIVS[2].base[1]+R(-3,1)); return postMatch(post,'J3・JFL入れ替え戦',o,'home','pk').win ? 0 : -1; }
    } else if(rank>=n-2) return -1; // J2：18〜20位はJ3へ
    return 0;
  }
  if(d===5){ if(rank>=n-2) return -1; return 0; } // J1：18〜20位はJ2へ
  return 0;
}

function zones(d, n){
  if(d===0) return {up:[1], ply:[2], dn:[]};
  if(d===1) return {up:[], ply:[1], swap:[n-1], dn:[n]};
  if(d===2) return {up:[1], swap:[2], dn:[n-1,n]};
  if(d===3) return {up:[1,2], ply:[3,4,5,6], swap:[n-1], dn:[n]};
  if(d===4) return {up:[1,2], ply:[3,4,5,6], dn:[n-2,n-1,n]};
  return {up:[1], dn:[n-2,n-1,n]};
}

function migrate(s){
  if(!s.v || s.v<2){ // 旧版は金額が実際の約1/10だったので補正
    const k=10; s.money*=k; s.sponsor*=k; s.players.forEach(p=>p.salary*=k); s.market.forEach(p=>{p.salary*=k; if(p.fee) p.fee*=k;});
    if(s.staff){ Object.values(s.staff).flat().filter(Boolean).forEach(x=>x.salary*=k); (s.staffMarket||[]).forEach(x=>x.salary*=k); }
    (s.companies||[]).forEach(c=>{ if(c.contract) c.contract.amount*=k; });
    s.v = 2;
  }
  if(!s.staff){
    S = s;
    s.staff = {manager:genStaff('manager',34), hc:genStaff('hc',32), physical:genStaff('physical',28), gk:genStaff('gk',28), youth:genStaff('youth',28), scout:genStaff('scout',28), sales:[genStaff('sales',32)]};
  }
  if(s.v<4){ // 北信越リーグ2部を追加したので、リーグの番号を1つずらす
    if(s.v>=1 || s.v===undefined){ s.div += 1; (s.history||[]).forEach(h=>h.div+=1); }
    s.evFired = s.evFired || [];
  }
  if(s.v<3){ // 年俸の計算式を見直したので、プロ選手の年俸を新しい相場に合わせる
    s.players.forEach(p=>{ if(p.amateur) p.proSalary = calcSalary(p.ovr); else p.salary = Math.round(calcSalary(p.ovr)*(p.loanFrom?0.5:1)); });
    s.market.forEach(p=>{ p.salary = calcSalary(p.ovr); if(p.fee && !p.free) p.fee = p.loanFrom ? Math.round(playerValue(p)*0.08) : playerValue(p); });
    s.v = 3;
  }
  s.v = Math.max(s.v||0, 4);
  s.staffMarket ??= []; s.foreignCands ??= []; s.fscoutTrip ??= null; s.inbox ??= []; s.prospects ??= []; s.companies ??= initCompanies();
  s.visitsLeft ??= 1; s.watchLeft ??= 1; s.mentor ??= 0; s.cfSeason ??= 0;
  s.players.forEach(p=>{ if(!p.role) p.role = pickRole(p.pos); });
  (s.market||[]).forEach(p=>{ if(!p.role) p.role = pickRole(p.pos); });
  (s.foreignCands||[]).forEach(p=>{ if(!p.role) p.role = pickRole(p.pos); });
  (s.prospects||[]).forEach(p=>{ if(!p.role) p.role = pickRole(p.pos); });
  s.players.forEach(p=>{ if(p.inj>0 && !p.injury) p.injury = {id:'bruise', name:'負傷', short:'負傷', part:'', total:p.inj}; p.mor ??= 60; if(p.contract===undefined && !p.amateur && !p.loanFrom) p.contract = RI(1,3); });
  if(!s.staffMarket.length){ S = s; refreshStaffMarket(); }
  return s;
}

        <li>地元の高校・大学の大会で活躍した選手をスカウトし、営業で地元企業からスポンサーを集める。</li>
        <li>上位2チームが昇格。ただしスタジアムやS級監督などのクラブライセンス基準あり。</li>
        <li>若手を育てて売る、施設に投資する、ファンを増やして収入を伸ばす。</li>
        <li>フロントの信頼が0になると解任。資金のマイナスにも注意。</li>
      </ul>
    </div>
  </div></div>`;
  document.getElementById('footer')?.remove();
}

function render(){
  if(!S){ renderTitle(); return; }
  const nm = nextMatch();
  const ni = S.inbox.length;
  normalizeNav();
  const G = groupOf(ui.tab);
  if(G && !G.views.some(v=>v[0]===ui.view)) ui.view = G.views[0][0];
  let body='';
  if(G) body = viewTabs(G) + renderView(ui.view);
  else switch(ui.tab){
    case 'squad': body=renderSquad(); break;
    case 'tactics': body=renderTactics(); break;
    case 'inbox': body=renderInbox(); break;
    case 'transfer': body=renderTransfer(); break;
    case 'staff': body=renderStaff(); break;
    case 'sales': body=renderSales(); break;
    case 'facility': body=renderFacility(); break;
    case 'league': body=renderLeague(); break;
    case 'cal': body=renderCalendar(); break;
    default: body=renderHome();
  }
  const opening = !!G && ui.prevTab!==ui.tab; ui.prevTab = ui.tab; // 開いた瞬間だけせり上がる
  const keep = {}; document.querySelectorAll('[data-keep]').forEach(el=>keep[el.dataset.keep]=[el.scrollTop,el.scrollLeft]);
  const wy = window.scrollY;
  $app.innerHTML = `
  <header class="top"><div class="top-inner">
    <div class="club-row">
      <span class="club-name"><span class="mark">◆</span> ${esc(S.club)}</span>
      <span class="meta">${S.season}年目・${DIVS[S.div].name}・${isOff()?`オフシーズン（${OFF_PLAN[S.offWeek].label}）`:S.round<nr()?`第${S.round+1}節（${month(S.round)}月）`:'シーズン終了'}</span>
    </div>
    <div class="stats">
      <span class="stat">資金 <b class="${S.money<0?'neg':''}">${yen(S.money)}</b></span>
      <span class="stat">ファン <b>${S.fans.toLocaleString()}</b>人</span>
      <span class="stat">順位 <b>${myRank()}</b>位</span>
      <span class="stat">フロント信頼 <b>${Math.round(S.trust)}</b><span class="trust"><i style="width:${S.trust}%"></i></span></span>
    </div>
  </div></header>
  <main class="main fill" data-keep="main-home"><div class="wrap">${renderHome()}</div></main>
  ${G ? `<div class="sheet-back ${opening?'enter':''}" data-act="tab" data-arg="home"></div>
  <section class="sheet ${opening?'enter':''}" role="dialog" aria-label="${G?.name||''}">
    <div class="sheet-head"><span class="sheet-title">${ICON(G?.ic)}<b>${G?.name||''}</b></span>
      <button class="sheet-x" data-act="tab" data-arg="home" aria-label="閉じてホームに戻る"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="main fill sheet-body" data-keep="sheet-${ui.tab}-${ui.view||''}"><div class="wrap">${body}</div></div>
  </section>` : ''}`;
  // 再描画してもリストのスクロール位置を保ち、操作した項目を光らせる
  document.querySelectorAll('[data-keep]').forEach(el=>{ const k=keep[el.dataset.keep]; if(k){ el.scrollTop=k[0]; el.scrollLeft=k[1]; } });
  window.scrollTo(0, wy);
  if(ui.flash){ const el=document.querySelector(`[data-id="${ui.flash}"]`); if(el){ el.classList.add('flash'); } ui.flash=null; }
  let f = document.getElementById('footer');
  if(!f){ f=document.createElement('div'); f.id='footer'; f.className='footer-bar'; document.body.appendChild(f); }
  f.innerHTML = `<div class="footer-inner">
    <div class="info">${ni?`<a href="#" data-act="tab" data-arg="inbox" style="color:var(--loss);font-weight:700">報告${ni}件</a>　`:''}${isOff() ? `オフ <b>${OFF_PLAN[S.offWeek].label}</b> ${esc(OFF_PLAN[S.offWeek].title)}` : nm ? `次節 <b>${nm.home?'ホーム':'アウェイ'}</b> vs <b>${esc(nm.opp.name)}</b>` : 'シーズン終了'}</div>
    ${isOff() ? `<button class="go" data-act="advance">${S.offWeek>=OFF_WEEKS-1?'開幕へ ▶':'次の週へ ▶'}</button>` : nm ? `<button class="go" data-act="advance">次の試合へ ▶</button>` : `<button class="go" data-act="season">シーズン総括へ ▶</button>`}
  </div>`;
}

function renderHome(){
  const nm = nextMatch(); const xi=getLineup(); const rt=teamRating(xi);
  const rank = myRank(); const st = standings();
  let match = '';
  if(nm){
    const oppO = (nm.opp.att+nm.opp.def)/2;
    const diff = rt.ovr - oppO;
    const word = diff>6?'格下':diff>2?'やや格下':diff>-2?'互角':diff>-6?'やや格上':'格上';
    match = `<div class="card matchcard" style="margin-top:12px"><h3>次の試合 — 第${S.round+1}節 ${nm.home?'ホーム（金沢）':'アウェイ'}</h3>
      <div class="vs"><div class="side"><div class="nm">${esc(S.club)}</div><div class="small muted">総合 ${rt.ovr.toFixed(1)}</div></div>
      <div class="x">VS</div>
      <div class="side"><div class="nm">${esc(nm.opp.name)}</div><div class="small muted">総合 ${oppO.toFixed(1)}・${standings().findIndex(t=>t.i===nm.oi)+1}位</div></div></div>
      <p class="small" style="text-align:center;margin:10px 0 0">相手は<b>${word}</b>。${TACTICS[S.tactic].name} / ${S.formation} / ${TRAINING[S.training].name}</p>
      ${licenseIssues().length?`<p class="small" style="text-align:center;margin:4px 0 0">${licenseChip()}</p>`:''}
    </div>`;
  } else if(isOff()){
    match = renderOffCard();
  } else {
    match = `<div class="card" style="margin-top:14px"><h3>シーズン終了</h3><p>全日程が終了しました。最終順位は <b>${rank}位</b>。下のボタンからシーズン総括へ進みましょう。</p></div>`;
  }
  const around = st.map((t,i)=>({t,i})).filter(({i})=>Math.abs(i-(rank-1))<=2 || i<2);
  const mini = `<table><tr><th>#</th><th>クラブ</th><th class="num">勝点</th><th class="num">得失</th></tr>
    ${around.map(({t,i})=>`<tr class="${t.isMe?'me':''}"><td>${i+1}</td><td>${esc(t.name)}</td><td class="num">${t.pts}</td><td class="num">${t.gd>0?'+':''}${t.gd}</td></tr>`).join('')}</table>`;
  const sal = S.players.reduce((a,p)=>a+p.salary,0);
  const repCard = S.inbox.length ? `<div class="reports" id="reports" style="grid-column:1/-1"><h3 class="grp">報告（${S.inbox.length}件）<span class="muted small">　返答しないまま2週進めると、いちばん下の選択肢で自動処理</span></h3><div class="grid g2" style="margin-top:0">${reportCards()}</div></div>` : '';
  return `${match}
  ${renderMenu()}
  <div class="card-scroll" data-keep="home" style="margin-top:10px"><div class="grid g2" style="margin-top:0">${repCard}
    <div class="card"><h3>クラブ状況</h3>
      <div class="kv">
        <span>フロントの目標</span><span class="v"><b>${S.target}位以内</b>（現在${rank}位）</span>
        <span>直近の結果</span><span class="v">${S.results.slice(-5).map(resBadge).join('')||'<span class="muted">—</span>'}</span>
        <span>攻撃力 / 守備力</span><span class="v">${rt.att.toFixed(1)} / ${rt.def.toFixed(1)}</span>
        <span>監督</span><span class="v">${S.staff.manager?`${esc(S.staff.manager.name)}（能力${S.staff.manager.abil}・${S.staff.manager.lic}）`:'<span class="minus">空席</span>'}</span>
        <span>負傷者</span><span class="v small">${(()=>{const l=S.players.filter(p=>p.inj>0); return l.length? l.map(p=>`${esc(p.name)}（${esc(p.injury?.short||'負傷')}・残り${p.inj}週）`).join('<br>') : '<span class="plus">なし</span>'; })()}</span>
        <span>チーム士気</span><span class="v">${(()=>{const a=S.players.filter(p=>!p.loan);const m=a.reduce((x,p)=>x+(p.mor??60),0)/a.length;return moraleFace(m)+' '+Math.round(m);})()}</span>
        <span>年俸総額（選手＋スタッフ）</span><span class="v">${yen(sal+staffSalary())}/年</span>
        <span>スポンサー収入</span><span class="v">${yen(S.sponsor+contractIncome())}/年</span>
        <span>今季の収支</span><span class="v ${S.fin.income-S.fin.expense>=0?'plus':'minus'}">${yen(S.fin.income-S.fin.expense)}</span>
        <span>J1優勝</span><span class="v">${S.champion}回</span>
      </div>
    </div>
    <div class="card"><h3>順位（抜粋）</h3>${mini}</div>
    <div class="card"><h3>ニュース</h3><ul class="news">${S.news.slice(0,10).map(n=>`<li><span class="r">${n.s}年目${n.r?` 第${n.r}節`:''}</span>${esc(n.t)}</li>`).join('')}</ul></div>
  </div></div>`;
}
function licenseChip(){
  const li = licenseIssues();
  return li.length ? `<span class="minus" title="${DIVS[S.div+1].name}への昇格条件">昇格条件 未達：${li.join('・')}</span>` : '';
}
function licenseWarn(){
  const li = licenseIssues();
  if(!li.length) return '';
  return `<div class="warn">${DIVS[S.div+1].name}への昇格には次の条件が必要です：${li.join('・')}。「施設」「スタッフ」で準備しましょう。</div>`;
}

function renderSquad(){
  const xi = getLineup(); const xiIds = new Set(xi.map(s=>s.p.id));
  const order = {GK:0,DF:1,MF:2,FW:3};
  const ps = [...S.players].sort((a,b)=>order[a.pos]-order[b.pos]||b.ovr-a.ovr);
  const sal = S.players.reduce((a,p)=>a+p.salary,0);
  return `<div class="card grow" style="margin-top:14px"><h3>選手一覧（${S.players.length}人・年俸計 ${yen(sal)}）</h3>
  <details class="small muted" style="margin:-4px 0 8px"><summary>説明</summary>スタメンは監督がフォーメーションに合わせて能力・コンディション・士気から選びます。「休ませる」でスタメンから外せます。出番のない実力者は士気が下がります。<br>行を押すと選手の詳細が開き、能力・契約・状態の確認や、休養・移籍リスト登録・契約解除・契約更新ができます。状態＝調子のバーと士気の点（緑：好調、青：普通、橙：低め、赤：不満）。<br>印：地元＝石川の高校・大学出身、2種＝2種登録、特指＝特別指定選手、約束＝先発を約束済み、貸出中＝他クラブへ期限付き移籍中、放出候補＝移籍リストに登録中</details>
  <div class="scroll list-scroll" data-keep="squad"><table class="sticky">
    <thead><tr><th>Pos</th><th>名前</th><th class="num">年齢</th><th class="num">能力</th><th>状態</th><th class="num">契約</th></tr></thead><tbody>
    ${ps.map(p=>`<tr data-id="${p.id}" data-act="player" data-arg="${p.id}" class="prow">
      <td>${posTag(p.pos)}<div class="rshort">${esc(roleShort(p))}</div></td>
      <td class="pcell"><div class="pname">${esc(p.name)}</div><div class="ptags">${xiIds.has(p.id)?'<span class="tag xi">先発</span>':''}${p.inj?`<span class="tag inj" title="${esc(injLabel(p))}">${esc(p.injury?.short||'負傷')}${p.inj}週${p.playHurt?'・強行':''}</span>`:''}${p.rust>0&&!p.inj?'<span class="tag rest">復帰明け</span>':''}${p.rest?'<span class="tag rest">休養</span>':''}${p.promise?'<span class="tag">約束</span>':''}${p.loan?'<span class="tag rest">貸出中</span>':''}${p.loanFrom?`<span class="tag" title="${esc(p.loanFrom)}から期限付き移籍">レンタル</span>`:''}${p.amateur?`<span class="tag xi">${p.amateur==='2種登録'?'2種':'特指'}</span>`:''}${p.from?`<span class="tag" title="${esc(p.from)}出身">地元</span>`:''}${p.listed?'<span class="tag inj">放出候補</span>':''}</div></td>
      <td class="num">${p.age}</td>
      <td class="num"><span class="ovr">${round1(p.ovr)}</span><div class="pstars">${stars(p)}</div></td>
      <td class="pstate"><div class="bar ${p.cond>70?'':'gold'}" title="調子 ${Math.round(p.cond)}"><i style="width:${p.cond}%"></i></div><span title="士気 ${Math.round(p.mor??60)}">${moraleFace(p.mor??60)}</span></td>
      <td class="num small">${p.loanFrom||p.amateur?'—':p.expiring?'<span class="minus">満了</span>':`${p.contract??'-'}年`}</td>
    </tr>`).join('')}
  </tbody></table></div></div>`;
}

function optGroup(key, defs, cur, extra){

}

    <span><b>${S.formation}</b>・${TACTICS[S.tactic].name}${m&&m.style===S.tactic?' <span class="plus">✓得意</span>':''}</span>

  </div>
  <div class="infobar" style="margin-top:0">${(()=>{ const re=rt.roles; return `<span>役割の噛み合い <b>${re.fit}</b>/11人</span><span class="${re.keyOk?'plus':'minus'}">${re.keyOk?'✓':'✗'} ${re.key.label}</span><details><summary>役割とは</summary>選手にはポジションごとに役割（アンカー、司令塔、ポストプレーヤーなど）があります。今の戦術に合う役割の選手が多いほど、また陣形に欲しい役割の選手がいるとボーナスが付きます。役割は選手の詳細から変えられます。<br>スタメンの役割：${getLineup().filter(s=>!s.p.ghost).map(s=>`${esc(s.p.name)}（${esc(roleShort(s.p))}）`).join('、')}</details>`; })()}</div>
  <div class="card-scroll" data-keep="tactics"><div class="grid g2" style="margin-top:0">

</div>

    <div class="card"><h3>チケット価格（ホーム）</h3>${optGroup('ticket', TICKET, S.ticket, (k,d)=>`${Math.round(DIVS[S.div].ticket*d.price)}円・集客×${d.demand}`)}
      <p class="small muted" style="margin-bottom:0">スタジアム収容 ${CAP[S.fac.stadium-1].toLocaleString()}人</p></div>
    <div class="card" style="grid-column:1/-1"><h3>今週の広報活動（金沢の街で）</h3>${optGroup('pr', PR, S.pr, (k,d)=>`${d.cost?yen(d.cost):'無料'}・${d.desc}`)}

  const xi = getLineup(true);

      <span>登録 <b>${S.players.length}</b>/26</span><span>外国籍 <b>${foreignCount()}</b>/${FOREIGN_MAX}</span><span>資金 <b>${yen(S.money)}</b></span>
      <details><summary>説明</summary>毎週入れ替わります。フリー移籍（移籍金0円）や、上位クラブの若手のレンタル移籍も並びます。スカウト網Lv${S.fac.scout}${S.fac.scout<=1?'（伸びしろは不明。Lv2以上で見える）':''}。</details>

    <div class="card-scroll" data-keep="market"><div class="mk">${S.market.map(p=>{

function renderLeague(){
  const st = standings();
  const zn = zones(S.div, st.length);
  const zc = k => (zn.up||[]).includes(k) ? 'up' : (zn.ply||[]).includes(k) ? 'ply' : (zn.swap||[]).includes(k) ? 'swap' : (zn.dn||[]).includes(k) ? 'down' : '';

  if(c.contract){
    body = `<div class="warn" style="margin-top:8px">${SLOTS[c.contract.slot].name}スポンサー：年${yen(c.contract.amount)}・残り${c.contract.years}年</div>`;

    body = `<p class="small muted" style="margin:8px 0 0">${lock}</p>`;
  } else {
    const free = Object.keys(SLOTS).filter(slotFree);

    body = free.length ? `<div style="margin-top:8px"><label class="small muted" for="slot${i}">提案する枠</label>

let playTimer = null;
function openModal(html){ $mbox.innerHTML = html; $modal.classList.remove('hidden'); }

function showMatch(m, fin, d){
  const homeName = m.home ? S.club : m.opp.name, awayName = m.home ? m.opp.name : S.club;
  openModal(`
    <div class="small muted" style="text-align:center">${DIVS[S.div].name} 第${S.round}節・${m.home?'ホーム':'アウェイ'}</div>
    <div class="score"><div class="t">${esc(homeName)}</div><div class="n" id="sc">0 - 0</div><div class="t">${esc(awayName)}</div></div>
    <div class="clock" id="clk">キックオフ</div>
    <ul class="log" id="log"></ul>
    <div id="after"></div>
    <div class="row" id="mrow"><button class="btn" data-act="skip">スキップ</button></div>`);
  let min = 0, hs=0, as=0; const evs=[...m.events];
  const $log = document.getElementById('log'), $sc=document.getElementById('sc'), $clk=document.getElementById('clk');
  const step = ()=>{
    min++;
    while(evs.length && evs[0].m<=min){
      const e = evs.shift();
      if(!e.flavor && !e.inj){ if(e.us===m.home) hs++; else as++; }
      const cls = e.flavor||e.inj?'':(e.us?'goal us':'goal them');
      $log.insertAdjacentHTML('beforeend', `<li class="${cls}"><span class="m">${e.m}'</span>${esc(e.text||e.flavor)}</li>`);
      $sc.textContent = `${hs} - ${as}`;
      $log.scrollTop = $log.scrollHeight;
    }
    $clk.textContent = min>=90 ? '試合終了' : `${min}分`;
    if(min>=90){ clearInterval(playTimer); playTimer=null; finish(); }
  };
  const finish = ()=>{
    const word = {W:'勝利！',D:'引き分け',L:'敗戦…'}[m.res];
    const sign = v=>`<span class="${v>=0?'plus':'minus'}">${v>=0?'+':''}${typeof v==='number'&&Math.abs(v)>=1?v.toLocaleString():v}</span>`;
    document.getElementById('after').innerHTML = `
      <h2 style="text-align:center;color:var(--${m.res==='W'?'win':m.res==='L'?'loss':'draw'})">${word}</h2>
      <div class="kv">
        ${m.home?`<span>観客数</span><span class="v">${fin.att.toLocaleString()}人</span><span>チケット収入</span><span class="v">${yen(fin.ticket)}</span>`:''}
        <span>スポンサー</span><span class="v">${yen(fin.sponsor)}</span>
        <span>年俸・維持費</span><span class="v minus">-${yen(fin.salary+fin.upkeep)}</span>
        <span>資金の増減</span><span class="v">${d.dm>=0?'<span class="plus">+':'<span class="minus">'}${yen(d.dm)}</span></span>
        <span>ファン</span><span class="v">${sign(d.df)}人</span>
        <span>現在の順位</span><span class="v"><b>${myRank()}位</b></span>
      </div>
      ${d.ev?`<div class="warn">${esc(d.ev)}</div>`:''}
      ${S.over==='fired'?'<div class="warn">フロントの信頼が尽きました…</div>':''}`;
    document.getElementById('mrow').innerHTML = `<button class="btn primary" data-act="matchDone">続ける</button>`;
  };
  ui.finishMatch = ()=>{ if(playTimer){clearInterval(playTimer);playTimer=null;} while(min<90) step(); };
  playTimer = setInterval(step, 35);
}

      <span>ファン</span><span class="v ${rep.fans>=0?'plus':'minus'}">${rep.fans>=0?'+':''}${rep.fans.toLocaleString()}人</span>
    </div>
    ${rep.post&&rep.post.length?`<h3 class="pdh">ポストシーズン</h3><ul class="news">${rep.post.map(m=>`<li>${resBadge(m.res)} <b>${esc(m.label)}</b>　${m.where==='home'?'H':m.where==='away'?'A':'中立'} vs ${esc(m.opp)} ${m.gu}-${m.go}${esc(m.note||'')}</li>`).join('')}</ul>`:''}
    ${rep.lines.length?`<ul class="small" style="padding-left:18px">${rep.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}
    ${rep.retired.length?`<p class="small"><b>引退：</b>${rep.retired.map(esc).join('、')}</p>`:''}
    <p class="small"><b>ユース昇格：</b>${rep.youth.map(esc).join('、')}</p>
    ${rep.joined.length?`<p class="small"><b>高校から入団：</b>${rep.joined.map(esc).join('、')}</p>`:''}
    <p class="small muted">新シーズンは${DIVS[S.div].name}。開幕までの${OFF_WEEKS}週間はオフシーズン（契約更改・トライアウト・キャンプ）です。</p>
    ${S.over==='fired'?'<div class="warn">フロントの信頼が尽きました…</div>':''}
    <div class="row"><button class="btn primary" data-act="seasonDone">オフシーズンへ</button></div>`);
}

function showGameOver(){
  const best = S.history.reduce((b,h)=>Math.max(b,h.div),S.div);
  openModal(`<h2>GM解任</h2>
    <p>フロントの信頼を失い、${esc(S.club)}のGMを解任されました。</p>
    <div class="kv"><span>在任</span><span class="v">${S.season}年目</span><span>最高到達リーグ</span><span class="v">${DIVS[best].name}</span><span>J1優勝</span><span class="v">${S.champion}回</span></div>
    <div class="row"><button class="btn primary" data-act="restart">タイトルへ</button></div>`);
  clearSave();
}

// ===================== イベント =====================
const ACTIONS = {
  start(){ const n = (document.getElementById('clubName')?.value||'').trim().slice(0,16); newGame(n); ui.tab='home'; render(); },
  continue(){ S = migrate(load()); ui.tab='home'; render(); },
  group(a){ ui.tab=a; ui.view=null; render(); },
  view(a){ ui.view=a; render(); if(a==='cal'){ const box=document.querySelector('[data-keep="cal"]'), now=box&&box.querySelector('[data-now]'); if(box&&now) box.scrollTop = now.offsetTop - 60; } },
  tab(a){ ui.tab=a; if(a==='inbox'){ ui.tab='home'; render(); const r=document.getElementById('reports'); if(r) r.scrollIntoView({block:'start'}); return; } render(); if(a==='cal'){ const box=document.querySelector('[data-keep="cal"]'), now=box&&box.querySelector('[data-now]'); if(box&&now) box.scrollTop = now.offsetTop - 60; } },
  national(){ buyNational(); },
  advance(){ advance(); },
  skip(){ ui.finishMatch && ui.finishMatch(); },
  matchDone(){ closeModal(); render(); if(S.over) showGameOver(); else if(S.round>=nr()) showSeasonEnd(); },
  season(){ showSeasonEnd(); },
  seasonDone(){ closeModal(); render(); if(S.over) showGameOver(); },
  set(a){ const [k,v]=a.split(':'); S[k]=v; save(); render(); },
  sign(a){ signPlayer(a); },
  sell(a){ sellPlayer(a); },
  rest(a){ const p=S.players.find(x=>x.id===a); if(p){p.rest=!p.rest; ui.flash=a; save(); render(); if(ui.detail===a) showPlayer(a);} },
  upgrade(a){ upgrade(a); },
  close(){ closeModal(); },
  resolve(a){ const [id,k]=a.split('|'); const msg=resolveReport(id,k); save(); render(); if(msg) toast(msg); },
  sub(a){ ui.sub=a; render(); },
  staffRole(a){ ui.staffRole=a; ui.tab='gm'; ui.view='staffHire'; render(); },
  staffSub(a){ ui.staffSub=a; render(); },
  hire(a){ hireStaff(a); },
  fireStaff(a){ fireStaff(a); },
  watch(a){ ui.flash=a; watchProspect(a); },
  offer(a){ offerProspect(a); },
  visit(a){ ui.flash='co'+a; visitCompany(+a); },
  propose(a){ const [i,t]=a.split('|'); ui.flash='co'+i; proposeDeal(+i,t); },
  invest(a){ askInvest(+a); },
  crowdfund(){ crowdfund(); },
  buyout(a){ ui.flash=a; buyoutPlayer(a); },
  release(a){ releasePlayer(a); },
  list(a){ toggleList(a); },
  reg2(a){ ui.flash=a; register2(a); },
  player(a){ showPlayer(a); },
  role(a){ const [id,r]=a.split('|'); changeRole(id,r); },
  stopHurt(a){ const p=S.players.find(x=>x.id===a); if(p){ p.playHurt=false; save(); render(); showPlayer(a); } },
  renew(a){ const [id,y]=a.split('|'); renewContract(id,+y); },
  nego(a){ const [k,id]=a.split('|'); ui.flash=id; openNego(k,id); },
  negoSet(a){ const [k,v]=a.split('|'); if(ui.nego){ ui.nego.offer[k]=+v; renderNego(); } },
  negoSubmit(){ negoSubmit(); },
  negoCounter(){ const n=ui.nego; if(!n||!n.counter) return; const t=negoTerms(n); n.log.push({who:'me', t:'その条件でお願いします。'}); n.log.push({who:'them', t:'ありがとうございます！'}); negoFinish(n,t); },
  negoRetry(){ if(ui.nego){ ui.nego.counter=null; renderNego(); } },
  negoQuit(){ ui.nego=null; closeModal(); render(); },
  negoClose(){ ui.nego=null; closeModal(); render(); },
  dispatch(a){ dispatchScout(a); },
  signForeign(a){ signForeign(a); },
  dropForeign(a){ dropForeign(a); },
  confirm(){ closeModal(); const cb=confirmCb; confirmCb=null; cb&&cb(); },
  restart(){ closeModal(); S=null; render(); },
};
document.addEventListener('change', e=>{
  const el = e.target.closest('[data-ch]'); if(!el) return;
  if(el.dataset.ch==='slot'){ ui.slotSel = ui.slotSel||{}; ui.slotSel[el.dataset.arg]=el.value; ui.flash='co'+el.dataset.arg; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S && groupOf(ui.tab) && $modal.classList.contains('hidden')){ ui.tab='home'; render(); } });
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  if(el.tagName==='A') e.preventDefault();
  const f = ACTIONS[el.dataset.act]; if(f) f(el.dataset.arg, el);
});
render();
</script>
</body>
</html>
